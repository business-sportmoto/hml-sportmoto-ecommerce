.clip-admin-badge--destaque { background: rgba(245,158,11,.9); color: #fff; }
.clip-admin-badge--inativo  { background: rgba(100,116,139,.85); color: #fff; }
.clip-admin-badge--process  { background: rgba(99,102,241,.85); color: #fff; }
.clip-admin-badge--sem-poster{
  position: absolute; bottom: 8px; right: 8px; z-index: 2;
  background: rgba(220,38,38,.85); color: #fff;
  padding: 3px 7px; border-radius: 6px;
  font-size: 10px; font-weight: 700;
}

/* Stats chips sobre o thumb, canto inferior esq */
.clip-admin-stats-row {
  position: absolute; bottom: 8px; left: 8px;
  display: flex; gap: 5px; z-index: 2;
}
.clip-admin-stat {
  display: inline-flex; align-items: center; gap: 3px;
  padding: 3px 7px;
  background: rgba(0,0,0,.65);
  backdrop-filter: blur(4px);
  border-radius: 99px;
  font-size: 10.5px; font-weight: 700; color: rgba(255,255,255,.9);
}
.clip-admin-stat svg { flex-shrink:0; }

/* Corpo do card */
.clip-admin-body {
  padding: 10px 12px;
  flex: 1; min-width: 0;
  display: flex; flex-direction: column; gap: 5px;
}
.clip-admin-titulo {
  font-size: 13px; font-weight: 700;
  color: var(--text);
  white-space: nowrap; overflow: hidden;
  text-overflow: ellipsis;
  line-height: 1.3;
}
.clip-admin-produto {
  font-size: 11px; color: var(--text-3);
  white-space: nowrap; overflow: hidden;
  text-overflow: ellipsis;
}
.clip-admin-produto svg { display: inline; vertical-align: middle; }

/* Ações do card */
.clip-admin-actions {
  display: flex; gap: 4px;
  padding: 8px 10px;
  border-top: 1px solid var(--bg);
  background: var(--bg);
}
.clip-admin-action {
  flex: 1; display: flex; align-items: center; justify-content: center;
  padding: 7px 6px;
  background: var(--surface); border: 1.5px solid transparent;
  border-radius: 8px; cursor: pointer;
  font-family: inherit; font-size: 10.5px; font-weight: 700;
  color: var(--text-2); gap: 4px;
  transition: all .15s; text-decoration: none;
}
.clip-admin-action:hover {
  border-color: var(--border); color: var(--text);
}
.clip-admin-action--ativo:hover  { border-color:#16a34a; color:#16a34a; background:#f0fdf4; }
.clip-admin-action--inativo:hover{ border-color:#94a3b8; color:#475569; }
.clip-admin-action--destaque.is-on { color: #f59e0b; }
.clip-admin-action--destaque.is-on:hover { border-color:#f59e0b; background:#fefce8; }
.clip-admin-action--edit:hover   { border-color:var(--blue); color:var(--blue); background:#eff6ff; }
.clip-admin-action--del:hover    { border-color:#dc2626; color:#dc2626; background:#fef2f2; }
.clip-admin-action--poster:hover { border-color:#7c3aed; color:#7c3aed; background:#f5f3ff; }

/* Estado de loading da ação */
.clip-admin-action.is-loading { pointer-events: none; opacity: .5; }

/* ── Scroll infinito ──────────────────────────────────── */
.clips-load-more {
  display: flex; align-items: center; justify-content: center;
  gap: 10px; padding: 28px;
  font-size: 13px; color: var(--text-3); font-weight: 600;
}
.clips-load-more[hidden] { display: none; }
.clips-spinner svg {
  animation: clips-spin .9s linear infinite;
  color: var(--text-3);
}
@keyframes clips-spin { to { transform: rotate(360deg); } }

/* ── Animação de entrada ──────────────────────────────── */
.clip-admin-card {
  animation: card-in .3s ease both;
}
@keyframes card-in {
  from { opacity: 0; transform: translateY(8px) scale(.98); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

/* Gerar poster: spinner inline no thumb */
.clip-thumb-generating {
  position: absolute; inset: 0;
  background: rgba(0,0,0,.7);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 8px; z-index: 10; color: #fff;
  font-size: 11px; font-weight: 700;
}
.clip-thumb-generating svg {
  animation: clips-spin .9s linear infinite;
}


.qa-admin-list { display: flex; flex-direction: column; gap: 14px; }
.qa-admin-card {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: var(--r-xl);
  padding: 18px 20px;
}
.qa-admin-head {
  display: flex; justify-content: space-between; align-items: flex-start;
  gap: 12px; margin-bottom: 14px; flex-wrap: wrap;
}
.qa-admin-author { display: flex; align-items: center; gap: 10px; }
.qa-admin-avatar {
  width: 36px; height: 36px; border-radius: 50%;
  background: linear-gradient(135deg, #3b82f6, #1e40af);
  color: #fff; display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 800;
}
.qa-admin-author strong { display: block; font-size: 13.5px; color: var(--text); }
.qa-admin-author span   { font-size: 11.5px; color: var(--text-3); }
.qa-admin-produto {
  font-size: 12.5px; color: var(--blue); text-decoration: none;
  background: var(--bg); padding: 6px 12px; border-radius: 8px;
}
.qa-admin-pergunta { background: var(--bg); padding: 14px; border-radius: 10px; margin-bottom: 14px; }
.qa-admin-pergunta strong { display: block; font-size: 11px; text-transform: uppercase; color: var(--text-3); margin-bottom: 4px; }
.qa-admin-pergunta p { font-size: 14.5px; color: var(--text); line-height: 1.5; margin-bottom: 6px; }
.qa-admin-pergunta small { font-size: 11.5px; color: var(--text-3); }
.qa-admin-resposta {
  background: #f0fdf4; border-left: 3px solid var(--success);
  padding: 14px; border-radius: 10px;
}
.qa-admin-resposta strong { display: block; font-size: 11px; text-transform: uppercase; color: var(--success); margin-bottom: 4px; }
.qa-admin-resposta p      { font-size: 13.5px; color: var(--text); line-height: 1.6; white-space: pre-wrap; }
.qa-admin-resposta small  { font-size: 11px; color: var(--text-3); }
.qa-admin-form textarea {
  width: 100%; padding: 12px;
  border: 1.5px solid var(--border); border-radius: 10px;
  font-family: inherit; font-size: 14px; resize: vertical;
  min-height: 100px; outline: none; line-height: 1.5;
}
.qa-admin-form textarea:focus { border-color: var(--blue); }
.qa-admin-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }


/* ════════════════════════════════════════════════════════
   admin-coupon.css — estilos do módulo de cupons
   Append em assets/css/admin.css
   ════════════════════════════════════════════════════════ */

/* ── Admin page header ──────────────────────────────── */
.admin-page { padding: 24px 28px; max-width: 1400px; }
.admin-page-header {
  display: flex; align-items: flex-start;
  justify-content: space-between; gap: 16px;
  margin-bottom: 24px; flex-wrap: wrap;
}
.admin-page-title { font-size: 22px; font-weight: 800; color: var(--c-dark); margin: 0 0 4px; }
.admin-page-sub   { font-size: 13px; color: var(--c-text-muted); margin: 0; }
.back-link {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 12.5px; font-weight: 700; color: var(--c-text-muted);
  text-decoration: none; margin-bottom: 6px;
}
.back-link:hover { color: var(--c-primary); }

/* ── Stats grid ─────────────────────────────────────── */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 14px; margin-bottom: 24px;
}
.stats-grid--5 { grid-template-columns: repeat(5, 1fr); }
@media (max-width: 1100px) { .stats-grid, .stats-grid--5 { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 600px)  { .stats-grid, .stats-grid--5 { grid-template-columns: 1fr; } }

.stat-card {
  background: #fff; border: 1px solid var(--c-border);
  border-radius: 12px; padding: 16px 18px;
  display: flex; align-items: center; gap: 14px;
}
.stat-card--highlight { box-shadow: 0 0 0 2px rgba(var(--c-primary-rgb,37,99,235),.15); }
.stat-card-icon {
  width: 44px; height: 44px; border-radius: 10px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
}
.stat-card-icon--green  { background: #f0fdf4; color: #16a34a; }
.stat-card-icon--blue   { background: #eff6ff; color: #2563eb; }
.stat-card-icon--purple { background: #f5f3ff; color: #7c3aed; }
.stat-card-icon--red    { background: #fef2f2; color: #dc2626; }
.stat-card-icon--orange { background: #fff7ed; color: #d97706; }
.stat-card-body { display: flex; flex-direction: column; gap: 2px; }
.stat-card-value { font-size: 22px; font-weight: 800; color: var(--c-dark); letter-spacing: -.5px; }
.stat-card-label { font-size: 12px; color: var(--c-text-muted); font-weight: 500; }
.stat-card-delta { font-size: 11.5px; font-weight: 700; }
.stat-card-delta--up { color: #16a34a; }

/* ── Filtros ────────────────────────────────────────── */
.admin-filters { margin-bottom: 16px; }
.filter-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.filter-group { min-width: 160px; }
.filter-group--search { flex: 1; min-width: 200px; }
.filter-inline { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.filter-sep { font-size: 12.5px; color: var(--c-text-muted); }

/* ── Admin card ─────────────────────────────────────── */
.admin-card {
  background: #fff; border: 1px solid var(--c-border);
  border-radius: 12px; overflow: hidden;
  margin-bottom: 20px;
}
.admin-card-title {
  font-size: 14px; font-weight: 800; color: var(--c-dark);
  padding: 14px 18px; border-bottom: 1px solid var(--c-border);
  margin: 0;
}

/* ── Tabela ─────────────────────────────────────────── */
.table-wrap { overflow-x: auto; }
.admin-table {
  width: 100%; border-collapse: collapse; font-size: 13.5px;
}
.admin-table th {
  background: #f8fafc; padding: 10px 14px;
  font-size: 11px; font-weight: 800; text-transform: uppercase;
  letter-spacing: .4px; color: var(--c-text-muted);
  text-align: left; border-bottom: 1px solid var(--c-border);
  white-space: nowrap;
}
.admin-table td {
  padding: 11px 14px; border-bottom: 1px solid #f1f5f9;
  vertical-align: middle;
}
.admin-table tbody tr:last-child td { border-bottom: none; }
.admin-table tbody tr:hover { background: #f8fafc; }
.admin-table--compact th, .admin-table--compact td { padding: 8px 12px; }
.row-muted { opacity: .55; }
.text-center { text-align: center !important; }
.text-right  { text-align: right  !important; }

/* ── Coupon code badge ──────────────────────────────── */
.coupon-code-badge {
  display: inline-flex; align-items: center;
  padding: 3px 9px; background: #f1f5f9;
  border-radius: 6px; font-family: 'SF Mono',Monaco,Consolas,monospace;
  font-size: 12.5px; font-weight: 700; color: #334155;
  letter-spacing: .3px;
}
.coupon-code-badge--lg  { font-size: 15px; padding: 4px 12px; }
.coupon-code-badge--sm  { font-size: 11px; padding: 2px 7px; }

/* ── Badges de status e tipo ────────────────────────── */
.badge {
  display: inline-flex; align-items: center;
  padding: 2px 8px; border-radius: 99px;
  font-size: 11px; font-weight: 700; white-space: nowrap;
}
.badge-green  { background: #f0fdf4; color: #16a34a; }
.badge-red    { background: #fef2f2; color: #dc2626; }
.badge-blue   { background: #eff6ff; color: #2563eb; }
.badge-purple { background: #f5f3ff; color: #7c3aed; }
.badge-orange { background: #fff7ed; color: #d97706; }
.badge-yellow { background: #fefce8; color: #a16207; }
.badge-gray   { background: #f1f5f9; color: #64748b; }
.badge-teal   { background: #f0fdfa; color: #0f766e; }
.badge-pink   { background: #fdf2f8; color: #9d174d; }
.badge-indigo { background: #eef2ff; color: #4338ca; }

.status-badge {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 10px; border-radius: 99px;
  font-size: 11.5px; font-weight: 700;
}
.status-badge--green  { background: #f0fdf4; color: #15803d; }
.status-badge--red    { background: #fef2f2; color: #dc2626; }
.status-badge--yellow { background: #fefce8; color: #a16207; }
.status-badge--gray   { background: #f1f5f9; color: #64748b; }

/* ── Barra de uso ───────────────────────────────────── */
.uso-count { font-size: 13px; font-weight: 600; color: var(--c-dark); }
.uso-bar {
  height: 4px; background: #f1f5f9; border-radius: 99px;
  overflow: hidden; margin-top: 4px; width: 60px;
}
.uso-bar-fill { height: 100%; background: var(--c-primary); border-radius: 99px; min-width: 4px; }
.uso-bar-fill--full { background: #dc2626; }

/* ── Botões de ação na tabela ───────────────────────── */
.action-btns { display: flex; gap: 4px; justify-content: flex-end; }
.btn-icon {
  width: 32px; height: 32px;
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-bg); border: 1px solid var(--c-border);
  border-radius: 7px; cursor: pointer; color: var(--c-text-muted);
  text-decoration: none; transition: all .15s;
}
.btn-icon:hover { background: var(--c-primary-l); color: var(--c-primary); border-color: var(--c-primary); }
.btn-icon--danger:hover { background: #fef2f2; color: #dc2626; border-color: #fca5a5; }

/* ── Form sections ──────────────────────────────────── */
.form-grid-2col {
  display: grid;
  grid-template-columns: 1fr 360px;
  gap: 20px; align-items: start;
}
@media (max-width: 960px) { .form-grid-2col { grid-template-columns: 1fr; } }

.form-section { padding: 20px; margin-bottom: 0; }
.form-section-title {
  font-size: 13.5px; font-weight: 800; color: var(--c-dark);
  margin: 0 0 16px; padding-bottom: 10px; border-bottom: 1px solid var(--c-border);
}
.form-section-label {
  display: block; font-size: 12px; font-weight: 700;
  color: var(--c-text-muted); text-transform: uppercase;
  letter-spacing: .4px; margin: 12px 0 8px;
}

.input-symbol-wrap { position: relative; }
.input-symbol {
  position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
  font-size: 12.5px; font-weight: 700; color: var(--c-text-muted); pointer-events: none;
}
.with-symbol { padding-left: 30px !important; }

.toggle-field {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 0; cursor: pointer; font-size: 13px; font-weight: 500;
  color: var(--c-text);
}
.toggle-field input { display: none; }
.toggle-slider {
  width: 38px; height: 22px; border-radius: 11px;
  background: #cbd5e1; flex-shrink: 0; position: relative;
  transition: background .2s;
}
.toggle-slider::after {
  content: ''; position: absolute; top: 3px; left: 3px;
  width: 16px; height: 16px; border-radius: 50%;
  background: #fff; transition: transform .2s;
  box-shadow: 0 1px 3px rgba(0,0,0,.2);
}
.toggle-field input:checked ~ .toggle-slider { background: var(--c-primary); }
.toggle-field input:checked ~ .toggle-slider::after { transform: translateX(16px); }

.form-actions-sticky {
  position: sticky; top: 20px;
  display: flex; flex-direction: column; gap: 8px;
}

/* Progressivo */
.progressivo-header, .progressivo-row {
  display: grid; grid-template-columns: 1fr 1fr 1fr 80px 32px;
  gap: 6px; align-items: center; margin-bottom: 6px;
}
.progressivo-header {
  font-size: 11px; font-weight: 700; color: var(--c-text-muted);
  text-transform: uppercase; letter-spacing: .3px;
}

/* ── Vendedor chip ──────────────────────────────────── */
.vendedor-chip {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 9px; background: #fefce8;
  border: 1px solid #fde68a; border-radius: 99px;
  font-size: 11.5px; font-weight: 700; color: #92400e;
}

/* ── Abas ───────────────────────────────────────────── */
.admin-tabs {
  display: flex; gap: 2px; border-bottom: 2px solid var(--c-border);
  margin-bottom: 16px;
}
.admin-tab {
  padding: 9px 18px; background: none; border: none;
  font-family: inherit; font-size: 13.5px; font-weight: 600;
  color: var(--c-text-muted); cursor: pointer; border-bottom: 2px solid transparent;
  margin-bottom: -2px; transition: all .15s;
}
.admin-tab:hover { color: var(--c-dark); }
.admin-tab.is-active { color: var(--c-primary); border-bottom-color: var(--c-primary); font-weight: 800; }
.admin-tab-panel[hidden] { display: none; }

/* ── Relatório layout ───────────────────────────────── */
.relatorio-grid {
  display: grid; grid-template-columns: 2fr 1fr;
  gap: 20px; margin-bottom: 20px;
}
.relatorio-grid--3 { grid-template-columns: repeat(3, 1fr); }
@media (max-width: 960px) {
  .relatorio-grid, .relatorio-grid--3 { grid-template-columns: 1fr; }
}
.relatorio-card { margin-bottom: 0; }
.relatorio-card--wide { grid-column: span 1; }

/* ── Dots de status ─────────────────────────────────── */
.dot {
  display: inline-block; width: 8px; height: 8px;
  border-radius: 50%;
}
.dot--green { background: #16a34a; }
.dot--red   { background: #dc2626; }

/* ── Paginação ──────────────────────────────────────── */
.pagination {
  display: flex; gap: 4px; padding: 14px 18px;
  border-top: 1px solid var(--c-border); flex-wrap: wrap;
}
.pagination-item {
  min-width: 34px; height: 34px; display: flex;
  align-items: center; justify-content: center;
  border-radius: 7px; font-size: 13px; font-weight: 600;
  text-decoration: none; color: var(--c-text-muted);
  background: var(--c-bg); border: 1px solid var(--c-border);
  transition: all .15s;
}
.pagination-item:hover  { color: var(--c-primary); border-color: var(--c-primary); }
.pagination-item.is-active { background: var(--c-primary); color: #fff; border-color: var(--c-primary); font-weight: 800; }

/* ── Misc ───────────────────────────────────────────── */
.td-main    { font-size: 13.5px; font-weight: 600; color: var(--c-dark); }
.td-main--sm{ font-size: 12.5px; }
.td-dates   { display: flex; flex-direction: column; gap: 1px; font-size: 12.5px; }
.txt-green  { color: #16a34a !important; }
.txt-red    { color: #dc2626 !important; }
.txt-muted  { color: var(--c-text-muted) !important; }
.txt-success{ color: var(--c-success); }
.link-subtle{ color: var(--c-primary); text-decoration: none; font-weight: 700; }
.link-subtle:hover { text-decoration: underline; }
.mt-2 { margin-top: 8px; }
.p-4  { padding: 16px; }
.empty-state {
  padding: 48px 24px; display: flex; flex-direction: column;
  align-items: center; gap: 10px; text-align: center; color: var(--c-text-muted);
}
.empty-state svg { color: #e2e8f0; }
.empty-state strong { font-size: 14px; font-weight: 800; color: var(--c-dark); }

.header-actions { display: flex; align-items: center; gap: 10px; }
.btn-sm { padding: 6px 14px; font-size: 12.5px; }
.btn-ghost { background: none; border: none; color: var(--c-text-muted); font-weight: 700; cursor: pointer; }
.btn-ghost:hover { color: var(--c-dark); }


:root{--cl-blue:#0a66c2;--cl-blue-bg:#e8f0fb;--cl-blue-text:#0a3d7a;--cl-green-bg:#dcfce7;--cl-green-text:#166534;--cl-amber-bg:#fef9c3;--cl-amber-text:#854d0e;--cl-red-bg:#fee2e2;--cl-red-text:#991b1b;--cl-gray-bg:#f1f5f9;--cl-gray-text:#475569;--cl-border:#e2e8f0;--cl-border-dark:#cbd5e1;--cl-bg:#fff;--cl-bg-surface:#f8fafc;--cl-text:#0f172a;--cl-text-muted:#64748b;--cl-text-hint:#94a3b8;--cl-radius-sm:6px;--cl-radius-md:8px;--cl-radius-lg:12px;--cl-shadow:0 1px 3px #00000012 0 1px 2px #0000000a}
/* @media (prefers-color-scheme: dark) {
:root{--cl-blue:#60a5fa;--cl-blue-bg:#1e3a5f;--cl-blue-text:#bfdbfe;--cl-green-bg:#14532d;--cl-green-text:#bbf7d0;--cl-amber-bg:#78350f;--cl-amber-text:#fde68a;--cl-red-bg:#7f1d1d;--cl-red-text:#fecaca;--cl-gray-bg:#1e293b;--cl-gray-text:#94a3b8;--cl-border:#334155;--cl-border-dark:#475569;--cl-bg:#1e293b;--cl-bg-surface:#0f172a;--cl-text:#f1f5f9;--cl-text-muted:#94a3b8;--cl-text-hint:#64748b;--cl-shadow:0 1px 3px #0006}
} */
.cl-scope *,.cl-scope ::before,.cl-scope ::after{box-sizing:border-box;margin:0;padding:0}
.cl-scope{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;font-size:14px;color:var(--cl-text);line-height:1.5}
.cl-breadcrumb{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--cl-text-muted);margin-bottom:20px;flex-wrap:wrap}
.cl-breadcrumb a{color:inherit;text-decoration:none}
.cl-breadcrumb a:hover{color:var(--cl-blue)}
.cl-breadcrumb .sep{color:var(--cl-text-hint)}
.cl-breadcrumb .current{color:var(--cl-text);font-weight:500}
.cl-breadcrumb .spacer{margin-left:auto;display:flex;gap:6px}
.cl-kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:20px}

/* =============================================================================
   SPORTMOTO ADMIN — DARK THEME COMPATIBILITY LAYER
   Gerado em 2026-08-05
   Estratégia: preserva 100% do CSS original e aplica o tema escuro no fim da
   cascata. Nenhuma classe, ID, breakpoint ou animação existente foi removida.
   ============================================================================= */

html[data-theme="dark"] {
  color-scheme: dark;

  /* Brand */
  --grad-primary: linear-gradient(135deg, #3b82f6 0%, #10b981 100%);
  --grad-primary-soft: linear-gradient(135deg, rgba(59,130,246,.16) 0%, rgba(16,185,129,.13) 100%);
  --grad-hero: linear-gradient(135deg, #172554 0%, #064e3b 100%);
  --blue: #60a5fa;
  --green: #34d399;
  --blue-lt: #172554;
  --green-lt: #052e24;

  /* Core surfaces */
  --bg: #080c12;
  --surface: #111821;
  --surface2: #182230;
  --border: #263244;
  --border2: #3a4960;
  --text: #f8fafc;
  --text-2: #cbd5e1;
  --text-3: #8190a5;

  /* Semantic surfaces */
  --success: #34d399;
  --success-lt: #063c2e;
  --warning: #fbbf24;
  --warning-lt: #422006;
  --danger: #fb7185;
  --danger-lt: #4c101c;
  --info: #38bdf8;
  --info-lt: #082f49;
  --muted-lt: #182230;
  --purple:     #a78bfa;
  --purple-lt:  #2e1065;
  --purple-bd:  #4c1d95;
  --success-bd: #14532d;
  --danger-bd:  #7f1d1d;
  --warning-bd: #78350f;
  --blue-bd:    #1e3a5f;
  --dartk: #090d14;

  /* Elevated shadows for dark surfaces */
  --shadow-xs: 0 1px 2px rgba(0,0,0,.28);
  --shadow-sm: 0 2px 10px rgba(0,0,0,.30), 0 1px 2px rgba(0,0,0,.22);
  --shadow-md: 0 10px 30px rgba(0,0,0,.34), 0 2px 8px rgba(0,0,0,.24);
  --shadow-lg: 0 22px 60px rgba(0,0,0,.46), 0 8px 22px rgba(0,0,0,.30);

  /* Legacy aliases used by older admin modules */
  --c-bg: var(--bg);
  --c-surface: var(--surface);
  --c-border: var(--border);
  --c-dark: var(--text);
  --c-text: var(--text-2);
  --c-text-muted: var(--text-3);
  --c-muted: var(--text-3);
  --c-primary: var(--blue);
  --c-primary-l: var(--blue-lt);
  --c-primary-rgb: 96, 165, 250;
  --c-accent: var(--blue);
  --c-accent-l: var(--blue-lt);
  --c-success: var(--success);

  /* Customer-list namespace */
  --cl-blue: #60a5fa;
  --cl-blue-bg: #172554;
  --cl-blue-text: #bfdbfe;
  --cl-green-bg: #064e3b;
  --cl-green-text: #a7f3d0;
  --cl-amber-bg: #451a03;
  --cl-amber-text: #fde68a;
  --cl-red-bg: #4c0519;
  --cl-red-text: #fecdd3;
  --cl-gray-bg: #182230;
  --cl-gray-text: #a8b5c7;
  --cl-border: #2b394c;
  --cl-border-dark: #465872;
  --cl-bg: #111821;
  --cl-bg-surface: #080c12;
  --cl-text: #f8fafc;
  --cl-text-muted: #a8b5c7;
  --cl-text-hint: #718096;
  --cl-shadow: 0 10px 30px rgba(0,0,0,.30);

/* ═══════════════════════════════════════════════════════════════════════════
   SPORTMOTO ADMIN — DARK THEME COMPATIBILITY LAYER
   Arquivo: functions.dark.css
   Estratégia: mantém todas as regras originais e aplica overrides ao final.
   ═══════════════════════════════════════════════════════════════════════════ */

html[data-theme="dark"] {
  --admin-drawer-overlay: rgba(2,6,12,.76);
  --admin-drawer-background: #111821;
  --admin-drawer-border: #2a3749;
  --admin-drawer-text: #f8fafc;
  --admin-drawer-muted: #9aa8ba;
  --admin-drawer-shadow: -24px 0 70px rgba(0,0,0,.52), -1px 0 0 rgba(255,255,255,.035);
}

html[data-theme="dark"] { color-scheme: dark; }

/* Overlay: suporta tanto a API antiga (.visible) quanto a nova (.is-visible). */
html[data-theme="dark"] #admin-drawer-overlay {
  background: var(--admin-drawer-overlay);
  backdrop-filter: blur(5px) saturate(90%);
  -webkit-backdrop-filter: blur(5px) saturate(90%);
}

/* Drawer */
html[data-theme="dark"] .admin-drawer {
  color: var(--admin-drawer-text);
  background: var(--admin-drawer-background);
  border-left: 1px solid var(--admin-drawer-border);
  box-shadow: var(--admin-drawer-shadow);
}
html[data-theme="dark"] .admin-drawer-header, html[data-theme="dark"] .admin-drawer-footer {
  background: #0f161f;
  border-color: var(--admin-drawer-border);
}
html[data-theme="dark"] .admin-drawer-titulo { color: var(--admin-drawer-text); }
html[data-theme="dark"] .admin-drawer-subtitulo, html[data-theme="dark"] .admin-drawer-loading { color: var(--admin-drawer-muted); }

html[data-theme="dark"] .admin-drawer-close {
  color: #a8b5c7;
  background: #182230;
  border: 1px solid #2a3749;
}
html[data-theme="dark"] .admin-drawer-close:hover {
  color: #fda4af;
  background: #4c101c;
  border-color: rgba(251,113,133,.40);
}
html[data-theme="dark"] .admin-drawer-close:focus-visible {
  outline-color: #60a5fa;
  box-shadow: 0 0 0 4px rgba(96,165,250,.14);
}

html[data-theme="dark"] .admin-drawer-body {
  background: var(--admin-drawer-background);
  color: var(--admin-drawer-text);
  scrollbar-width: thin;
  scrollbar-color: #40516a transparent;
}
html[data-theme="dark"] .admin-drawer-body::-webkit-scrollbar { width: 8px; height: 8px; }
html[data-theme="dark"] .admin-drawer-body::-webkit-scrollbar-thumb {
  background: #40516a;
  border: 2px solid transparent;
  border-radius: 999px;
  background-clip: padding-box;
}
html[data-theme="dark"] .admin-drawer-spinner {
  border-color: #40516a;
  border-top-color: #60a5fa;
}

/* Controles genéricos carregados dinamicamente dentro do drawer. */
html[data-theme="dark"] .admin-drawer :where(input:not([type="checkbox"]):not([type="radio"]), select, textarea) {
  color-scheme: dark;
  color: #f8fafc;
  background-color: #0c121b;
  border-color: #40516a;
  caret-color: #60a5fa;
}
html[data-theme="dark"] .admin-drawer :where(input, select, textarea)::placeholder { color: #66768c; }
html[data-theme="dark"] .admin-drawer :where(input:not([type="checkbox"]):not([type="radio"]), select, textarea):focus {
  border-color: #60a5fa;
  box-shadow: 0 0 0 3px rgba(96,165,250,.16);
  outline: none;
}
html[data-theme="dark"] .admin-drawer :where(input[type="checkbox"], input[type="radio"]) { accent-color: #60a5fa; }
html[data-theme="dark"] .admin-drawer option { color: #f8fafc; background: #111821; }

/* Autofill escuro */
html[data-theme="dark"] .admin-drawer input:-webkit-autofill, html[data-theme="dark"] .admin-drawer input:-webkit-autofill:hover, html[data-theme="dark"] .admin-drawer input:-webkit-autofill:focus {
  -webkit-text-fill-color: #f8fafc;
  -webkit-box-shadow: 0 0 0 1000px #0c121b inset;

  transition: background-color 9999s ease-out 0s;
}

    linear-gradient(var(--surface, #111821), var(--surface, #111821)) padding-box,

html[data-theme="dark"] .seoai-char-count { color: var(--success, #34d399); }
html[data-theme="dark"] .seoai-char-count.over { color: var(--danger, #fb7185); }

/* Compatibilidade com alternadores de tema existentes ou futuros. */
html[data-theme="dark"], html[data-theme="dark"].theme-dark, html[data-theme="dark"] body.dark-mode { color-scheme: dark; }

/* ── Grid da show page ───────────────────────────── */
.ap-grid {
  display: grid;
  grid-template-columns: 1fr 340px;
  gap: 20px; align-items: start;
}
.ap-main  { display: flex; flex-direction: column; }
.ap-aside { display: flex; flex-direction: column; }
@media (max-width: 960px) { .ap-grid { grid-template-columns: 1fr; } }

/* ── Card de ação lateral ────────────────────────── */
.ap-action-card { }
.ap-card-title {
  font-size: 13.5px; font-weight: 800; color: var(--c-dark);
  padding: 14px 18px; border-bottom: 1px solid var(--c-border);
  margin: 0; display: block;
}

/* ── Item do pedido ──────────────────────────────── */
.ap-item {
  display: flex; gap: 14px; align-items: center;
  padding: 14px 20px; border-bottom: 1px solid #f8fafc;
}
.ap-item:last-of-type { border-bottom: none; }
.ap-item-img {
  width: 56px; height: 56px; flex-shrink: 0;
  object-fit: cover; border-radius: 8px; background: #f1f5f9;
}
.ap-item-info { flex: 1; min-width: 0; }
.ap-item-name { font-size: 13.5px; font-weight: 600; color: var(--c-dark); margin-bottom: 3px; }
.ap-item-var  { font-size: 12px; color: var(--c-text-muted); margin-bottom: 2px; }
.ap-item-sku  { font-size: 11.5px; color: #94a3b8; }
.ap-item-nums { flex-shrink: 0; }
.ap-item-edit-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.form-control--xs { height: 32px; font-size: 12.5px; padding: 4px 8px; }
.btn-xs { height: 32px; padding: 0 10px; font-size: 12.5px; }

/* ── Histórico lateral ────────────────────────────── */
.ap-hist-item {
  display: flex; gap: 12px; align-items: flex-start;
  padding: 10px 0; position: relative;
  border-left: 2px solid #e2e8f0;
  margin-left: 9px; padding-left: 16px;
}
.ap-hist-item:last-child { border-left-color: transparent; }
.ap-hist-dot {
  width: 18px; height: 18px; border-radius: 50%;
  position: absolute; left: -10px; top: 10px;
  border: 2.5px solid #fff; box-shadow: 0 0 0 2px #e2e8f0;
}
.ap-hist-dot--first     { width: 20px; height: 20px; left: -11px; }
.ap-hist-dot--success   { background: #16a34a; box-shadow: 0 0 0 2px #bbf7d0; }
.ap-hist-dot--info      { background: #3b82f6; box-shadow: 0 0 0 2px #bfdbfe; }
.ap-hist-dot--primary   { background: #2563eb; box-shadow: 0 0 0 2px #bfdbfe; }
.ap-hist-dot--warning   { background: #f59e0b; box-shadow: 0 0 0 2px #fde68a; }
.ap-hist-dot--purple   { background: #7c3aed; box-shadow: 0 0 0 2px rgb(186, 173, 247); }
.ap-hist-dot--danger    { background: #ef4444; box-shadow: 0 0 0 2px #fecaca; }
.ap-hist-body           { flex: 1; min-width: 0; }

/* ── Busca de produto no modal ───────────────────── */
.ap-search-item {
  padding: 10px 12px; border-radius: 8px;
  border: 1px solid var(--c-border); margin-bottom: 6px;
  cursor: pointer; font-size: 13.5px; background: #fff;
  transition: border-color .15s, background .15s;
}
.ap-search-item:hover { border-color: var(--c-primary); background: var(--c-primary-l); }

/* ── Form labels pequenos ────────────────────────── */
.form-label-xs {
  display: block; font-size: 11px; font-weight: 700;
  text-transform: uppercase; letter-spacing: .5px;
  color: var(--c-text-muted); margin-bottom: 4px;
}
.badge-lg { font-size: 13.5px !important; padding: 5px 14px !important; }

/* ── Novo pedido — dropdown autocomplete ─────────── */
.np-dropdown {
  position: absolute; top: calc(100% + 4px); left: 0; right: 0;
  background: #fff; border: 1px solid var(--c-border);
  border-radius: 10px; box-shadow: 0 8px 32px rgba(0,0,0,.12);
  max-height: 280px; overflow-y: auto; z-index: 200;
}
.np-dropdown-item {
  padding: 10px 14px; cursor: pointer; font-size: 13.5px;
  border-bottom: 1px solid #f1f5f9; transition: background .1s;
}
.np-dropdown-item:last-child { border-bottom: none; }
.np-dropdown-item:hover { background: #f8fafc; }
.np-dropdown-item.np-no-result { color: var(--c-text-muted); cursor: default; }
.np-dropdown-item.np-no-result:hover { background: none; }

/* ── Novo pedido — cliente selecionado ───────────── */
.np-selected-card {
  background: #f8fafc; border: 1px solid var(--c-border);
  border-radius: 10px; padding: 12px 14px;
  display: flex; align-items: flex-start;
  justify-content: space-between; gap: 10px;
}

/* ── Novo pedido — endereços ─────────────────────── */
.np-endereco-opt {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 10px 12px; border: 1.5px solid var(--c-border);
  border-radius: 9px; cursor: pointer; margin-bottom: 8px;
  transition: border-color .15s, background .15s;
}
.np-endereco-opt:has(input:checked) {
  border-color: var(--c-primary); background: var(--c-primary-l);
}
.np-endereco-opt input[type="radio"] { margin-top: 3px; flex-shrink: 0; }
.np-end-info { display: flex; flex-direction: column; gap: 2px; }
.np-end-info strong { font-size: 13.5px; font-weight: 700; color: var(--c-dark); }
.np-end-info span   { font-size: 12.5px; color: var(--c-text-muted); }

/* ── Novo pedido — SKU picker ────────────────────── */
.np-sku-opt {
  display: flex; align-items: center; gap: 10px;
  padding: 11px 14px; border: 1.5px solid var(--c-border);
  border-radius: 9px; cursor: pointer; transition: all .15s;
}
.np-sku-opt:hover { border-color: var(--c-primary); background: var(--c-primary-l); }

/* ── Botão ícone destrutivo ──────────────────────── */
.btn-icon--danger {
  width: 28px; height: 28px; border-radius: 6px;
  background: none; border: 1px solid var(--c-border);
  display: inline-flex; align-items: center; justify-content: center;
  cursor: pointer; color: var(--c-text-muted); transition: all .15s;
}
.btn-icon--danger:hover { background: #fef2f2; color: #dc2626; border-color: #fca5a5; }

/* ── Toggle (checkbox visual) ────────────────────── */
.toggle-field {
  display: flex; align-items: center; gap: 10px;
  cursor: pointer; font-size: 13.5px; color: var(--c-dark);
}
.toggle-field input[type="checkbox"] { display: none; }
.toggle-slider {
  width: 36px; height: 20px; border-radius: 99px; flex-shrink: 0;
  background: #d1d5db; position: relative; transition: background .2s;
}
.toggle-slider::after {
  content: ''; position: absolute; top: 3px; left: 3px;
  width: 14px; height: 14px; border-radius: 50%;
  background: #fff; transition: transform .2s;
  box-shadow: 0 1px 3px rgba(0,0,0,.2);
}
.toggle-field input:checked ~ .toggle-slider { background: var(--c-primary); }
.toggle-field input:checked ~ .toggle-slider::after { transform: translateX(16px); }

/* ════════════════════════════════════════════════════════
   TIMELINE DE STATUS — show.php admin
   (cópia autossuficiente, sem depender de customer-orders.css)
   ════════════════════════════════════════════════════════ */

/* Card container */
.od-timeline-card {
  background: #fff;
  border: 1px solid var(--c-border);
  border-radius: 16px;
  box-shadow: 0 1px 3px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.04);
  overflow: hidden;
}

/* Header */
.odtl-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 24px 12px;
  border-bottom: 1px solid var(--c-border);
}
.odtl-header h3 {
  font-size: 14px; font-weight: 800;
  color: var(--c-dark); margin: 0;
}

/* Track — linha horizontal com os steps */
.odtl-track {
  display: flex; align-items: flex-start;
  padding: 22px 28px 26px;
  overflow-x: auto;
}

/* Step individual */
.odtls-step {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; min-width: 80px; position: relative;
}

/* Dot + connector no mesmo nível */
.odtls-dot-wrap {
  display: flex; align-items: center;
  width: 100%; justify-content: center;
  margin-bottom: 12px; position: relative;
}

/* Ícone circular */
.odtls-icon {
  width: 46px; height: 46px; border-radius: 50%;
  flex-shrink: 0; position: relative; z-index: 1;
  display: flex; align-items: center; justify-content: center;
  transition: all .25s;
}
.odtls-icon svg {
  width: 20px; height: 20px; display: block;
}

/* Done — verde preenchido */
.odtls-done .odtls-icon {
  background: #16a34a;
  box-shadow: 0 0 0 5px rgba(22,163,74,.14);
}
.odtls-done .odtls-icon svg { stroke: #fff; }

/* Active — borda azul com pulso */
.odtls-active .odtls-icon {
  background: #fff;
  border: 2px solid #2563eb;
  box-shadow: 0 0 0 5px rgba(37,99,235,.14);
  animation: tls-pulse-admin 2s ease infinite;
}
.odtls-active .odtls-icon svg { stroke: #2563eb; }

@keyframes tls-pulse-admin {
  0%,100% { box-shadow: 0 0 0 5px rgba(37,99,235,.14); }
  50%      { box-shadow: 0 0 0 9px rgba(37,99,235,.05); }
}

/* Future — cinza neutro */
.odtls-future .odtls-icon {
  background: #f1f5f9;
  border: 2px solid #e2e8f0;
}
.odtls-future .odtls-icon svg { stroke: #94a3b8; }

/* Linha conectora horizontal */
.odtls-line {
  position: absolute;
  top: 50%;
  left: calc(50% + 23px);
  right: calc(-50% + 23px);
  height: 2px;
  background: #e2e8f0;
  transform: translateY(-50%);
  z-index: 0;
  transition: background .3s;
}
.odtls-line--done { background: #86efac; }

/* Labels abaixo do ícone */
.odtls-label {
  display: flex; flex-direction: column;
  align-items: center; text-align: center; gap: 3px;
  padding: 0 4px;
}
.odtls-label strong {
  font-size: 12px; font-weight: 800;
  color: var(--c-dark); line-height: 1.35;
}
.odtls-label small {
  font-size: 11px; color: var(--c-text-muted);
  line-height: 1.4; word-break: break-word;
}

/* Cores por estado */
.odtls-done   .odtls-label strong { color: #15803d; }
.odtls-active .odtls-label strong { color: #1d4ed8; }
.odtls-future .odtls-label strong { color: #94a3b8; }
.odtls-future .odtls-label small  { color: #cbd5e1; }

/* Cancelado — apaga tudo */
.od-timeline-card--cancelled .odtls-icon {
  background: #fee2e2 !important;
  border: 2px solid #fca5a5 !important;
  box-shadow: none !important;
  animation: none !important;
}
.od-timeline-card--cancelled .odtls-icon svg { stroke: #fca5a5 !important; }
.od-timeline-card--cancelled .odtls-line     { background: #fee2e2 !important; }
.od-timeline-card--cancelled .odtls-label strong,
.od-timeline-card--cancelled .odtls-label small { color: #fca5a5 !important; }

/* Responsive */
@media (max-width: 640px) {
  .odtl-track { padding: 16px 12px 20px; }
  .odtls-step { min-width: 68px; }
  .odtls-icon { width: 36px; height: 36px; }
  .odtls-icon svg { width: 16px; height: 16px; }
  .odtls-label strong { font-size: 11px; }
  .odtls-label small  { font-size: 10px; }
}

/* ════════════════════════════════════════════════════════
   MODAL — od-modal-overlay (autossuficiente para o admin)
   ════════════════════════════════════════════════════════ */

.od-modal-overlay {
  position: fixed;
  inset: 0;
  z-index: 1000;
  background: rgba(0, 0, 0, .5);
  backdrop-filter: blur(3px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
    height: 100vh;
  /* Começa invisível — .is-open faz aparecer */
  opacity: 0;
  pointer-events: none;
  transition: opacity .22s ease;
}
.od-modal-overlay[hidden] {
  /* hidden attribute → display:none já esconde,
     mas garantimos também que não interfira no layout */
  display: none !important;
}
.od-modal-overlay.is-open {
  opacity: 1;
  pointer-events: all;
}

/* Caixa do modal */
.od-modal-box {
  background: #fff;
  border-radius: 18px;
  width: 100%;
  max-width: 480px;
  max-height: 90vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  box-shadow: 0 24px 80px rgba(0, 0, 0, .22);

  /* Animação de entrada */
  transform: translateY(14px) scale(.97);
  transition: transform .22s cubic-bezier(.34, 1.56, .64, 1);
}
.od-modal-overlay.is-open .od-modal-box {
  transform: translateY(0) scale(1);
}

/* Variante larga */
.od-modal-box--wide { max-width: 580px; }

/* Header */
.od-modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 22px 14px;
  border-bottom: 1px solid var(--c-border);
  flex-shrink: 0;
}
.od-modal-header h4 {
  font-size: 15px;
  font-weight: 800;
  color: var(--c-dark);
  margin: 0;
}

/* Botão fechar */
.od-modal-close {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  background: #f1f5f9;
  border: 1px solid var(--c-border);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--c-text-muted);
  flex-shrink: 0;
  transition: background .15s, color .15s;
}
.od-modal-close:hover {
  background: #fef2f2;
  color: #dc2626;
  border-color: #fca5a5;
}
.od-modal-close svg { stroke: currentColor; }

/* Body */
.od-modal-body {
  padding: 18px 22px 22px;
  overflow-y: auto;
  flex: 1;
  font-size: 14px;
  color: var(--c-text);
  line-height: 1.6;
}
.od-modal-body p         { margin: 0 0 10px; }
.od-modal-body p:last-child { margin-bottom: 0; }
.od-modal-body a         { color: var(--c-primary); font-weight: 600; }
.od-modal-body strong    { font-weight: 800; }

/* Responsivo */
@media (max-width: 480px) {
  .od-modal-overlay { padding: 12px; align-items: flex-end; }
  .od-modal-box { border-radius: 18px 18px 0 0; max-height: 85vh; }
}

:root{--ac-bg:#F8FAFC;--ac-surface:#fff;--ac-border:#6378a724;--ac-shadow:0 1px 3px #0a0f1e0f 0 8px 24px #0a0f1e0a;--ac-shadow-lg:0 4px 6px #0a0f1e0a 0 20px 40px #0a0f1e14;--ac-dark:#0a0f1e;--ac-muted:#6b7a99;--ac-accent:#2563eb;--ac-accent-l:#eff6ff;--ac-accent-xl:#f0f5ff;--ac-success:#059669;--ac-warn:#d97706;--ac-danger:#dc2626;--ac-radius:16px;--ac-radius-sm:10px;--ac-font:-apple-system,'SF Pro Display','Segoe UI',system-ui,sans-serif;--ac-mono:'SF Mono','JetBrains Mono',monospace}

.ac-header-left{display:flex;align-items:flex-start;gap:20px;position:relative;z-index:1;flex:1}

.ac-alert{border-radius:var(--ac-radius-sm);padding:13px 18px;font-size:13.5px;margin-bottom:10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-weight:500;border:none}

.cfg-layout{display:grid;grid-template-columns:210px 1fr;gap:20px;align-items:start}

.cfg-nav-item{display:flex;align-items:center;gap:9px;padding:9px 12px;font-size:13px;font-weight:500;color:var(--ac-muted);text-decoration:none;border-radius:var(--ac-radius-sm);transition:background .12s,color .12s;cursor:pointer;border:none;position:relative}

.cfg-grupo-header{display:flex;align-items:center;gap:9px;margin-bottom:10px;padding:0 2px}
.cfg-grupo-header svg{stroke:var(--ac-muted);width:15px;height:15px}
.cfg-grupo h2{font-size:13px;font-weight:800;color:var(--ac-muted);margin:0;text-transform:uppercase;letter-spacing:.6px}
.cfg-card{background:var(--ac-surface);border:1px solid var(--ac-border);border-radius:var(--ac-radius);box-shadow:var(--ac-shadow);overflow:hidden;transition:box-shadow .2s}
.cfg-card:hover{box-shadow:var(--ac-shadow-lg)}
#ac-stats .stats-grid{display:grid!important;grid-template-columns:1fr 1fr 1fr!important;gap:12px!important}
.stat-card{background:var(--ac-surface);border:1px solid var(--ac-border);border-radius:var(--ac-radius);padding:20px 22px;box-shadow:var(--ac-shadow);position:relative;overflow:hidden;transition:transform .2s cubic-bezier(.22,1,.36,1),box-shadow .2s}
.stat-card:hover{transform:translateY(-2px);box-shadow:var(--ac-shadow-lg)}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--ac-accent),#06b6d4);opacity:0;transition:opacity .2s}
.stat-card:hover::before{opacity:1}
.stat-card:nth-child(2){background:linear-gradient(135deg,var(--ac-dark) 0%,#1e3a6e 100%);border-color:transparent;color:#fff}
.stat-card:nth-child(2) .stat-card-value{color:#fff!important}
.stat-card:nth-child(2) .stat-card-label{color:#ffffff8c!important}
.stat-card:nth-child(2)::before{opacity:1}
.stat-card-body{display:flex;flex-direction:column;gap:4px}
.stat-card-value{font-size:22px;font-weight:900;color:var(--ac-dark);letter-spacing:-.5px;line-height:1;font-variant-numeric:tabular-nums}
.stat-card-label{font-size:12px;font-weight:600;color:var(--ac-muted);text-transform:uppercase;letter-spacing:.4px}
#ac-stats > div:last-child{background:var(--ac-surface);border:1px solid var(--ac-border);border-radius:var(--ac-radius-sm);padding:12px 16px;margin-top:0!important}
.cfg-row{display:flex;align-items:center;gap:16px;padding:13px 20px;border-bottom:1px solid var(--ac-border);transition:background .1s}
.cfg-row:last-child{border-bottom:none}
.cfg-row:hover{background:#fafbff}
.cfg-row--last{border-bottom:none}
.cfg-row-info{flex:1}
.cfg-row-label{font-size:13px;font-weight:600;color:var(--ac-dark)}
.cfg-row-chave{font-family:var(--ac-mono);font-size:11px;color:var(--ac-muted);background:var(--ac-bg);padding:2px 7px;border-radius:5px}
.cfg-row-valor{flex-shrink:0;font-size:13.5px;color:var(--ac-dark);max-width:280px;text-align:right}
.ac-nota{display:flex;align-items:flex-start;gap:12px;padding:14px 20px;border-bottom:1px solid var(--ac-border);transition:background .1s}
.ac-nota:last-of-type{border-bottom:none}
.ac-nota:hover{background:#fafbff}
.ac-nota-body{flex:1}
.ac-nota-body p{font-size:13.5px;color:var(--ac-dark);margin:0 0 6px;line-height:1.6}
.ac-nota-meta{font-size:12px;color:var(--ac-muted)}
.ac-nota-meta strong{color:var(--ac-accent)}
.ac-nota::before{content:'';width:3px;align-self:stretch;background:linear-gradient(180deg,#fde047,#f59e0b);border-radius:99px;flex-shrink:0}
.admin-table{width:100%;border-collapse:collapse}
.admin-table thead tr{background:var(--ac-bg);border-bottom:1px solid var(--ac-border)}
.admin-table th{padding:10px 16px;font-size:11px;font-weight:800;color:var(--ac-muted);text-transform:uppercase;letter-spacing:.6px;text-align:left}
.admin-table td{padding:12px 16px;border-bottom:1px solid var(--ac-border)}
.admin-table tbody tr:last-child td{border-bottom:none}
.admin-table tbody tr{transition:background .1s}
.admin-table tbody tr:hover{background:var(--ac-accent-xl)}
#ac-score .cfg-card{position:relative;overflow:hidden}
#ac-score .cfg-card:first-child::after{content:'';position:absolute;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,var(--ac-accent) 0%,transparent 70%);opacity:.05;top:-40px;right:-40px;pointer-events:none}
#ac-wishlist [style*="grid-template-columns"] > a{border-radius:var(--ac-radius-sm)!important;border:1px solid var(--ac-border)!important;transition:transform .2s cubic-bezier(.22,1,.36,1),box-shadow .2s;overflow:hidden}
#ac-wishlist [style*="grid-template-columns"] > a:hover{transform:translateY(-3px) scale(1.02);box-shadow:var(--ac-shadow-lg)}
.ap-item{padding:14px 20px;border-bottom:1px solid var(--ac-border);transition:background .1s}
.ap-item:hover{background:var(--ac-accent-xl)}
.ap-item-img{border-radius:var(--ac-radius-sm)}
#ac-timeline .ap-hist-item{border-left:2px solid var(--ac-border);margin-left:9px;padding-left:18px;padding-bottom:14px;transition:border-color .15s}
#ac-timeline .ap-hist-item:hover{border-left-color:var(--ac-accent)}
#ac-timeline .ap-hist-dot{width:20px;height:20px;left:-11px;border:2.5px solid var(--ac-surface);box-shadow:0 0 0 2px var(--ac-border)}
#ac-timeline .ap-hist-item:hover .ap-hist-dot{box-shadow:0 0 0 3px var(--ac-accent-l)}
.badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;letter-spacing:.2px;display:inline-block}
.badge-success{background:#f0fdf4;color:var(--ac-success)}
.badge-danger{background:#fef2f2;color:var(--ac-danger)}
.badge-warning{background:#fffbeb;color:var(--ac-warn)}
.badge-info{background:var(--ac-accent-l);color:var(--ac-accent)}
.badge-primary{background:var(--ac-accent-l);color:var(--ac-accent)}
.form-control{border:1.5px solid var(--ac-border);border-radius:var(--ac-radius-sm);padding:9px 12px;font-size:13.5px;font-family:var(--ac-font);color:var(--ac-dark);background:var(--ac-surface);transition:border-color .15s,box-shadow .15s;width:100%;box-sizing:border-box}
.form-control:focus{outline:none;border-color:var(--ac-accent);box-shadow:0 0 0 3px #2563eb1a}
.btn{font-family:var(--ac-font);font-weight:600;border-radius:var(--ac-radius-sm);cursor:pointer;transition:transform .15s cubic-bezier(.22,1,.36,1),box-shadow .15s,background .15s;font-size:13.5px}
.btn:active{transform:scale(.97) translateY(1px)}
.btn-primary{background:var(--ac-accent);color:#fff;border:none;box-shadow:0 2px 8px #2563eb40}
.btn-primary:hover{background:#1d4ed8;box-shadow:0 4px 16px #2563eb59}
.btn-outline{background:var(--ac-surface);color:var(--ac-dark);border:1.5px solid var(--ac-border)}
.btn-outline:hover{border-color:var(--ac-accent);color:var(--ac-accent);background:var(--ac-accent-l)}
.btn-ghost{background:transparent;border:none;color:var(--ac-muted)}
.btn-ghost:hover{color:var(--ac-dark);background:var(--ac-bg)}
.btn-icon{width:32px;height:32px;border-radius:8px;background:var(--ac-bg);border:1px solid var(--ac-border);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ac-muted);transition:background .15s,color .15s,transform .15s;flex-shrink:0}
.btn-icon:hover{background:var(--ac-accent-l);color:var(--ac-accent);border-color:var(--ac-accent)}
.btn-icon:active{transform:scale(.93)}
.btn-icon--danger:hover{background:#fef2f2;color:var(--ac-danger);border-color:#fca5a5}
@keyframes ac-shimmer {
0%{background-position:-200% 0}
100%{background-position:200% 0}
}
.ac-skeleton{background:linear-gradient(90deg,#f1f5f9 25%,#e8edf5 50%,#f1f5f9 75%);background-size:200% 100%;animation:ac-shimmer 1.6s infinite;border-radius:8px;height:14px}
.empty-state,[style*="text-align:center;color:var(--c-text-muted)"]{padding:36px 20px!important;text-align:center;color:var(--ac-muted);font-size:13.5px;display:flex;flex-direction:column;align-items:center;gap:8px}
.ac-header [style*="border-radius:99px"]{backdrop-filter:blur(8px)}
#ac-garagem [style*="border-radius:12px"]{border:1px solid var(--ac-border)!important;border-radius:var(--ac-radius)!important;transition:transform .2s cubic-bezier(.22,1,.36,1),box-shadow .2s;overflow:hidden}
#ac-garagem [style*="border-radius:12px"]:hover{transform:translateY(-3px);box-shadow:var(--ac-shadow-lg)}
#ac-sessoes [style*="padding:12px"]{transition:background .1s}
#ac-sessoes [style*="padding:12px"]:hover{background:var(--ac-accent-xl)}
#ac-score [style*="background:linear-gradient(90deg,#16a34a,#22c55e)"]{background:linear-gradient(90deg,var(--ac-accent) 0%,#06b6d4 100%)!important}
.ck-val-updated{animation:ac-value-pop .4s cubic-bezier(.22,1,.36,1)}
@keyframes ac-value-pop {
0%{transform:scale(1.15) translateY(-2px)}
100%{transform:scale(1) translateY(0)}
}
.link-subtle{color:var(--ac-accent);text-decoration:none;font-weight:600}
.link-subtle:hover{text-decoration:underline}
.txt-muted{color:var(--ac-muted)!important}
@media (max-width: 960px) {
.cfg-layout{grid-template-columns:1fr}
.cfg-nav{position:static;flex-direction:row;flex-wrap:wrap;gap:4px;padding:8px}
.cfg-nav-item{border-radius:8px;padding:7px 12px;font-size:12px}
.cfg-nav-count,.cfg-nav-divider,.cfg-nav-item--link{display:none}
}
@media (max-width: 640px) {
.ac-header{padding:22px;border-radius:16px}
.ac-avatar{width:56px;height:56px;border-radius:14px}
.ac-header .admin-page-title{font-size:20px!important}
#ac-stats .stats-grid{grid-template-columns:1fr 1fr!important}
#ac-score > div{grid-template-columns:1fr!important}
}
.wl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.wl-card{position:relative;aspect-ratio:4/3;border-radius:16px;overflow:hidden;cursor:pointer;border:1px solid var(--ac-border);background:var(--ac-bg);text-align:left;padding:0;width:100%;transition:transform .25s cubic-bezier(.22,1,.36,1),box-shadow .25s cubic-bezier(.22,1,.36,1)}
.wl-card:hover{transform:translateY(-4px) scale(1.01);box-shadow:0 12px 40px #0a0f1e24}
.wl-card:active{transform:translateY(-1px) scale(.99)}
.wl-photos{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr 1fr;grid-template-rows:1fr 1fr;gap:2px;background:#0a0f1e}
.wl-photo-slot{overflow:hidden}
.wl-photo-slot img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s cubic-bezier(.22,1,.36,1)}
.wl-card:hover .wl-photo-slot img{transform:scale(1.06)}
.wl-photo-empty{width:100%;height:100%;background:linear-gradient(135deg,#1e293b,#0f172a)}
.wl-overlay{position:absolute;inset:0;background:linear-gradient(to top,#0a0f1ee0 0%,#0a0f1e66 45%,#0a0f1e00 100%);display:flex;align-items:flex-end;justify-content:space-between;padding:14px 16px;gap:8px}
.wl-info{flex:1;min-width:0}
.wl-nome{font-size:14px;font-weight:800;color:#fff;line-height:1.3;margin-bottom:3px;text-shadow:0 1px 3px #0006;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wl-count{font-size:12px;color:#ffffffa6;font-weight:500}
.wl-arrow{width:28px;height:28px;border-radius:50%;background:#ffffff26;backdrop-filter:blur(4px);border:1px solid #fff3;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .15s,transform .2s}
.wl-arrow svg{stroke:#fff}
.wl-card:hover .wl-arrow{background:var(--ac-accent);border-color:var(--ac-accent);transform:translateX(2px)}
.wl-card[data-total="0"] .wl-photos{grid-template-columns:1fr;grid-template-rows:1fr}
.wl-card[data-total="0"] .wl-photo-slot:not(:first-child){display:none}
.wl-drawer-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.wl-drawer-item{display:block;text-decoration:none;border-radius:12px;overflow:hidden;border:1px solid var(--ac-border);background:var(--ac-surface);transition:transform .2s cubic-bezier(.22,1,.36,1),box-shadow .2s}
.wl-drawer-item:hover{transform:translateY(-3px);box-shadow:0 8px 24px #0a0f1e1a}
.wl-drawer-img{position:relative;aspect-ratio:1;overflow:hidden;background:var(--ac-bg)}
.wl-drawer-img img{width:100%;height:100%;object-fit:cover;transition:transform .3s}
.wl-drawer-item:hover .wl-drawer-img img{transform:scale(1.06)}
.wl-item-promo{position:absolute;top:6px;left:6px;background:var(--ac-danger);color:#fff;font-size:9px;font-weight:900;letter-spacing:.5px;padding:2px 6px;border-radius:4px}
.wl-drawer-info{padding:8px 10px 10px}
.wl-drawer-nome{display:block;font-size:12.5px;font-weight:600;color:var(--ac-dark);line-height:1.4;margin-bottom:4px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.wl-drawer-preco{font-size:13px;font-weight:800;color:var(--ac-success)}
.wl-drawer-loading{display:flex;flex-direction:column;gap:10px;padding:4px}

/* Pagina de importação de produtos */

.import-instruction-card {
  display:flex;align-items:center;gap:12px;background:#fff;
  border:1px solid var(--c-border);border-radius:14px;padding:18px 22px;
  margin-bottom:20px;flex-wrap:wrap;
}
.import-step { display:flex;align-items:flex-start;gap:10px;flex:1;min-width:160px; }
.import-step-num {
  width:28px;height:28px;border-radius:50%;background:var(--c-accent);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:900;
  font-size:13px;flex-shrink:0;
}
.import-step p { margin:2px 0 0;font-size:12px;color:var(--c-text-muted); }
.import-step-sep { color:#cbd5e1;font-size:20px;flex-shrink:0; }

.admin-tabs { display:flex;gap:2px;background:#f8fafc;border:1px solid var(--c-border);
  border-bottom:none;border-radius:12px 12px 0 0;padding:6px 6px 0; }
.admin-tab {
  padding:8px 18px;font-size:13.5px;font-weight:600;border-radius:8px 8px 0 0;
  background:transparent;border:none;color:var(--c-muted);cursor:pointer;transition:all .12s;
}
.admin-tab:hover { background:#fff;color:var(--c-dark); }
.admin-tab.is-active { background:#fff;color:var(--c-accent);box-shadow:0 -1px 0 0 var(--c-accent); }

.admin-tab-content { display:none; }
.admin-tab-content.is-active { display:block; }

.import-upload-card { padding:0 !important; }
.import-upload-area {
  border:2px dashed var(--c-border);border-radius:14px;
  padding:40px 20px;text-align:center;transition:border-color .15s;
  cursor:pointer;
}
.import-upload-area:hover, .import-upload-area.drag-over {
  border-color:var(--c-accent);background:var(--c-accent-l);
}
.import-upload-area p { font-size:15px;color:var(--c-dark);margin:10px 0 4px; }
.import-upload-area small { color:var(--c-text-muted);font-size:12.5px; }


/* Devoluções */

/* ════════════════════════════════════════════════════════
   assets/css/devolucoes.css
   Estilos do módulo de devoluções — admin e cliente
   ════════════════════════════════════════════════════════ */

/* ── Admin: index chips de prioridade ───────────────────── */
.filter-chip--warning.is-active,
.filter-chip--warning:hover {
  background: #fffbeb;
  border-color: #f59e0b;
  color: #92400e;
}

/* ── Admin: linha urgente na tabela ─────────────────────── */
.admin-table tr.urgente-row {
  background: #fffbeb;
}
.admin-table tr.urgente-row td:first-child {
  border-left: 3px solid #f59e0b;
}

/* ── Admin show: seção de ações ─────────────────────────── */
.dev-acao-section {
  border: 1.5px solid var(--c-border);
  border-radius: 12px;
  overflow: hidden;
}
.dev-acao-header {
  padding: 12px 16px;
  background: #f8fafc;
  border-bottom: 1px solid var(--c-border);
  font-size: 12px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: .5px;
  color: var(--c-text-muted);
}
.dev-acao-body {
  padding: 14px 16px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

/* ── Inspeção — aprovado/reprovado toggle visual ─────────── */
.insp-toggle {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.insp-opt {
  border: 2px solid var(--c-border);
  border-radius: 10px;
  padding: 10px 12px;
  cursor: pointer;
  text-align: center;
  font-size: 13.5px;
  font-weight: 700;
  transition: all .15s;
  background: #fff;
}
.insp-opt input[type="radio"] { display: none; }
.insp-opt--aprovado:has(input:checked),
.insp-opt--aprovado.is-selected {
  border-color: #16a34a;
  background: #f0fdf4;
  color: #15803d;
}
.insp-opt--reprovado:has(input:checked),
.insp-opt--reprovado.is-selected {
  border-color: #ef4444;
  background: #fef2f2;
  color: #b91c1c;
}

/* ── Timeline da solicitação (admin show) ─────────────────── */
.dev-timeline {
  position: relative;
  padding: 8px 0;
}
.dev-tl-step {
  display: flex;
  gap: 14px;
  align-items: flex-start;
  margin-bottom: 4px;
}
.dev-tl-left {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 28px;
  flex-shrink: 0;
}
.dev-tl-dot {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  flex-shrink: 0;
}
.dev-tl-dot--done    { background: #16a34a; color: #fff; }
.dev-tl-dot--active  { background: #2563eb; color: #fff; box-shadow: 0 0 0 4px rgba(37,99,235,.15); }
.dev-tl-dot--future  { background: #f1f5f9; color: #94a3b8; border: 1.5px solid #e2e8f0; }
.dev-tl-dot--negado  { background: #ef4444; color: #fff; }
.dev-tl-line {
  width: 2px;
  flex: 1;
  min-height: 20px;
  background: #e2e8f0;
  margin: 2px 0;
}
.dev-tl-line--done { background: #86efac; }
.dev-tl-body {
  flex: 1;
  padding-bottom: 18px;
  min-width: 0;
}
.dev-tl-body strong { font-size: 13.5px; font-weight: 700; color: var(--c-dark); }
.dev-tl-body small  { font-size: 12px; color: var(--c-text-muted); }

/* ── Código de postagem — destaque ─────────────────────────── */
.dev-codigo-box {
  background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%);
  border: 1.5px solid #86efac;
  border-radius: 14px;
  padding: 18px 20px;
  text-align: center;
}
.dev-codigo-label {
  font-size: 10.5px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: .8px;
  color: #16a34a;
  margin-bottom: 6px;
}
.dev-codigo-value {
  font-family: 'SF Mono', Monaco, Consolas, monospace;
  font-size: 22px;
  font-weight: 900;
  color: #0f172a;
  letter-spacing: 2px;
  display: block;
  word-break: break-all;
}
.dev-codigo-validade {
  font-size: 12px;
  color: #6b7280;
  margin-top: 6px;
}

/* ── Fotos da solicitação ──────────────────────────────────── */
.dev-fotos-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(88px, 1fr));
  gap: 8px;
  margin-top: 10px;
}
.dev-foto-thumb {
  aspect-ratio: 1;
  border-radius: 8px;
  overflow: hidden;
  border: 1px solid var(--c-border);
  cursor: pointer;
  transition: transform .15s;
}
.dev-foto-thumb:hover { transform: scale(1.04); }
.dev-foto-thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

/* ── Badge de prazo de inspeção ──────────────────────────────── */
.dev-prazo-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: #fffbeb;
  border: 1px solid #fcd34d;
  color: #92400e;
  font-size: 12.5px;
  font-weight: 700;
  padding: 4px 12px;
  border-radius: 99px;
}
.dev-prazo-badge svg { stroke: #d97706; }

/* ── Reembolso — seletor de método ──────────────────────────── */
.dev-reembolso-opts {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 12px;
}
.dev-reembolso-opt {
  border: 1.5px solid var(--c-border);
  border-radius: 10px;
  padding: 11px 14px;
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
  color: var(--c-dark);
  background: #fff;
  transition: all .15s;
  text-align: left;
}
.dev-reembolso-opt:hover  { border-color: var(--c-primary); background: #eff6ff; }
.dev-reembolso-opt.is-sel { border-color: var(--c-primary); background: #eff6ff; color: var(--c-primary); }
.dev-reembolso-opt small  { display: block; font-size: 11.5px; font-weight: 400; color: var(--c-text-muted); margin-top: 2px; }

/* ── Customer: status pill overrides ───────────────────────── */
.order-status-pill--gray {
  background: #f8fafc;
  color: #64748b;
  border-color: #e2e8f0;
}

/* ── Customer show: código de postagem ───────────────────────── */
.dev-postagem-card {
  background: #f0fdf4;
  border: 1.5px solid #86efac;
  border-radius: 16px;

:root{--hf-blue:#2563eb;--hf-blue-2:#1d4ed8;--hf-blue-soft:#eff6ff;--hf-indigo:#4338ca;--hf-ink:#0f172a;--hf-ink-2:#334155;--hf-muted:#64748b;--hf-muted-2:#94a3b8;--hf-bg:#f5f7fb;--hf-surface:#fff;--hf-surface-2:#f8fafc;--hf-border:#e2e8f0;--hf-border-strong:#cbd5e1;--hf-green:#16a34a;--hf-green-soft:#f0fdf4;--hf-red:#dc2626;--hf-red-soft:#fef2f2;--hf-amber:#d97706;--hf-amber-soft:#fffbeb;--hf-radius-sm:10px;--hf-radius:14px;--hf-radius-lg:20px;--hf-radius-xl:26px;--hf-shadow-sm:0 1px 2px #0f172a0d;--hf-shadow-md:0 12px 34px #0f172a14;--hf-shadow-lg:0 24px 70px #0f172a24;--hf-ring:0 0 0 4px #2563eb1f}

.hf-commandbar,.hf-form-header{position:relative;overflow:hidden;display:flex;justify-content:space-between;gap:22px;align-items:flex-start;background:radial-gradient(circle at 8% 0%,#2563eb29,transparent 30%),linear-gradient(135deg,#fff 0%,#f8fafc 58%,#eef4ff 100%);border:1px solid #cbd5e1c7;border-radius:var(--hf-radius-xl);box-shadow:var(--hf-shadow-md);padding:26px;margin-bottom:18px}

.lw{--lw-surface:#fff;--lw-line:#e5e7eb;--lw-t0:#111827;--lw-t1:#374151;--lw-t2:#6b7280;--lw-critical:#dc2626;--lw-error:#ea580c;--lw-warning:#b45309;--lw-ok:#059669;
  --lw-ease:cubic-bezier(.22,1,.36,1);--lw-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;padding:18px 20px;background:var(--lw-surface);border:1px solid var(--lw-line);border-radius:12px;box-shadow:0 1px 2px #1018280a 0 1px 3px #1018280f;
margin-bottom: 15px;}
.lw *,.lw ::before,.lw ::after{box-sizing:border-box}
.lw--ok{border-top:3px solid var(--lw-ok)}
.lw--alert{border-top:3px solid var(--lw-critical)}
.lw-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.lw-head-title{display:flex;align-items:center;gap:8px;min-width:0}
.lw-head-title h3{margin:0;font-size:14px;font-weight:600;color:var(--lw-t0);white-space:nowrap}
.lw-period{font-size:10.5px;font-weight:600;color:var(--lw-t2);padding:2px 7px;border-radius:99px;background:#f3f4f6;border:1px solid var(--lw-line)}
.lw-pulse{width:8px;height:8px;border-radius:50%;background:var(--lw-ok);flex-shrink:0}
.lw-pulse--alert{background:var(--lw-critical);animation:lwPulse 2s ease-out infinite}
@keyframes lwPulse {
0%{box-shadow:0 0 0 0 #dc262680}
70%{box-shadow:0 0 0 7px #dc262600}
100%{box-shadow:0 0 0 0 #dc262600}
}
.lw-all{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:600;color:var(--lw-t1);text-decoration:none;white-space:nowrap;transition:color .15s var(--lw-ease)}
.lw-all svg{width:13px;height:13px;transition:transform .18s var(--lw-ease)}
.lw-all:hover{color:var(--lw-t0)}
.lw-all:hover svg{transform:translateX(2px)}
.lw-all:focus-visible{outline:2px solid var(--lw-critical);outline-offset:2px;border-radius:4px}
.lw-clean{display:flex;align-items:center;gap:8px;margin:0;padding:10px 0;font-size:13px;color:var(--lw-ok);font-weight:500}
.lw-clean svg{width:16px;height:16px;flex-shrink:0}
.lw-nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.lw-num{display:flex;flex-direction:column;gap:2px;padding:10px 12px;text-decoration:none;border:1px solid var(--lw-line);border-radius:8px;transition:background .15s var(--lw-ease),border-color .15s var(--lw-ease),transform .12s var(--lw-ease);will-change:transform}
.lw-num:hover{transform:translateY(-1px)}
.lw-num:active{transform:translateY(0)}
.lw-num:focus-visible{outline:2px solid currentColor;outline-offset:2px}
.lw-n{font-size:22px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}

  -webkit-box-shadow: 0 0 0 1000px #111821 inset !important;

}

/* Keep switch knobs white for clear state contrast */

  }
}

.ia_celula_sub { display: block; font-size: 11.5px; color: var(--em-texto-sub); margin-top: 2px; }
.ia_acoes { display: flex; gap: 6px; justify-content: flex-end; }
.ia_vazio td { text-align: center; color: var(--em-texto-sub); padding: 28px 10px; }
.ia_cap { display: inline-block; background: rgba(10, 102, 194, .1); color: var(--em-blue); border-radius: 8px; padding: 3px 8px; font-size: 11.5px; font-weight: 600; }

/* Busca de produto (autocomplete) */
.ia_busca_wrap { position: relative; }
.ia_busca_lista { position: absolute; z-index: 60; left: 0; right: 0; top: calc(100% + 6px); background: var(--em-card); border: 1px solid var(--em-border); border-radius: 12px; box-shadow: 0 12px 32px rgba(16, 24, 40, .18); overflow: hidden; display: none; }
.ia_busca_item { display: flex; justify-content: space-between; gap: 12px; align-items: center; padding: 10px 14px; cursor: pointer; border-bottom: 1px solid var(--em-border); }
.ia_busca_item:last-child { border-bottom: 0; }
.ia_busca_item:hover { background: rgba(10, 102, 194, .07); }
.ia_busca_item small { color: var(--em-texto-sub); white-space: nowrap; }

/* Painel do produto */
.ia_produto { display: flex; gap: 14px; align-items: flex-start; flex-wrap: wrap; }
.ia_produto_thumb { width: 64px; height: 64px; border-radius: 14px; background: var(--em-bg); border: 1px solid var(--em-border); display: flex; align-items: center; justify-content: center; font-size: 24px; color: var(--em-texto-sub); flex-shrink: 0; }
.ia_produto_info { flex: 1; min-width: 240px; }
.ia_produto_nome { font-size: 15px; font-weight: 700; margin: 0 0 4px; }
.ia_produto_meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.ia_preco { font-variant-numeric: tabular-nums; font-weight: 700; }
.ia_preco_de { color: var(--em-texto-sub); text-decoration: line-through; font-weight: 500; margin-right: 6px; }

/* Cards de resultado */
.ia_resultado { background: var(--em-card); border: 1px solid var(--em-border); border-radius: 16px; box-shadow: var(--em-shadow); padding: 16px; margin-bottom: 12px; }
.ia_resultado_topo { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.ia_resultado_meta { font-size: 12px; color: var(--em-texto-sub); display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.ia_resultado_texto { white-space: pre-wrap; font-size: 13.5px; line-height: 1.6; background: var(--em-bg); border: 1px solid var(--em-border); border-radius: 12px; padding: 14px; }
.ia_resultado_erro { color: var(--em-erro); font-size: 13px; background: var(--em-erro-bg); border-radius: 12px; padding: 12px 14px; }
.ia_resultado_img { background: var(--em-bg); border: 1px solid var(--em-border); border-radius: 12px; padding: 8px; text-align: center; }
.ia_resultado_img img { max-width: 100%; max-height: 480px; border-radius: 8px; display: inline-block; }
.ia_resultado_acoes { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }

.ia_spin { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--em-border); border-top-color: var(--em-blue); border-radius: 50%; animation: ia_girar .8s linear infinite; vertical-align: -2px; }
@keyframes ia_girar { to { transform: rotate(360deg); } }

/* Drawer (fallback) e toast */
.ia_veu { position: fixed; inset: 0; background: rgba(15, 17, 21, .45); backdrop-filter: blur(3px); z-index: 90; display: none; }
.ia_drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 96vw); background: var(--em-card); border-left: 1px solid var(--em-border); z-index: 91; transform: translateX(102%); transition: transform .22s ease; display: flex; flex-direction: column; }
.ia_drawer.aberto { transform: translateX(0); }
.ia_drawer_topo { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px; border-bottom: 1px solid var(--em-border); }
.ia_drawer_titulo { font-size: 15px; font-weight: 700; margin: 0; }
.ia_drawer_corpo { padding: 18px; overflow-y: auto; flex: 1; }
.ia_toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(12px); background: var(--em-texto); color: var(--em-card); border-radius: 999px; padding: 10px 18px; font-size: 13px; font-weight: 600; z-index: 120; opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; max-width: 92vw; }
.ia_toast.mostrar { opacity: 1; transform: translateX(-50%) translateY(0); }
.ia_toast.erro { background: var(--em-erro); color: #fff; }

.ia_paginacao { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
.ia_paginacao_info { font-size: 12.5px; color: var(--em-texto-sub); }

.ia_detalhe_grade { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 16px; margin-bottom: 16px; }
.ia_detalhe_item { font-size: 13px; }
.ia_detalhe_item b { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--em-texto-sub); margin-bottom: 3px; font-weight: 600; }
.ia_pre { white-space: pre-wrap; font-family: 'DM Mono', ui-monospace, monospace; font-size: 12px; line-height: 1.55; background: var(--em-bg); border: 1px solid var(--em-border); border-radius: 12px; padding: 12px; max-height: 320px; overflow-y: auto; }
details.ia_dobra { border: 1px solid var(--em-border); border-radius: 12px; padding: 10px 14px; margin-bottom: 12px; }
details.ia_dobra summary { cursor: pointer; font-size: 13px; font-weight: 600; }
details.ia_dobra[open] summary { margin-bottom: 10px; }
