  display: flex; border-radius: var(--r-md);
  border: 1.5px solid var(--border); overflow: hidden;
}
.estoque-op-tab {
  flex: 1; padding: 9px; background: var(--bg);
  border: none; font-family: var(--font);
  font-size: 13px; font-weight: 700; color: var(--text-2);
  cursor: pointer; transition: all var(--t);
  border-right: 1px solid var(--border);
}
.estoque-op-tab:last-child { border-right: none; }
.estoque-op-tab.active {
  background: var(--blue); color: #fff;
}

/* Preview do resultado */
.estoque-ajuste-preview {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 14px; background: var(--bg);
  border-radius: var(--r-md); margin-top: 12px;
  font-size: 13.5px; color: var(--text-2);
}
.estoque-ajuste-arrow {
  font-size: 16px; color: var(--text-3);
}

/* Loading */
.pe-loading {
  padding: 28px; text-align: center;
  color: var(--text-3); font-size: 13px; font-style: italic;
}

/* ── Estoque inline nos SKUs ─────────────────────────────── */
.pe-sku-estoque-wrap {
  display: flex; align-items: center; gap: 5px;
}

.pe-sku-estoque-btns {
  display: flex; gap: 3px;
}

.pe-sku-est-confirm,
.pe-sku-est-cancel {
  width: 26px; height: 26px; border-radius: var(--r-sm);
  border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all var(--t); flex-shrink: 0;
}

.pe-sku-est-confirm {
  background: var(--success-lt); color: var(--success);
}
.pe-sku-est-confirm:hover {
  background: var(--success); color: #fff;
}

.pe-sku-est-cancel {
  background: var(--surface2); color: var(--text-3);
}
.pe-sku-est-cancel:hover {
  background: var(--danger-lt); color: var(--danger);
}

/* Feedback de sucesso no input */
.pe-sku-estoque.input-success {
  border-color: var(--success) !important;
  box-shadow: 0 0 0 3px rgba(5,150,105,.12) !important;
  transition: border-color .3s, box-shadow .3s;
}

/* Spin */
@keyframes spin { to { transform: rotate(360deg); } }
.spin { animation: spin .7s linear infinite; display: block; }

/* ── Breakdown de estoque por SKU ────────────────────────── */
.pe-estoque-skus-breakdown {
  margin-top: 12px; border: 1px solid var(--border);
  border-radius: var(--r-lg); overflow: hidden;
}
.pe-estoque-breakdown-header {
  display: grid;
  grid-template-columns: 1fr 80px 90px 90px auto;
  gap: 8px; padding: 8px 12px;
  background: var(--bg);
  font-size: 10.5px; font-weight: 700; text-transform: uppercase;
  letter-spacing: .4px; color: var(--text-3);
  border-bottom: 1px solid var(--border);
}
.pe-estoque-breakdown-row {
  display: grid;
  grid-template-columns: 1fr 80px 90px 90px auto;
  gap: 8px; padding: 9px 12px;
  align-items: center;
  border-bottom: 1px solid var(--border);
  transition: background var(--t);
}
.pe-estoque-breakdown-row:last-child { border-bottom: none; }
.pe-estoque-breakdown-row:hover { background: var(--bg); }

.pe-estoque-sku-codigo {
  font-family: var(--font-mono); font-size: 12px;
  font-weight: 700; color: var(--text);
}
.pe-estoque-sku-saldo,
.pe-estoque-sku-reservado,
.pe-estoque-sku-disponivel {
  font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums;
}
.pe-estoque-sku-actions {
  display: flex; gap: 4px;
}


/* ── Características: grid ────────────────────────────────── */
.char-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 16px;
}

.char-field { display: flex; flex-direction: column; gap: 6px; }
.char-field--required .char-label { font-weight: 800; }

.char-label {
  font-size: 12.5px; font-weight: 700; color: var(--text-2);
  display: flex; align-items: center; gap: 5px;
}
.char-unidade  { font-weight: 400; color: var(--text-3); }
.char-unidade-suffix {
  padding: 0 10px; background: var(--bg);
  border: 1.5px solid var(--border); border-left: none;
  border-radius: 0 var(--r-md) var(--r-md) 0;
  font-size: 12px; font-weight: 700; color: var(--text-3);
  display: flex; align-items: center;
}
.char-numero-wrap { display: flex; }
.char-numero-wrap .form-control { border-radius: var(--r-md) 0 0 var(--r-md) !important; }

/* Sim/Não */
.char-boolean-group { display: flex; gap: 8px; flex-wrap: wrap; }
.char-bool-opt {
  display: flex; align-items: center; gap: 5px;
  padding: 7px 14px; border-radius: var(--r-md);
  border: 1.5px solid var(--border); cursor: pointer;
  font-size: 13px; font-weight: 600; color: var(--text-2);
  transition: all var(--t);
}
.char-bool-opt:has(input:checked) {
  border-color: var(--blue); background: var(--blue-lt); color: var(--blue);
}
.char-bool-opt input { display: none; }

/* Estado vazio */
.char-vazio {
  display: flex; flex-direction: column;
  align-items: center; text-align: center;
  padding: 32px 16px; gap: 10px; color: var(--text-3);
}
.char-vazio p { font-size: 13.5px; }

/* Opções no modal */
.char-opcao-row {
  display: flex; gap: 6px; align-items: center; margin-bottom: 6px;
}
.char-opcao-row .form-control { flex: 1; }

/* Características na categoria */
.cat-char-add-wrap {
  display: flex; gap: 8px; margin-bottom: 14px;
}
.cat-char-item {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 12px; background: var(--bg);
  border: 1px solid var(--border); border-radius: var(--r-md);
  margin-bottom: 6px; transition: border-color var(--t);
}
.cat-char-item:hover { border-color: var(--blue); }
.cat-char-drag { color: var(--text-3); cursor: grab; font-size: 16px; }
.cat-char-nome { flex: 1; font-size: 13.5px; font-weight: 700; color: var(--text); }
.cat-char-obrig-label {
  display: flex; align-items: center; gap: 5px;
  font-size: 12px; color: var(--text-3); cursor: pointer;
  white-space: nowrap;
}

/* ═══════════════════════════════════════════════════════
   SEÇÃO DE CATEGORIAS DO PRODUTO — cats-*
   ═══════════════════════════════════════════════════════ */

/* ── Card container ───────────────────────────────────── */
.cats-card { overflow: visible; }

.cat-star-inline {
  display: inline-flex; align-items: center;
  vertical-align: middle; margin: 0 1px;
}

/* ── Lista de categorias selecionadas ─────────────────── */
.cats-selected-wrap {
  margin-bottom: 14px;
}

.cats-selected-list {
  display: flex; flex-direction: column; gap: 5px;
  min-height: 24px;
}

/* Estado vazio */
.cats-empty-state {
  display: flex; align-items: center; gap: 10px;
  padding: 14px 16px;
  background: var(--bg); border: 1.5px dashed var(--border2);
  border-radius: var(--r-lg); color: var(--text-3);
  font-size: 13px; font-weight: 500;
}
.cats-empty-icon {
  width: 32px; height: 32px; border-radius: var(--r-md);
  background: var(--surface2); display: flex;
  align-items: center; justify-content: center; flex-shrink: 0;
}

/* Item de categoria selecionada */
.cat-selected-item {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 10px 8px 8px;
  background: var(--surface); border: 1.5px solid var(--border);
  border-radius: var(--r-lg); transition: all var(--t);
  animation: catItemIn .2s cubic-bezier(.4,0,.2,1);
}
@keyframes catItemIn {
  from { opacity: 0; transform: translateY(-4px) scale(.98); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}
.cat-selected-item:hover {
  border-color: var(--blue);
  background: var(--blue-lt);
}

/* Estrela de principal */
.cat-star-btn {
  background: none; border: none; cursor: pointer; padding: 4px;
  border-radius: var(--r-sm); flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  transition: all var(--t);
}
.cat-star-btn:hover svg {
  fill: #f59e0b;
  stroke: #f59e0b;
}
.cat-star-btn.is-principal svg {
  filter: drop-shadow(0 0 4px rgba(245,158,11,.4));
}

/* Label da categoria */
.cat-selected-label {
  flex: 1; min-width: 0;
  display: flex; align-items: center; gap: 5px;
  flex-wrap: wrap;
}
.cat-selected-path {
  font-size: 11.5px; color: var(--text-3); font-weight: 500;
  white-space: nowrap; flex-shrink: 0;
}
.cat-selected-leaf {
  font-size: 13.5px; font-weight: 800; color: var(--text);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

/* Badge principal */
.cat-principal-badge {
  display: inline-flex; align-items: center;
  padding: 2px 8px; border-radius: 99px;
  background: linear-gradient(135deg, #fef3c7, #fde68a);
  border: 1px solid #f59e0b44;
  font-size: 10.5px; font-weight: 800;
  color: #92400e; white-space: nowrap; flex-shrink: 0;
  letter-spacing: .3px;
}

/* Botão remover */
.cat-remove-btn {
  background: none; border: none; cursor: pointer;
  padding: 5px; border-radius: var(--r-sm); flex-shrink: 0;
  color: var(--text-3); display: flex;
  transition: all var(--t);
}
.cat-remove-btn:hover {
  color: var(--danger); background: var(--danger-lt);
}

/* ── Trigger de adicionar ─────────────────────────────── */
.cats-picker-wrap {
  position: relative;
}

.cats-search-trigger {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 8px 14px; border-radius: var(--r-lg);
  border: 1.5px dashed var(--border2);
  background: var(--bg); cursor: pointer;
  font-size: 13px; font-weight: 700; color: var(--text-3);
  transition: all var(--t); user-select: none;
}
.cats-search-trigger:hover {
  border-color: var(--blue); color: var(--blue);
  background: var(--blue-lt);
}
.cats-search-trigger svg { flex-shrink: 0; }

/* ── Dropdown ─────────────────────────────────────────── */
.cats-dropdown {
  position: absolute; top: calc(100% + 8px); left: 0;
  width: min(440px, 90vw);
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: var(--r-xl);
  box-shadow: 0 20px 50px rgba(0,0,0,.12), 0 4px 16px rgba(0,0,0,.06);
  z-index: 300;
  overflow: hidden;

  /* Estado inicial: escondido */
  opacity: 0; visibility: hidden;
  transform: translateY(6px) scale(.98);
  transition: opacity .18s, transform .18s, visibility .18s;
  pointer-events: none;
}
.cats-dropdown.open {
  opacity: 1; visibility: visible;
  transform: translateY(0) scale(1);
  pointer-events: all;
}

/* Search bar dentro do dropdown */
.cats-dropdown-search-wrap {
  display: flex; align-items: center; gap: 8px;
  padding: 12px 14px;
  border-bottom: 1px solid var(--border);
  background: var(--bg);
}
.cats-search-input {
  flex: 1; border: none; outline: none;
  background: transparent; font-family: var(--font);
  font-size: 13.5px; color: var(--text);
}
.cats-search-input::placeholder { color: var(--text-3); }
.cats-dropdown-close {
  background: none; border: none; cursor: pointer;
  padding: 4px; border-radius: 50%;
  color: var(--text-3); display: flex;
  transition: all var(--t);
}
.cats-dropdown-close:hover { color: var(--text); background: var(--surface2); }

/* Lista de itens */
.cats-dropdown-list {
  max-height: 320px; overflow-y: auto;
  padding: 6px;
}
.cats-dropdown-list::-webkit-scrollbar { width: 4px; }
.cats-dropdown-list::-webkit-scrollbar-thumb {
  background: var(--border2); border-radius: 4px;
}

/* Item do dropdown */
.cats-dropdown-item {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 10px;
  border-radius: var(--r-md); cursor: pointer;
  transition: background var(--t);
  padding-left: calc(10px + var(--depth, 0) * 20px);
  position: relative;
}
.cats-dropdown-item:hover { background: var(--surface2); }
.cats-dropdown-item.is-selected {
  background: var(--blue-lt);
}
.cats-dropdown-item.is-hidden { display: none; }

/* Indentação visual */
.cats-item-indent {
  position: absolute;
  left: 10px; top: 0; bottom: 0;
  display: flex; align-items: center;
}
.cats-indent-line {
  width: 1px; height: 100%;
  background: var(--border); margin-right: 8px;
}
.cats-indent-corner {
  width: 12px; height: 1px;
  background: var(--border);
  margin-right: 4px;
}

/* Ícone do item */
.cats-item-icon {
  color: var(--text-3); flex-shrink: 0;
  display: flex; align-items: center;
}
.has-children .cats-item-icon { color: var(--blue); }

/* Nome */
.cats-item-nome {
  flex: 1; font-size: 13px; font-weight: 600;
  color: var(--text);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.cats-dropdown-item.is-selected .cats-item-nome {
  color: var(--blue); font-weight: 700;
}

/* Badge de subcategorias */
.cats-item-badge {
  font-size: 10px; font-weight: 800; color: var(--text-3);
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 99px; padding: 1px 6px; flex-shrink: 0;
}

/* Check de selecionado */
.cats-item-check {
  color: var(--blue); flex-shrink: 0;
}

/* Estado vazio na busca */
.cats-dropdown-empty {
  display: flex; flex-direction: column; align-items: center;
  gap: 8px; padding: 28px 16px;
  color: var(--text-3); font-size: 13px; font-style: italic;
}

/* ── Destaque de busca ─────────────────────────────────── */
.cats-item-nome mark {
  background: #fef08a; color: #713f12;
  border-radius: 2px; padding: 0 1px;
}

/* Quando o dropdown usa position:fixed (movido para body) */
.cats-dropdown {
  /* Remove o position:absolute — o JS define fixed dinamicamente */
  position: fixed;
  z-index: 9999;
}

/* ═══════════════════════════════════════════════════════
   LISTAGEM DE PRODUTOS — prod-*
   ═══════════════════════════════════════════════════════ */

/* ── Layout ───────────────────────────────────────────── */
.prod-list-page { padding-bottom: 40px; }

.pd-dash{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.pd-dash-card{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--c-border,#e6e9ef);border-radius:12px;padding:14px 16px;text-decoration:none;transition:box-shadow .18s,transform .18s,border-color .18s}
a.pd-dash-card:hover{box-shadow:0 8px 22px rgba(15,23,42,.07);transform:translateY(-1px);border-color:#cbd5e1}
.pd-dash-card--primary{background:linear-gradient(135deg,#1e293b,#0f172a);border-color:#0f172a}
.pd-dash-card--primary .pd-dash-value{color:#fff}
.pd-dash-card--primary .pd-dash-label{color:#94a3b8}
.pd-dash-ic{width:38px;height:38px;flex-shrink:0;display:grid;place-items:center;border-radius:10px;background:rgba(255,255,255,.1)}
.pd-dash-ic svg{width:20px;height:20px;color:#fff}
.pd-dash-body{flex:1;min-width:0}
.pd-dash-value{font-size:24px;font-weight:800;line-height:1.1;color:var(--c-dark,#0f172a);font-variant-numeric:tabular-nums}
.pd-dash-label{font-size:11px;font-weight:600;color:var(--c-text-muted,#64748b);margin-top:2px}
.pd-dash-side{font-size:12px;font-weight:700;color:#16a34a;background:#f0fdf4;padding:3px 8px;border-radius:20px}
.pd-ok{color:#16a34a}.pd-warn{color:#d97706}.pd-danger{color:#dc2626}
.pd-dash-card.pd-alert{border-color:#fde68a}
.pd-dash-vistos{background:#fff;border:1px solid var(--c-border,#e6e9ef);border-radius:12px;padding:14px 16px;margin-bottom:20px}
.pd-dash-vistos-head{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800;color:var(--c-dark,#0f172a);margin-bottom:10px}
.pd-dash-vistos-head svg{width:16px;height:16px;color:#64748b}
.pd-dash-vistos-head span{font-weight:500;color:#94a3b8;font-size:11px}
.pd-dash-vistos-list{display:flex;flex-direction:column;gap:2px}
.pd-visto-item{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:8px;text-decoration:none;transition:background .15s}
.pd-visto-item:hover{background:#f8fafc}
.pd-visto-rank{width:20px;height:20px;flex-shrink:0;display:grid;place-items:center;background:#f1f5f9;border-radius:6px;font-size:11px;font-weight:800;color:#475569}
.pd-visto-nome{flex:1;min-width:0;font-size:13px;color:#1e293b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pd-visto-num{font-size:11px;font-weight:700;color:#64748b;flex-shrink:0}
@media (max-width:1100px){.pd-dash{grid-template-columns:repeat(2,1fr)}}
@media (max-width:560px){.pd-dash{grid-template-columns:1fr}}

/* ── Topbar ───────────────────────────────────────────── */
.prod-list-topbar {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 20px; gap: 12px; flex-wrap: wrap;
}
.prod-list-topbar-left { display: flex; align-items: baseline; gap: 10px; }
.prod-list-titulo {
  font-size: 22px; font-weight: 900;
  color: var(--text); letter-spacing: -.4px;
}
.prod-list-count {
  font-size: 13px; color: var(--text-3); font-weight: 600;
}
.prod-list-topbar-right { display: flex; gap: 8px; align-items: center; }

.prod-massa-count {
  background: var(--blue); color: #fff;
  font-size: 10.5px; font-weight: 900;
  padding: 1px 6px; border-radius: 99px;
  margin-left: 2px; line-height: 1.6;
}

/* ── Filtros ──────────────────────────────────────────── */
.prod-filters-wrap {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-xl);
  padding: 14px 16px;
  margin-bottom: 16px;
}

.prod-filters-row {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
}

.prod-search-wrap {
  display: flex; align-items: center; gap: 8px;
  flex: 1; min-width: 200px;
  background: var(--bg);
  border: 1.5px solid var(--border);
  border-radius: var(--r-md);
  padding: 0 12px;
  transition: border-color var(--t);
}
.prod-search-wrap:focus-within { border-color: var(--blue); }
.prod-search-wrap svg { color: var(--text-3); flex-shrink: 0; }
.prod-search-input {
  border: none; outline: none; flex: 1;
  font-family: var(--font); font-size: 13.5px;
  color: var(--text); background: transparent;
  padding: 9px 0;
}
.prod-search-input::placeholder { color: var(--text-3); }

.prod-filter-toggle {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 14px; border-radius: var(--r-md);
  border: 1.5px solid var(--border);
  background: var(--bg); cursor: pointer;
  font-family: var(--font); font-size: 13px;
  font-weight: 700; color: var(--text-2);
  transition: all var(--t); white-space: nowrap;
}
.prod-filter-toggle:hover  { border-color: var(--blue); color: var(--blue); }
.prod-filter-toggle.has-filters {
  border-color: var(--blue); background: var(--blue-lt); color: var(--blue);
}
.prod-filter-badge {
  background: var(--blue); color: #fff;
  font-size: 10px; font-weight: 900;
  padding: 1px 6px; border-radius: 99px;
}

/* Filtros avançados */
.prod-filters-advanced {
  max-height: 0; overflow: hidden;
  transition: max-height .3s cubic-bezier(.4,0,.2,1),
              padding .3s;
}
.prod-filters-advanced.open {
  max-height: 600px;
  padding-top: 16px;
  border-top: 1px solid var(--border);
  margin-top: 14px;
}

.prod-filters-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
  gap: 12px;
}

.prod-filter-group {}
.prod-filter-label {
  display: block; font-size: 11px; font-weight: 700;
  text-transform: uppercase; letter-spacing: .5px;
  color: var(--text-3); margin-bottom: 6px;
}

.prod-active-filters {
  display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px;
}
.prod-active-tag {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 3px 10px; border-radius: 99px;
  background: var(--blue-lt); border: 1px solid var(--blue);
  font-size: 11.5px; color: var(--blue);
}
.prod-active-tag strong { font-weight: 800; }

/* ── Toolbar de seleção em massa ─────────────────────── */
.prod-massa-toolbar {
  background: var(--blue);
  border-radius: var(--r-lg);
  padding: 10px 16px;
  margin-bottom: 12px;
  animation: slideDown .2s ease;
}
@keyframes slideDown {
  from { opacity: 0; transform: translateY(-6px); }
  to   { opacity: 1; transform: translateY(0); }
}
.prod-massa-toolbar-inner {
  display: flex; align-items: center; gap: 14px;
}
.prod-massa-check-all-label {
  display: flex; align-items: center; gap: 8px;
  color: #fff; font-size: 13px; font-weight: 700; cursor: pointer;
}
.prod-massa-toolbar-sep {
  width: 1px; height: 16px; background: rgba(255,255,255,.3);
}
.prod-massa-toolbar-hint {
  font-size: 12px; color: rgba(255,255,255,.75);
}

/* ── Tabela ───────────────────────────────────────────── */
.prod-table-card {}

.prod-thumb {
  width: 40px; height: 40px; border-radius: 8px;
  object-fit: cover; border: 1px solid var(--border); display: block;
}
.prod-thumb-empty {
  width: 40px; height: 40px; border-radius: 8px;
  background: var(--surface2); border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  color: var(--text-3);
}

.prod-nome-link {
  font-size: 13.5px; font-weight: 700; color: var(--text);
  text-decoration: none; display: block; line-height: 1.3;
  transition: color var(--t);
}
.prod-nome-link:hover { color: var(--blue); }

.prod-badges {
  display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px;
}
.prod-badge {
  font-size: 10px; font-weight: 800; padding: 1px 7px;
  border-radius: 99px; letter-spacing: .3px;
}
.prod-badge--variacao {
  background: rgba(37,99,235,.1); color: var(--blue);
  border: 1px solid rgba(37,99,235,.2);
}
.prod-badge--destaque {
  background: rgba(245,158,11,.1); color: #92400e;
  border: 1px solid rgba(245,158,11,.2);
}
.prod-badge--lancamento {
  background: rgba(16,185,129,.1); color: #065f46;
  border: 1px solid rgba(16,185,129,.2);
}

.prod-badge--bling-ok{background:#f0fdf4;color:#16a34a;border:1px solid #bbf7d0}
.prod-badge--bling-parcial{background:#fffbeb;color:#d97706;border:1px solid #fde68a}
.prod-badge--bling-off{background:#f8fafc;color:#64748b;border:1px solid #e2e8f0}

.prod-cat-txt {
  display: block; font-size: 13px; color: var(--text-2); font-weight: 600;
}
.prod-marca-txt {
  font-size: 11.5px; color: var(--text-3); display: block; margin-top: 2px;
}

/* Preço display */
.prod-td-preco { white-space: nowrap; }
.prod-preco-de {
  display: block; font-size: 11px; color: var(--text-3);
  text-decoration: line-through;
}
.prod-preco-por {
  display: block; font-size: 14px; font-weight: 800; color: var(--danger);
}
.prod-preco-val {
  font-size: 14px; font-weight: 800; color: var(--text);
}
.prod-preco-hint {
  display: block; font-size: 10px; color: var(--text-3);
  font-style: italic;
}

.prod-skus-count {
  display: block; font-size: 11px; color: var(--text-3);
  margin-top: 3px;
}

/* ── Seleção de linha ─────────────────────────────────── */
.prod-row.massa-mode {
  cursor: pointer;
}
.prod-row.massa-mode:hover td { background: var(--blue-lt); }
.prod-row.is-selected td {
  background: rgba(37,99,235,.06) !important;
}
.prod-row.is-selected { outline: 2px solid var(--blue); outline-offset: -1px; }

/* Checkbox */
.prod-col-check { text-align: center; }
.prod-checkbox {
  width: 16px; height: 16px; cursor: pointer; accent-color: var(--blue);
}

/* ── Campos de edição em massa ────────────────────────── */
.prod-massa-fields {
  display: none;   /* escondido até modo massa */
  flex-direction: column; gap: 8px;
  margin-top: 10px; padding-top: 10px;
  border-top: 1px solid var(--border);
  animation: fadeSlideUp .2s ease;
}

.massa-mode .prod-massa-fields { display: flex; }

.prod-massa-row {
  display: flex; flex-direction: column; gap: 3px;
}
.prod-massa-field-label {
  font-size: 10px; font-weight: 700; text-transform: uppercase;
  letter-spacing: .5px; color: var(--text-3);
}

.prod-massa-input-group {
  display: flex; align-items: stretch; height: 34px;
  border: 1.5px solid var(--border); border-radius: var(--r-md);
  overflow: hidden; transition: border-color var(--t);
  max-width: 180px;
}
.prod-massa-input-group:focus-within { border-color: var(--blue); }

.prod-massa-prefix {
  padding: 0 8px; background: var(--bg);
  font-size: 12px; font-weight: 700; color: var(--text-3);
  border-right: 1px solid var(--border);
  display: flex; align-items: center; flex-shrink: 0;
}
.prod-massa-input {
  flex: 1; border: none; outline: none; min-width: 0;
  font-family: var(--font); font-size: 13.5px; font-weight: 700;
  color: var(--text); background: var(--surface); padding: 0 8px;
}
.prod-massa-btn {
  width: 34px; background: var(--bg); border: none;
  border-left: 1px solid var(--border); cursor: pointer;
  color: var(--text-3); display: flex; align-items: center; justify-content: center;
  transition: all var(--t); flex-shrink: 0;
}
.prod-massa-btn:hover { background: var(--success); color: #fff; }

/* Input success feedback */
.prod-massa-input.input-success {
  background: rgba(16,185,129,.08);
  border-color: var(--success);
}

/* ── Botão expandir variações ────────────────────────── */
.prod-expand-skus-btn {
  display: inline-flex; align-items: center; gap: 6px;
  background: none; border: 1.5px dashed var(--border2);
  border-radius: var(--r-md); padding: 6px 10px;
  font-family: var(--font); font-size: 12px; font-weight: 700;
  color: var(--text-3); cursor: pointer; transition: all var(--t);
  margin-top: 4px;
}
.prod-expand-skus-btn:hover {
  border-color: var(--blue); color: var(--blue);
  background: var(--blue-lt);
}
.prod-expand-skus-btn.expanded .expand-arrow {
  transform: rotate(180deg);
}
.expand-arrow { transition: transform .2s; }

/* ── Sub-row de SKUs ──────────────────────────────────── */
.prod-skus-subrow td { padding: 0 !important; background: var(--bg) !important; }
.prod-skus-container {
  padding: 14px 16px 14px 68px; /* alinha com o nome */
  border-top: 1px solid var(--border);
  border-bottom: 2px solid var(--blue);
  display: flex; flex-direction: column; gap: 8px;
}

.prod-sku-item {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 12px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r-md); transition: border-color var(--t);
}
.prod-sku-item:hover { border-color: var(--blue-lt); }

.prod-sku-codigo {
  font-family: var(--font-mono); font-size: 12px; font-weight: 700;
  color: var(--text); min-width: 100px; flex-shrink: 0;
}
.prod-sku-variacao {
  font-size: 12px; color: var(--text-3); flex: 1;
}
.prod-sku-preco-wrap {
  display: flex; flex-direction: column; align-items: flex-end; flex-shrink: 0;
}
.prod-sku-preco {
  font-size: 13.5px; font-weight: 800; color: var(--text);
}
.prod-sku-preco-label {
  font-size: 10px; color: var(--text-3); font-weight: 600;
}

/* Campo inline de preço/estoque do SKU */
.prod-sku-edit-wrap {
  display: flex; flex-direction: column; gap: 5px; flex-shrink: 0;
}
.prod-sku-preco-input-group,
.prod-sku-estoque-input-group {
  display: flex; align-items: stretch; height: 30px;
  border: 1.5px solid var(--border); border-radius: var(--r-md);
  overflow: hidden; transition: border-color var(--t);
  width: 140px;
}
.prod-sku-preco-input-group:focus-within,
.prod-sku-estoque-input-group:focus-within { border-color: var(--blue); }

.prod-sku-prefix {
  padding: 0 7px; background: var(--bg);
  font-size: 11px; font-weight: 700; color: var(--text-3);
  border-right: 1px solid var(--border);
  display: flex; align-items: center;
}
.prod-sku-field-input {
  flex: 1; border: none; outline: none;
  font-family: var(--font); font-size: 13px; font-weight: 700;
  color: var(--text); padding: 0 6px; min-width: 0;
  background: var(--surface);
}
.prod-sku-field-btn {
  width: 30px; background: var(--bg); border: none;
  border-left: 1px solid var(--border); cursor: pointer;
  color: var(--text-3); display: flex; align-items: center; justify-content: center;
  transition: all var(--t);
}
.prod-sku-field-btn:hover { background: var(--success); color: #fff; }

/* Loading skeleton para SKUs */
.prod-skus-loading {
  display: flex; flex-direction: column; gap: 8px; padding: 14px 16px 14px 68px;
  border-top: 1px solid var(--border);
}
.prod-sku-skeleton {
  height: 48px; border-radius: var(--r-md);
  background: linear-gradient(90deg, var(--surface2) 25%, var(--bg) 50%, var(--surface2) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.2s infinite;
}
@keyframes shimmer { to { background-position: -200% 0; } }

/* ── Compatibilidade por moto ────────────────────────────── */
/* ── Compatibilidade: accordion ──────────────────────────── */
.compat-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }

.compat-item {
  border: 1.5px solid var(--border);
  border-radius: var(--r-xl);
  overflow: hidden;
  transition: border-color .2s;
}
.compat-item:has(.compat-item-body.open) {
  border-color: var(--blue);
}

/* Header — clicável */
.compat-item-header {
  display: flex; align-items: center;
  gap: 10px; padding: 11px 14px;
  background: var(--surface); cursor: pointer;
  user-select: none; transition: background .15s;
  border-bottom: none; /* sem borda quando fechado */
}
.compat-item-header:hover { background: var(--bg); }
.compat-item:has(.compat-item-body.open) .compat-item-header {
  background: var(--blue-lt);
  border-bottom: 1px solid var(--border);
}

/* Ícone de moto */
.compat-item-moto {
  display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0;
}
.compat-item-moto svg { color: var(--blue); flex-shrink: 0; }

.compat-item-resumo {
  font-size: 13.5px; font-weight: 700; color: var(--text);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

/* Chevron */
.compat-item-chevron {
  flex-shrink: 0; color: var(--text-3);
  transition: transform .2s; margin-left: 4px;
}
.compat-item:has(.compat-item-body.open) .compat-item-chevron {
  transform: rotate(180deg);
  color: var(--blue);
}

/* Botão excluir no header */
.compat-item-del {
  flex-shrink: 0; opacity: .5; transition: opacity .15s;
}
.compat-item-header:hover .compat-item-del { opacity: 1; }

/* Body — accordion */
.compat-item-body {
  max-height: 0; overflow: hidden;
  transition: max-height .28s cubic-bezier(.4,0,.2,1),
              padding .28s;
  background: var(--surface);
}
.compat-item-body.open {
  max-height: 400px;
}

.compat-item-fields {
  display: grid;
  grid-template-columns: 1fr 1fr 100px 100px;
  gap: 12px;
  padding: 14px;
}
.compat-obs-group { grid-column: span 4; }

@media (max-width: 700px) {
  .compat-item-fields { grid-template-columns: 1fr 1fr; }
  .compat-obs-group   { grid-column: span 2; }
}

.compat-item-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 14px;
  background: var(--bg); border-bottom: 1px solid var(--border);
}
.compat-item-moto {
  display: flex; align-items: center; gap: 8px;
  font-size: 13.5px; font-weight: 700; color: var(--text);
}
.compat-item-moto svg { color: var(--blue); }

.compat-item-fields {
  display: grid;
  grid-template-columns: 1fr 1fr 100px 100px;
  gap: 12px; padding: 14px;
}
.compat-obs-group { grid-column: span 4; }

@media (max-width: 700px) {
  .compat-item-fields { grid-template-columns: 1fr 1fr; }
  .compat-obs-group   { grid-column: span 2; }
}

.compat-add-btn {
  display: inline-flex; align-items: center; gap: 7px;
  background: none; border: 1.5px dashed var(--border2);
  border-radius: var(--r-lg); padding: 9px 16px;
  font-family: var(--font); font-size: 13px; font-weight: 700;
  color: var(--text-3); cursor: pointer; transition: all var(--t);
}
.compat-add-btn:hover {
  border-color: var(--blue); color: var(--blue); background: var(--blue-lt);
}

.compat-empty {
  display: flex; flex-direction: column; align-items: center;
  padding: 28px 16px; gap: 8px; text-align: center; color: var(--text-3);
}
.compat-empty span { font-size: 14px; font-weight: 700; }
.compat-empty p    { font-size: 12.5px; }

.compat-aviso {
  display: flex; align-items: center; gap: 10px;
  padding: 14px; background: var(--warning-lt);
  border-radius: var(--r-md); font-size: 13.5px;
  color: var(--warning); font-weight: 600;
}

/* ═══════════════════════════════════════════════════════
   BUSCA POR MOTO — frontend + admin
   ═══════════════════════════════════════════════════════ */

/* ── Hero da página de montadoras ────────────────────── */
.moto-hero {
  background: linear-gradient(135deg, #0f172a 0%, #1e293b 60%, #0f172a 100%);
  padding: 52px 0 48px;
  position: relative; overflow: hidden;
}
.moto-hero::before {
  content: '';
  position: absolute; inset: 0;
  background: radial-gradient(ellipse at 70% 50%, rgba(239,68,68,.08) 0%, transparent 60%);
  pointer-events: none;
}
.moto-hero-inner {
  display: flex; align-items: center; justify-content: space-between;
  gap: 40px; flex-wrap: wrap;
}
.moto-hero-text { flex: 1; min-width: 280px; }
.moto-hero-eyebrow {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 11.5px; font-weight: 800; letter-spacing: .8px;
  text-transform: uppercase; color: var(--c-primary, #e63946);
  margin-bottom: 14px;
}
.moto-hero-titulo {
  font-size: clamp(28px, 4vw, 42px); font-weight: 900;
  color: #fff; letter-spacing: -.5px; line-height: 1.15;
  margin-bottom: 12px;
}
.moto-hero-sub {
  font-size: 15px; color: rgba(255,255,255,.6); line-height: 1.6;
  max-width: 420px;
}

/* Formulário de busca no hero */
.moto-hero-search { flex: 1; min-width: 320px; max-width: 560px; }
.moto-search-form { display: flex; flex-direction: column; gap: 10px; }
.moto-search-selects { display: flex; flex-direction: column; gap: 8px; }

.moto-select-wrap {
  position: relative; display: flex; flex-direction: column; gap: 4px;
}
.moto-select-label {
  font-size: 10.5px; font-weight: 800; text-transform: uppercase;
  letter-spacing: .6px; color: rgba(255,255,255,.5);
}
.moto-select {
  width: 100%; height: 46px;
  padding: 0 36px 0 14px;
  background: rgba(255,255,255,.08);
  border: 1.5px solid rgba(255,255,255,.12);
  border-radius: 10px; color: #fff;
  font-family: var(--font, inherit); font-size: 14px; font-weight: 600;
  appearance: none; -webkit-appearance: none;
  outline: none; cursor: pointer; transition: all .2s;
}
.moto-select:focus {
  border-color: rgba(255,255,255,.3); background: rgba(255,255,255,.12);
}
.moto-select:disabled { opacity: .4; cursor: not-allowed; }
.moto-select option { background: #1e293b; color: #fff; }
.moto-select-arrow {
  position: absolute; right: 12px; bottom: 13px;
  color: rgba(255,255,255,.4); pointer-events: none;
}

.moto-search-btn {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  height: 48px; background: var(--c-primary, #e63946); color: #fff;
  border: none; border-radius: 10px; font-family: var(--font, inherit);
  font-size: 15px; font-weight: 800; cursor: pointer;
  transition: all .2s;
}
.moto-search-btn:hover:not(:disabled) { filter: brightness(1.1); transform: translateY(-1px); }
.moto-search-btn:disabled { opacity: .5; cursor: not-allowed; }

/* ── Seção header ─────────────────────────────────────── */
.moto-section-header {
  margin-bottom: 24px;
}
.moto-section-header h2 {
  font-size: 24px; font-weight: 900; color: var(--c-dark, #0f172a);
  letter-spacing: -.3px; margin-bottom: 4px;
}
.moto-section-header p { font-size: 14px; color: var(--c-text-muted, #64748b); }

/* ── Grid de montadoras ───────────────────────────────── */
.moto-montadoras-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 12px;
}

.moto-montadora-card {
  display: flex; align-items: center; gap: 14px;
  padding: 14px 16px;
  background: var(--c-surface, #fff);
  border: 1.5px solid var(--c-border, #e2e8f0);
  border-radius: 14px; text-decoration: none;
  transition: all .2s; cursor: pointer;
}
.moto-montadora-card:hover {
  border-color: var(--c-primary, #e63946);
  box-shadow: 0 4px 20px rgba(0,0,0,.08);
  transform: translateY(-2px);
}

.moto-montadora-logo {
  width: 52px; height: 52px; border-radius: 10px;
  background: #f8fafc; border: 1px solid #e2e8f0;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden; padding: 6px; flex-shrink: 0;
}
.moto-montadora-logo img {
  max-width: 100%; max-height: 100%; object-fit: contain;
}
.moto-montadora-initials {
  font-size: 14px; font-weight: 900;
  color: #94a3b8; letter-spacing: .5px;
}

.moto-montadora-info { flex: 1; min-width: 0; }
.moto-montadora-nome {
  font-size: 15px; font-weight: 800; color: #0f172a;
  display: block; margin-bottom: 5px;
}
.moto-montadora-meta {
  display: flex; gap: 12px; flex-wrap: wrap;
}
.moto-montadora-meta span {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 12px; color: #64748b;
}
.moto-montadora-arrow {
  color: #94a3b8; flex-shrink: 0; transition: transform .2s;
}
.moto-montadora-card:hover .moto-montadora-arrow {
  transform: translateX(4px); color: var(--c-primary, #e63946);
}

/* ── Catálogo layout ──────────────────────────────────── */
.moto-catalogo-page { padding: 0 0 60px; }

.moto-breadcrumb {
  display: flex; align-items: center; gap: 6px;
  padding: 16px 0 20px; flex-wrap: wrap;
  font-size: 13px; color: #64748b;
}
.moto-breadcrumb a { color: #3b82f6; text-decoration: none; }
.moto-breadcrumb a:hover { text-decoration: underline; }
.moto-breadcrumb span { color: #0f172a; font-weight: 700; }

.moto-catalogo-layout {
  display: grid;
  grid-template-columns: 260px 1fr;
  gap: 24px; align-items: start;
}
@media (max-width: 900px) {
  .moto-catalogo-layout { grid-template-columns: 1fr; }
}

/* ── Sidebar ──────────────────────────────────────────── */
.moto-sidebar { display: flex; flex-direction: column; gap: 14px; }

.moto-sidebar-card {
  background: #fff; border: 1.5px solid #e2e8f0;
  border-radius: 14px; padding: 16px;
}
.moto-sidebar-titulo {
  font-size: 12px; font-weight: 800; text-transform: uppercase;
  letter-spacing: .5px; color: #64748b; margin-bottom: 12px;
}

/* Resumo da moto */
.moto-moto-resumo { display: flex; flex-direction: column; gap: 12px; }
.moto-moto-resumo-logo {
  width: 48px; height: 48px; border-radius: 10px;
  background: #f8fafc; border: 1px solid #e2e8f0;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden; padding: 6px;
}
.moto-moto-resumo-logo img {
  max-width: 100%; max-height: 100%; object-fit: contain;
}
.moto-moto-resumo-logo span {
  font-size: 14px; font-weight: 900; color: #94a3b8;
}
.moto-moto-resumo-nome {
  font-size: 16px; font-weight: 900; color: #0f172a;
  line-height: 1.3;
}
.moto-moto-resumo-nome span { display: block; font-weight: 600; font-size: 14px; }
.moto-moto-resumo-nome em   { font-style: normal; color: #64748b; font-size: 13px; }
.moto-moto-resumo-count {
  font-size: 12.5px; color: #64748b;
}
.moto-trocar-btn {
  display: inline-flex; align-items: center; justify-content: center;
  padding: 8px 14px; border-radius: 8px;
  border: 1.5px solid #e2e8f0; background: #f8fafc;
  font-size: 12.5px; font-weight: 700; color: #64748b;
  text-decoration: none; transition: all .2s;
}
.moto-trocar-btn:hover { border-color: #3b82f6; color: #3b82f6; }

/* Busca na sidebar */
.moto-sidebar-search { display: flex; flex-direction: column; gap: 8px; }
.moto-sidebar-search-wrap {
  display: flex; align-items: center; gap: 8px;
  background: #f8fafc; border: 1.5px solid #e2e8f0;
  border-radius: 8px; padding: 8px 12px;
  transition: border-color .2s;
}
.moto-sidebar-search-wrap:focus-within { border-color: #3b82f6; }
.moto-sidebar-search-wrap input {
  border: none; outline: none; flex: 1;
  font-size: 13.5px; background: transparent; color: #0f172a;
}

/* Lista de modelos */
.moto-modelos-list { display: flex; flex-direction: column; gap: 4px; }
.moto-modelo-item {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 10px; border-radius: 8px;
  text-decoration: none; transition: background .15s;
}
.moto-modelo-item:hover { background: #f1f5f9; }
.moto-modelo-thumb {
  width: 36px; height: 36px; object-fit: cover;
  border-radius: 6px; border: 1px solid #e2e8f0; flex-shrink: 0;
}
.moto-modelo-thumb-empty {
  width: 36px; height: 36px; background: #f1f5f9;
  border-radius: 6px; border: 1px solid #e2e8f0;
  display: flex; align-items: center; justify-content: center;
  color: #94a3b8; flex-shrink: 0;
}
.moto-modelo-nome {
  display: block; font-size: 13px; font-weight: 700; color: #0f172a;
}
.moto-modelo-count {
  font-size: 11px; color: #64748b;
}

/* Lista de anos */
.moto-anos-list { display: flex; flex-direction: column; gap: 3px; }
.moto-ano-item {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 10px; border-radius: 8px;
  text-decoration: none; border: 1.5px solid transparent;
  transition: all .15s;
}
.moto-ano-item:hover { background: #f1f5f9; border-color: #e2e8f0; }
.moto-ano-item.is-ativo {
  background: rgba(59,130,246,.08);
  border-color: #3b82f6; color: #3b82f6;
}
.moto-ano-num {
  font-size: 14px; font-weight: 800; color: #0f172a; flex: 1;
}
.moto-ano-item.is-ativo .moto-ano-num { color: #3b82f6; }
.moto-ano-count { font-size: 11px; color: #94a3b8; }

/* ── Catálogo header ──────────────────────────────────── */
.moto-catalogo-header {
  display: flex; align-items: flex-end; justify-content: space-between;
  margin-bottom: 20px; gap: 12px; flex-wrap: wrap;
}
.moto-catalogo-titulo {
  font-size: 22px; font-weight: 900; color: #0f172a;
  letter-spacing: -.3px; margin-bottom: 4px;
}
.moto-catalogo-sub { font-size: 13px; color: #64748b; }

.moto-catalogo-empty {
  display: flex; flex-direction: column; align-items: center;
  text-align: center; padding: 60px 20px; gap: 12px; color: #94a3b8;
}
.moto-catalogo-empty h3 { font-size: 18px; font-weight: 800; color: #334155; }
.moto-catalogo-empty p  { font-size: 14px; max-width: 360px; line-height: 1.6; }

/* ── Paginação ────────────────────────────────────────── */
.moto-paginacao {
  display: flex; align-items: center; justify-content: center;
  gap: 8px; margin-top: 32px; flex-wrap: wrap;
}
.moto-paginacao-nums { display: flex; gap: 4px; }

/* ═══════════════════════════════════════════════════════
   ADMIN — motos
   ═══════════════════════════════════════════════════════ */
.motos-stats-grid {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 14px; margin-bottom: 20px;
}
@media (max-width: 600px) { .motos-stats-grid { grid-template-columns: 1fr; } }

.motos-stat-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r-xl); padding: 18px 20px;
  display: flex; align-items: center; gap: 16px;
}
.motos-stat-icon {
  width: 48px; height: 48px; border-radius: var(--r-lg);
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.motos-stat-icon--blue   { background: var(--blue-lt);   color: var(--blue);   }
.motos-stat-icon--purple { background: #ede9fe;           color: #6d28d9;       }
.motos-stat-icon--green  { background: var(--success-lt); color: var(--success);}

.motos-stat-valor {
  display: block; font-size: 26px; font-weight: 900; color: var(--text);
  font-variant-numeric: tabular-nums; line-height: 1.2;
}
.motos-stat-label {
  font-size: 12px; color: var(--text-3); font-weight: 600;
}

/* Progress da sincronização */
.motos-sinc-progress { margin-bottom: 20px; }
.motos-sinc-header {
  display: flex; align-items: center; gap: 16px; margin-bottom: 16px;
}
.motos-sinc-spinner {
  width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
  border: 3px solid var(--border);
  border-top-color: var(--blue);
  animation: spin .8s linear infinite;
}
.motos-sinc-msg { font-size: 13px; color: var(--text-3); margin-top: 4px; }
.motos-progress-bar {
  height: 6px; background: var(--border); border-radius: 3px; overflow: hidden;
}
.motos-progress-fill {
  height: 100%; width: 0%; background: var(--blue);
  border-radius: 3px; transition: width .5s;
  animation: indeterminate 1.5s infinite;
}
@keyframes indeterminate {
  0%   { transform: translateX(-100%) scaleX(.5); }
  100% { transform: translateX(200%)  scaleX(.5); }
}
.motos-sinc-aviso {
  font-size: 12px; color: var(--text-3); font-style: italic; margin-top: 8px;
}

/* Thumb upload */
.motos-thumb-wrap {
  position: relative; width: 40px; height: 40px;
}
.motos-thumb-img {
  width: 40px; height: 40px; object-fit: contain;
  border-radius: 8px; border: 1px solid var(--border);
}
.motos-thumb-empty {
  width: 40px; height: 40px; background: var(--surface2);
  border: 1px solid var(--border); border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 900; color: var(--text-3);
}
.motos-thumb-upload-btn {
  position: absolute; bottom: -4px; right: -4px;
  width: 20px; height: 20px; border-radius: 50%;
  background: var(--blue); border: 2px solid var(--surface);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; color: #fff; transition: transform .2s;
}
.motos-thumb-upload-btn:hover { transform: scale(1.15); }

.motos-erro-msg {
  display: inline-block; cursor: help;
  color: var(--danger); font-size: 14px; margin-left: 4px;
}

/* Substitui a animação indeterminada por progresso real */
.motos-progress-bar {
  height: 8px; background: var(--border);
  border-radius: 4px; overflow: hidden;
  margin: 12px 0;
}
.motos-progress-fill {
  height: 100%; width: 0%;
  background: linear-gradient(90deg, var(--blue) 0%, #60a5fa 100%);
  border-radius: 4px;
  transition: width .4s ease;

  /* Animação indeterminada (estado inicial antes do progresso real) */
  animation: indeterminate 1.5s infinite;
}
/* Remove indeterminada quando tiver progresso real (via JS: style.animation='none') */
@keyframes indeterminate {
  0%   { margin-left: -40%; width: 40%; }
  100% { margin-left: 100%; width: 40%; }
}

/* Contador de stats durante a sinc */
.motos-sinc-stats {
  display: flex; gap: 20px; flex-wrap: wrap;
  font-size: 12.5px; color: var(--text-3);
  margin-top: 8px;
}
.motos-sinc-stats strong { color: var(--text); }

/* ── Banners admin ────────────────────────────────────────── */

/* Listagem de zonas */
.banner-zonas-grid {
  display: flex; flex-direction: column; gap: 16px;
}

.banner-zona-card {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: var(--r-xl);
  overflow: hidden;
}

.bz-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 18px; gap: 12px;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
}
.bz-header-info { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.bz-badge {
  padding: 2px 9px; border-radius: 99px;
  font-size: 10px; font-weight: 800; text-transform: uppercase;
  letter-spacing: .5px;
}
.bz-badge--slider     { background: rgba(99,102,241,.1); color: #4338ca; }
.bz-badge--grid       { background: rgba(245,158,11,.1); color: #92400e; }
.bz-badge--single     { background: rgba(34,197,94,.1);  color: #15803d; }
.bz-badge--full_width { background: rgba(220,38,38,.1);  color: #991b1b; }
.bz-title  { font-size: 14.5px; font-weight: 800; color: var(--text); }
.bz-meta   { font-size: 11.5px; color: var(--text-3); }

.bz-empty {
  display: flex; flex-direction: column; align-items: center;
  padding: 32px; gap: 8px; color: var(--text-3); text-align: center;
}
.bz-banners-list { padding: 8px; display: flex; flex-direction: column; gap: 6px; }

/* Item de banner */
.banner-item {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 12px; border-radius: var(--r-md);
  background: var(--surface); border: 1.5px solid var(--border);
  transition: border-color .15s;
}
.banner-item:hover { border-color: var(--blue); }

.banner-drag {
  color: var(--text-3); cursor: grab; font-size: 14px;
  flex-shrink: 0; user-select: none;
}

.banner-thumb {
  position: relative;
  width: 80px; height: 48px; border-radius: 6px;
  overflow: hidden; border: 1px solid var(--border);
  background: var(--bg); flex-shrink: 0;
}
.banner-thumb img { width: 100%; height: 100%; object-fit: cover; }
.banner-thumb-empty,
.banner-thumb-video {
  width: 100%; height: 100%; display: flex;
  align-items: center; justify-content: center;
  color: var(--text-3);
}
.banner-thumb-video { background: #1e293b; color: #fff; }
.banner-thumb-tag {
  position: absolute; top: 3px; right: 3px;
  font-size: 8px; font-weight: 900; letter-spacing: .5px;
  background: rgba(0,0,0,.7); color: #fff;
  padding: 1px 4px; border-radius: 3px;
}

.banner-info { flex: 1; min-width: 0; }
.banner-info-top {
  display: flex; align-items: center; gap: 8px;
  flex-wrap: wrap; margin-bottom: 4px;
}
.banner-info-top strong {
  font-size: 13.5px; font-weight: 700; color: var(--text);
}
.banner-info-meta {
  display: flex; gap: 12px; flex-wrap: wrap;
}
.banner-meta-item {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 11px; color: var(--text-3);
}
.banner-meta-ctr {
  font-size: 11px; font-weight: 800; color: var(--success);
  padding: 1px 7px; background: var(--success-lt); border-radius: 99px;
}

.banner-tag {
  font-size: 10px; font-weight: 800; padding: 1px 7px;
  border-radius: 99px;
}
.banner-tag--agendado { background: rgba(245,158,11,.1); color: #92400e; }
.banner-tag--expirado { background: rgba(220,38,38,.08); color: #991b1b; }

.banner-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }

/* ── Editor de banner ─────────────────────────────────────── */
.banner-editor-grid {
  display: grid;
  grid-template-columns: 1fr 320px;
  gap: 20px; align-items: start;
}
@media (max-width: 1000px) { .banner-editor-grid { grid-template-columns: 1fr; } }

.banner-editor-main { display: flex; flex-direction: column; gap: 16px; }

/* Tipo de mídia tabs */
.banner-tipo-tabs {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}
.banner-tipo-tab {
  display: flex; flex-direction: column; align-items: center;
  gap: 6px; padding: 14px 10px;
  border: 1.5px solid var(--border); border-radius: var(--r-md);
  cursor: pointer; transition: all .15s;
  font-size: 12.5px; font-weight: 700; color: var(--text-2);
  text-align: center;
}
.banner-tipo-tab input { display: none; }
.banner-tipo-tab:hover  { border-color: var(--blue); color: var(--blue); }
.banner-tipo-tab.is-active {
  border-color: var(--blue); background: var(--blue-lt); color: var(--blue);
}
@media (max-width: 600px) { .banner-tipo-tabs { grid-template-columns: 1fr; } }

/* Device tabs (Desktop/Mobile) */
.banner-device-tabs {
  display: flex; gap: 4px; margin-top: 16px;
  border-bottom: 2px solid var(--border);
}
.banner-device-tab {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 10px 16px;
  background: none; border: none; cursor: pointer;
  font-family: inherit; font-size: 13px; font-weight: 700;
  color: var(--text-3); border-bottom: 2px solid transparent;
  margin-bottom: -2px; transition: all .15s;
}
.banner-device-tab.is-active {
  color: var(--blue); border-bottom-color: var(--blue);
}
.banner-device-panel { padding-top: 16px; }
.banner-device-panel[hidden] { display: none; }

/* Upload areas */
.banner-upload-group { margin-top: 14px; }
.banner-upload-area {
  position: relative;
  border: 2px dashed var(--border2);
  border-radius: var(--r-md);
  background: var(--bg);
  cursor: pointer; transition: all .15s;
  overflow: hidden;
}
.banner-upload-area:hover { border-color: var(--blue); background: var(--blue-lt); }
.banner-upload-area.is-dragover {
  border-color: var(--blue); background: var(--blue-lt);
  border-style: solid;
}
.banner-upload-input {
  position: absolute; inset: 0; opacity: 0; cursor: pointer;
}
.banner-upload-empty {
  display: flex; flex-direction: column; align-items: center;
  padding: 30px 16px; gap: 6px; color: var(--text-3);
  text-align: center;
}
.banner-upload-empty span { font-size: 13px; font-weight: 700; color: var(--text-2); }
.banner-upload-empty small { font-size: 11.5px; }

.banner-upload-preview {
  position: relative; padding: 8px;
}
.banner-upload-preview img,
.banner-upload-preview video {
  width: 100%; max-height: 240px; object-fit: contain;
  border-radius: var(--r-sm); display: block;
  background: #000;
}

.banner-upload-preview iframe {
  width: 100%; max-height: 240px; object-fit: contain;
  border-radius: var(--r-sm); display: block;
  background: #000;
}
.banner-upload-remove {
  display: block; margin: 8px auto 0; padding: 5px 12px;
  background: var(--surface); border: 1.5px solid var(--border);
  border-radius: 6px; cursor: pointer; font-size: 12px;
  color: var(--text-2); transition: all .15s;
}
.banner-upload-remove:hover { border-color: var(--blue); color: var(--blue); }

.banner-video-opts {
  display: flex; gap: 12px; flex-wrap: wrap; margin-top: 10px;
}
.banner-check {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 12.5px; color: var(--text-2); cursor: pointer;
}

/* Posição do texto - grid 3x3 */
.banner-pos-grid {
  display: inline-grid;
  grid-template-columns: repeat(3, 38px);
  gap: 4px; padding: 6px;
  background: var(--bg); border-radius: var(--r-md);
}
.banner-pos-cell {
  width: 38px; height: 38px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 6px; cursor: pointer; font-size: 18px;
  background: var(--surface); border: 1.5px solid var(--border);
  transition: all .15s; color: var(--text-3);
}
.banner-pos-cell input { display: none; }
.banner-pos-cell:hover { border-color: var(--blue); color: var(--blue); }
.banner-pos-cell.is-active {
  border-color: var(--blue); background: var(--blue);
  color: #fff;
}

/* Color input combo */
.banner-color-input {
  display: flex; gap: 6px; align-items: center;
}
.banner-color-input input[type="color"] {
  width: 38px; height: 36px; border: 1.5px solid var(--border);
  border-radius: 6px; cursor: pointer; padding: 2px;
  background: var(--surface);
}
.banner-color-input input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
.banner-color-input input[type="color"]::-webkit-color-swatch { border: none; border-radius: 4px; }
.banner-color-input input[type="text"] { flex: 1; font-family: var(--font-mono); }

.banner-range {
  width: 100%; margin-top: 8px; cursor: pointer; accent-color: var(--blue);
}
.banner-range-val {
  display: block; font-size: 11.5px; color: var(--text-3); margin-top: 2px;
}
.banner-range-val span { font-weight: 700; color: var(--text); }

/* CTAs */
.banner-ctas { margin-top: 18px; padding-top: 18px; border-top: 1px solid var(--border); }
.banner-cta-section-title {
  font-size: 12px; font-weight: 800; text-transform: uppercase;
  letter-spacing: .5px; color: var(--text-3); margin-bottom: 12px;
}

.banner-cta-row {
  display: flex; gap: 12px; align-items: flex-start;
  padding: 12px; background: var(--bg);
  border-radius: var(--r-md); margin-bottom: 8px;
}
.banner-cta-num {
  width: 28px; height: 28px; border-radius: 50%;
  background: var(--blue); color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 800; flex-shrink: 0;
}
.banner-cta-fields {
  flex: 1; display: grid; grid-template-columns: 1fr 1fr 120px auto;
  gap: 6px; align-items: center;
}
@media (max-width: 700px) {
  .banner-cta-fields { grid-template-columns: 1fr; }
}

/* Preview */
.banner-preview-toolbar {
  display: flex; gap: 6px; padding: 12px 14px;
  background: #fff; border-bottom: 1px solid var(--border);
}
.banner-preview-btn {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 6px 12px; border: 1.5px solid var(--border);
  border-radius: 6px; background: none; cursor: pointer;
  font-size: 12px; font-weight: 700; color: var(--text-3);
  transition: all .15s;
}
.banner-preview-btn.is-active {
  border-color: var(--blue); background: var(--blue); color: #fff;
}
.banner-preview-canvas {
  padding: 24px; display: flex; align-items: center; justify-content: center;
  min-height: 240px;
}
.banner-preview-frame {
  width: 100%;
  max-width: 800px;
  position: relative;
  background: #1e293b;
  border-radius: 10px;
  overflow: hidden;
  aspect-ratio: 16 / 5;
  box-shadow: 0 10px 40px rgba(0,0,0,.15);
  transition: max-width .3s;
  -webkit-transition:;
  -moz-transition:;
  -ms-transition:;
  -o-transition:;
}
.banner-preview-frame.is-mobile {
  max-width: 320px; aspect-ratio: 9 / 16;
}

/* Stats */
.banner-stats {
  display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
}
.banner-stat {
  text-align: center; padding: 12px 6px;
  background: var(--bg); border-radius: var(--r-md);
}
.banner-stat strong {
  display: block; font-size: 18px; font-weight: 900; color: var(--text);
}
.banner-stat span {
  font-size: 10.5px; color: var(--text-3);
  text-transform: uppercase; letter-spacing: .5px;
}
.banner-stat--ctr {
  grid-column: span 2;
  background: var(--success-lt); color: var(--success);
}
.banner-stat--ctr strong { color: var(--success); }

/* ── Moderação de fotos ──────────────────────────────────── */
.mod-tabs { display: flex; gap: 4px; }
.mod-tab {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 14px;
  background: var(--bg); border: 1.5px solid var(--border);
  border-radius: 8px;
  text-decoration: none;
  font-size: 13px; font-weight: 700; color: var(--text-2);
  transition: all .15s;
}
.mod-tab:hover { border-color: var(--blue); color: var(--blue); }
.mod-tab.is-active {
  background: var(--text); border-color: var(--text); color: #fff;
}
.mod-tab-badge {
  background: #f59e0b; color: #fff;
  padding: 1px 7px; border-radius: 99px;
  font-size: 10.5px; font-weight: 800;
}
.mod-tab.is-active .mod-tab-badge { background: #fff; color: var(--text); }

.mod-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 14px;
}

.mod-card {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: var(--r-lg);
  overflow: hidden;
  transition: all .15s;
}
.mod-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,.06); }

.mod-card-img {
  position: relative;
  aspect-ratio: 1;
  background: #f1f5f9;
  overflow: hidden;
}
.mod-card-img img {
  width: 100%; height: 100%; object-fit: cover;
}
.mod-card-zoom {
  position: absolute; top: 8px; right: 8px;
  width: 32px; height: 32px;
  background: rgba(15,23,42,.8);
  backdrop-filter: blur(4px);
  border: none; border-radius: 8px;
  color: #fff; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background .15s;
}
.mod-card-zoom:hover { background: rgba(15,23,42,.95); }

.mod-card-body { padding: 12px 14px; }

.mod-card-cliente {
  display: flex; align-items: center; gap: 8px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--bg);
  margin-bottom: 10px;
}
.mod-cliente-avatar {
  width: 32px; height: 32px;
  border-radius: 50%;
  background: linear-gradient(135deg, #3b82f6, #1e40af);
  color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 800;
  flex-shrink: 0;
}
.mod-card-cliente strong {
  display: block; font-size: 13px; font-weight: 700; color: var(--text);
}
.mod-card-cliente span {
  display: block; font-size: 11.5px; color: var(--text-3);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

.mod-card-moto {
  display: flex; align-items: center; gap: 6px;
  font-size: 12.5px; color: var(--text-2);
  margin-bottom: 8px;
}
.mod-card-moto svg { color: var(--text-3); flex-shrink: 0; }

.mod-card-legenda {
  font-size: 12.5px; color: var(--text-2);
  background: var(--bg);
  padding: 8px 10px; border-radius: 6px;
  font-style: italic; line-height: 1.4;
  margin-bottom: 8px;
}

.mod-card-meta {
  display: flex; gap: 10px; flex-wrap: wrap;
  font-size: 11px; color: var(--text-3);
}
.mod-card-meta span {
  display: inline-flex; align-items: center; gap: 4px;
}

.mod-card-actions {
  display: flex; gap: 6px;
  padding: 10px 12px;
  border-top: 1px solid var(--bg);
  background: #fafbfc;
}
.mod-btn {
  flex: 1; display: inline-flex; align-items: center; justify-content: center;
  gap: 5px; padding: 9px 12px;
  border: 1.5px solid; border-radius: 8px;
  font-family: inherit; font-size: 12.5px; font-weight: 800;
  cursor: pointer; transition: all .15s;
}
.mod-btn--rejeitar {
  background: #fff; border-color: var(--border); color: #dc2626;
}
.mod-btn--rejeitar:hover { border-color: #dc2626; background: #fef2f2; }
.mod-btn--aprovar {
  background: #16a34a; border-color: #16a34a; color: #fff;
}
.mod-btn--aprovar:hover { background: #15803d; border-color: #15803d; }

/* Lightbox */
.mod-lightbox {
  position: fixed; inset: 0; z-index: 2000;
  background: rgba(15,23,42,.95);
  display: flex; align-items: center; justify-content: center;
  padding: 40px;
}

/* Modal de rejeição */
.mod-modal {

}

.mod-modal-content {

.mod-modal-footer {

}
.btn-cancel {
  padding: 9px 16px;
  background: #fff; border: 1.5px solid var(--border);
  border-radius: 8px; cursor: pointer;
  font-family: inherit; font-size: 13px; font-weight: 700;
  color: var(--text-2);
}
.btn-confirm-reject {
  padding: 9px 18px;
  background: #dc2626; border: none;
  border-radius: 8px; cursor: pointer;
  font-family: inherit; font-size: 13px; font-weight: 800;
  color: #fff;
}
.btn-confirm-reject:hover { background: #b91c1c; }

/* ── Layout do form ──────────────────────────────────── */
.clip-form-grid {
  display: grid;
  grid-template-columns: 320px 1fr;
  gap: 20px;
  align-items: start;
}
@media (max-width: 900px) {
  .clip-form-grid { grid-template-columns: 1fr; }
}

.clip-form-side { display: flex; flex-direction: column; gap: 16px; position: sticky; top: 20px; }
.clip-form-main { display: flex; flex-direction: column; gap: 16px; min-width: 0; }

@media (max-width: 900px) {
  .clip-form-side { position: static; }
}

/* ── Upload areas ────────────────────────────────────── */
.clip-upload-area {
  position: relative;
  border: 2px dashed var(--border);
  border-radius: var(--r-lg);
  padding: 24px 16px;
  text-align: center;
  cursor: pointer;
  background: var(--bg);
  transition: all .15s;
}
.clip-upload-area:hover,
.clip-upload-area.is-dragover {
  border-color: var(--blue);
  background: #eff6ff;
}
.clip-upload-area--poster { padding: 16px; }

.clip-upload-input {
  position: absolute;
  inset: 0;
  opacity: 0;
  cursor: pointer;
}
.clip-upload-empty p {
  font-size: 13px;
  color: var(--text);
  margin: 8px 0 4px;
}
.clip-upload-empty p strong { font-weight: 700; }
.clip-upload-empty small {
  display: block;
  font-size: 11.5px;
  color: var(--text-3);
  line-height: 1.5;
}
.clip-upload-empty svg {
  color: var(--text-3);
  margin: 0 auto;
}

/* Preview do vídeo */
.clip-video-preview {
  margin-bottom: 12px;
}
.clip-video-preview video {
  width: 100%;
  max-width: 280px;
  margin: 0 auto;
  display: block;
  border-radius: var(--r-lg);
  background: #000;
  aspect-ratio: 9/16;
  object-fit: cover;
}
.clip-video-meta {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 8px;
  justify-content: center;
  font-size: 11px;
  color: var(--text-3);
}
.clip-video-meta span {
  background: var(--bg);
  padding: 2px 8px;
  border-radius: 4px;
}

/* Preview do poster */
.clip-poster-preview {
  margin-bottom: 12px;
  text-align: center;
}
.clip-poster-preview img {
  max-width: 140px;
  aspect-ratio: 9/16;
  object-fit: cover;
  border-radius: var(--r-md);
  border: 1.5px solid var(--border);
}

/* ── Estatísticas ────────────────────────────────────── */
.clip-stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
  gap: 10px;
}
.clip-stat {
  background: var(--bg);
  border-radius: var(--r-md);
  padding: 14px 12px;
  text-align: center;
}
.clip-stat strong {
  display: block;
  font-size: 22px;
  font-weight: 800;
  color: var(--text);
  letter-spacing: -.5px;
  margin-bottom: 2px;
}
.clip-stat span {
  font-size: 11px;
  color: var(--text-3);
  text-transform: uppercase;
  letter-spacing: .4px;
  font-weight: 600;
}

/* ── Toggles ─────────────────────────────────────────── */
.form-toggle {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 10px 12px;
  background: var(--bg);
  border: 1.5px solid var(--border);

  transition: all .15s;

}
.form-toggle input { margin-top: 2px; flex-shrink: 0; accent-color: var(--blue); }
.form-toggle span {
  display: block;
  font-size: 13px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 2px;
}
.form-toggle small {
  display: block;
  font-size: 11.5px;
  color: var(--text-3);
}

/* ── Form rows ───────────────────────────────────────── */
.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
@media (max-width: 600px) { .form-row { grid-template-columns: 1fr; } }

.required { color: #dc2626; }

.admin-back-link {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 12.5px;
  color: var(--text-2);
  text-decoration: none;
  margin-bottom: 6px;

}
