<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Sem conexão</title>
  <style>
    :root {
      --bg:     #0f172a;
      --card:   #1e293b;
      --accent: #3b82f6;
      --text:   #f1f5f9;
      --muted:  #94a3b8;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom);
      text-align: center;
    }
    .offline-wrap {
      max-width: 360px;
      animation: rise .5s cubic-bezier(.22,1,.36,1);
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .offline-icon {
      width: 88px;
      height: 88px;
      margin: 0 auto 28px;
      background: var(--card);
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .offline-icon svg { stroke: var(--accent); }
    .offline-icon::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 24px;
      box-shadow: 0 0 0 0 rgba(59,130,246,.4);
      animation: pulse 2.4s ease infinite;
    }
    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0 rgba(59,130,246,.4); }
      70%  { box-shadow: 0 0 0 18px rgba(59,130,246,0); }
      100% { box-shadow: 0 0 0 0 rgba(59,130,246,0); }
    }
    h1 {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 10px;
      letter-spacing: -.3px;
    }
    p {
      font-size: 15px;
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .btn-retry {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--accent);
      color: #fff;
      border: none;
      font-size: 15px;
      font-weight: 700;
      padding: 13px 28px;
      border-radius: 12px;
      cursor: pointer;
      font-family: inherit;
      transition: transform .2s cubic-bezier(.34,1.56,.64,1), background .15s;
    }
    .btn-retry:hover  { background: #2563eb; transform: translateY(-2px); }
    .btn-retry:active { transform: scale(.97); }
    .offline-hint {
      margin-top: 20px;
      font-size: 13px;
      color: var(--muted);
      opacity: .7;
    }
  </style>
</head>
<body>
  <div class="offline-wrap">
    <div class="offline-icon">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none"
           stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1 1l22 22"/>
        <path d="M16.72 11.06A10.94 10.94 0 0119 12.55"/>
        <path d="M5 12.55a10.94 10.94 0 015.17-2.39"/>
        <path d="M10.71 5.05A16 16 0 0122.58 9"/>
        <path d="M1.42 9a15.91 15.91 0 014.7-2.88"/>
        <path d="M8.53 16.11a6 6 0 016.95 0"/>
        <line x1="12" y1="20" x2="12.01" y2="20"/>
      </svg>
    </div>
    <h1>Você está sem conexão</h1>
    <p>Não foi possível carregar esta página. Verifique sua internet e tente novamente.</p>
    <button class="btn-retry" onclick="window.location.reload()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <polyline points="23 4 23 10 17 10"/>
        <path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/>
      </svg>
      Tentar novamente
    </button>
    <p class="offline-hint">Algumas páginas visitadas continuam disponíveis offline.</p>
  </div>

  <script>
    // Auto-reload quando a conexão voltar
    window.addEventListener('online', () => window.location.reload());
  </script>
</body>
</html>
