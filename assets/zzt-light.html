<!doctype html><html lang="pt-BR" data-theme="light"><head><meta charset="utf-8"><title>light</title><style>
/* ==== admin.css ==== */
/* ═══════════════════════════════════════════════════════════
   ADMIN PANEL — Modern Design System
   Tech-forward · Clean · Trustworthy
   ═══════════════════════════════════════════════════════════ */

@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap');

/* ── Tokens ────────────────────────────────────────────────── */
:root {
  /* Gradient principal */
  --grad-primary: linear-gradient(135deg, #2563eb 0%, #0ea472 100%);
  --grad-primary-soft: linear-gradient(135deg, rgba(37,99,235,.1) 0%, rgba(14,164,114,.1) 100%);
  --grad-hero: linear-gradient(135deg, #1e3a8a 0%, #065f46 100%);

  /* Cores */
  --blue:    #2563eb;
  --green:   #0ea472;
  --blue-lt: #eff6ff;
  --green-lt:#ecfdf5;

  /* Superfícies */
  --bg:      #f8fafc;
  --surface: #ffffff;
  --surface2:#f1f5f9;

  /* Bordas */
  --border:  #e2e8f0;
  --border2: #cbd5e1;

  /* Texto */
  --text:    #0f172a;
  --text-2:  #475569;
  --text-3:  #94a3b8;

  /* Status */
  --success:    #059669;
  --success-lt: #d1fae5;
  --warning:    #d97706;
  --warning-lt: #fef3c7;
  --danger:     #dc2626;
  --danger-lt:  #fee2e2;
  --info:       #0284c7;
  --info-lt:    #e0f2fe;
  --muted-lt:   #f1f5f9;
  /* Bordas das familias semanticas (tom claro sobre fundo -lt). Existem porque
     os avisos inline usavam #bbf7d0/#fecaca/#fde68a/#bfdbfe soltos no HTML e
     essas bordas precisam clarear/escurecer junto com o tema. */
  /* Roxo e cor semantica do dominio (status "aguardando resposta", tipo de
     promocao "brinde", aviso de super admin) e vivia so como literal no HTML. */
  /* -------------------------------------------------------------------------
     Tokens de modulos legados (--c-*, --lw-*, --em-*, --adq-*) e genericos.

     Eles so existiam dentro das camadas de tema escuro, que antes redeclaravam
     :root sem escopo. Com o seletor de tema, essas camadas passaram a valer so
     sob [data-theme="dark"] — sem os valores claros abaixo, os modulos que os
     usam ficariam sem cor no tema claro (o titulo da pagina, por exemplo, some).
     ------------------------------------------------------------------------- */
  --c-bg:          #f8fafc;
  --c-surface:     #ffffff;
  --c-border:      #e2e8f0;
  --c-dark:        #0f172a;
  --c-text:        #475569;
  --c-text-muted:  #64748b;
  --c-muted:       #64748b;
  --c-primary:     #2563eb;
  --c-primary-l:   #eff6ff;
  --c-primary-rgb: 37, 99, 235;
  --c-accent:      #2563eb;
  --c-accent-l:    #eff6ff;
  --c-success:     #059669;

  --surface-2:     #f1f5f9;
  --surface-3:     #e2e8f0;
  --text-0:        #0f172a;
  --text-1:        #475569;
  --line:          #e2e8f0;
  --line-hi:       #cbd5e1;
  --shadow:        0 8px 24px rgba(0,0,0,.08);
  --ok:            #059669;
  --error:         #ea580c;
  --critical:      #dc2626;
  --debug:         #64748b;

  /* Visualizador de logs */
  --lw-surface:    #ffffff;
  --lw-line:       #e2e8f0;
  --lw-t0:         #0f172a;
  --lw-t1:         #475569;
  --lw-t2:         #64748b;
  --lw-ok:         #059669;
  --lw-warning:    #d97706;
  --lw-error:      #ea580c;
  --lw-critical:   #dc2626;

  /* E-mail marketing / adquirentes */
  --em-bg-card:    #ffffff;
  --em-text-muted: #64748b;
  --adq-aviso-tx:  #92400e;
  --accent-sf:     rgba(230,57,70,.10);

  --purple:     #7c3aed;
  --purple-lt:  #f5f3ff;
  --purple-bd:  #ddd6fe;
  --success-bd: #bbf7d0;
  --danger-bd:  #fecaca;
  --warning-bd: #fde68a;
  --blue-bd:    #bfdbfe;
  --dartk: #1a1a2e;

  /* Geometria */
  --r-sm:  6px;
  --r-md:  10px;
  --r-lg:  16px;
  --r-xl:  20px;
  --r-2xl: 28px;

  /* Sombras */
  --shadow-xs: 0 1px 2px rgba(0,0,0,.04);
  --shadow-sm: 0 2px 8px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
  --shadow-md: 0 4px 20px rgba(0,0,0,.08), 0 2px 6px rgba(0,0,0,.04);
  --shadow-lg: 0 12px 40px rgba(0,0,0,.1), 0 4px 12px rgba(0,0,0,.06);

  /* Sidebar */
  --sidebar-w: 252px;
  --topbar-h:  60px;

  /* Tipografia */
  --font: 'Plus Jakarta Sans', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', monospace;

  /* Transição */
  --t: .18s cubic-bezier(.4,0,.2,1);
}

/* ── Reset base ───────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { font-size: 15px; }

body.admin-body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  min-height: 100vh;
  display: flex;
  -webkit-font-smoothing: antialiased;
}

a { color: inherit; text-decoration: none; }
button { font-family: var(--font); }
input, select, textarea { font-family: var(--font); }

/* ── Layout ───────────────────────────────────────────────── */
.admin-sidebar {
  width: var(--sidebar-w);
  background: var(--surface);
  border-right: 1px solid var(--border);
  height: 100vh;
  position: fixed;
  top: 0; left: 0;
  display: flex;
  flex-direction: column;
  z-index: 200;
  overflow: hidden;
}

.admin-main {
  margin-left: var(--sidebar-w);
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
}

.admin-content {
  padding: 28px 32px;
  flex: 1;
  /* max-width: 1400px; */
  width: 100%;
  animation: fadeSlideUp .4s ease both;
}

@keyframes fadeSlideUp {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ── Sidebar logo ─────────────────────────────────────────── */
.admin-sidebar-logo {
  padding: 20px 20px 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
}
.admin-logo-icon {
  width: 34px; height: 34px;
  background: var(--grad-primary);
  border-radius: var(--r-md);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.admin-logo-icon svg { stroke: #fff; }
.admin-logo-text {
  font-size: 15px;
  font-weight: 800;
  color: var(--text);
  letter-spacing: -.3px;
}
.admin-logo-badge {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .6px;
  color: var(--blue);
  background: var(--blue-lt);
  padding: 2px 7px;
  border-radius: 99px;
  margin-left: auto;
}

.icon-finder-floating {
    position: fixed;
    right: 20px;
    bottom: 20px;
    z-index: 999;
    height: 46px;
    padding: 0 16px;
    border: 0;
    border-radius: 999px;
    background: #111;
    color: #fff;
    cursor: pointer;
    box-shadow: 0 10px 30px rgba(0,0,0,.2);
}

.ntf-bell-wrap{position:relative;display:inline-block}
.ntf-bell{position:relative;background:none;border:none;cursor:pointer;font-size:20px;color:inherit;padding:8px;border-radius:10px;transition:background .15s}
.ntf-bell:hover{background:rgba(0,0,0,.06)}
.ntf-badge{position:absolute;top:2px;right:0;min-width:18px;height:18px;background:#e53935;color:#fff;font-size:10px;font-weight:700;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 5px;line-height:1}
.ntf-modal{position:absolute;top:calc(100% + 8px);right:0;width:480px;max-width:92vw;background:#fff;border:0.5px solid #e4e4e7;border-radius:16px;box-shadow:0 12px 40px rgba(0,0,0,.14);z-index:1000;overflow:hidden}
.ntf-modal-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:0.5px solid #f0f0f2}
.ntf-modal-title{font-size:15px;font-weight:600;color:#0f0f10}
.ntf-link-btn{background:none;border:none;color:#0a66c2;font-size:12px;cursor:pointer;padding:4px}
.ntf-link-btn:hover{text-decoration:underline}
.ntf-filtros{display:flex;gap:6px;padding:10px 16px;overflow-x:auto;border-bottom:0.5px solid #f0f0f2;scrollbar-width:none}
.ntf-filtros::-webkit-scrollbar{display:none}
.ntf-chip{background:#f4f4f5;border:none;border-radius:14px;font-size:12px;padding:5px 12px;cursor:pointer;white-space:nowrap;color:#52525b;transition:all .15s}
.ntf-chip-ativa{background:#0f0f10;color:#fff}
.ntf-lista{max-height:420px;overflow-y:auto}
.ntf-item{display:flex;gap:12px;padding:13px 16px;border-bottom:0.5px solid #f6f6f7;cursor:pointer;transition:background .12s;position:relative}
.ntf-item:hover{background:#fafafa}
.ntf-item-naolida{background:#f0f7ff}
.ntf-item-naolida:hover{background:#e8f2fe}
.ntf-item-icone{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.ntf-item-corpo{flex:1;min-width:0}
.ntf-item-titulo{font-size:13px;font-weight:600;color:#0f0f10;margin:0 0 2px;line-height:1.35}
.ntf-item-msg{font-size:12px;color:#71717a;margin:0;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ntf-item-img{width:100%;max-height:120px;object-fit:cover;border-radius:8px;margin-top:8px}
.ntf-item-tempo{font-size:11px;color:#a1a1aa;flex-shrink:0;margin-top:2px}
.ntf-dot{width:8px;height:8px;background:#0a66c2;border-radius:50%;position:absolute;top:16px;right:12px}
.ntf-vazio{padding:40px 16px;text-align:center;color:#a1a1aa;font-size:13px}
.ntf-modal-foot{padding:8px;text-align:center;border-top:0.5px solid #f0f0f2}
@media(prefers-color-scheme:dark){
  html:not([data-theme="light"]) .ntf-modal {background:#1c1c1e;border-color:#2c2c2e}
  html:not([data-theme="light"]) .ntf-modal-head, html:not([data-theme="light"]) .ntf-filtros, html:not([data-theme="light"]) .ntf-modal-foot {border-color:#2c2c2e}
  html:not([data-theme="light"]) .ntf-modal-title, html:not([data-theme="light"]) .ntf-item-titulo {color:#f4f4f5}
  html:not([data-theme="light"]) .ntf-item {border-color:#242426}
  html:not([data-theme="light"]) .ntf-item:hover {background:#232325}
  html:not([data-theme="light"]) .ntf-item-naolida {background:#12233a}
  html:not([data-theme="light"]) .ntf-item-naolida:hover {background:#16293f}
  html:not([data-theme="light"]) .ntf-chip {background:#2c2c2e;color:#a1a1aa}
  html:not([data-theme="light"]) .ntf-chip-ativa {background:#f4f4f5;color:#0f0f10}
  html:not([data-theme="light"]) .ntf-bell:hover {background:rgba(255,255,255,.08)}
}

/* ── Sidebar nav ──────────────────────────────────────────── */
.admin-nav {
  flex: 1;
  overflow-y: auto;
  padding: 12px 10px;
}
.admin-nav::-webkit-scrollbar { width: 4px; }
.admin-nav::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }

.admin-nav-section {
  margin-bottom: 20px;
}
.admin-nav-section-title {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--text-3);
  padding: 0 10px;
  margin-bottom: 4px;
}

.admin-nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0px 5px;
  border-radius: var(--r-md);
  font-size: 13.5px;
  font-weight: 500;
  color: var(--text-2);
  cursor: pointer;
  transition: all var(--t);
  position: relative;
}
.admin-nav-item:hover {
  background: var(--surface2);
  color: var(--text);
}
.admin-nav-item.active {
  background: var(--grad-primary-soft);
  color: var(--blue);
  font-weight: 700;
}
.admin-nav-item.active::before {
  content: '';
  position: absolute;
  left: 0; top: 50%;
  transform: translateY(-50%);
  width: 3px; height: 20px;
  background: var(--grad-primary);
  border-radius: 0 4px 4px 0;
}
.admin-nav-icon {
  width: 25px; height: 25px;
  border-radius: var(--r-sm);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  background: transparent;
  transition: background var(--t);
  margin: 5px 0;
}
.admin-nav-item:hover .admin-nav-icon,
.admin-nav-item.active .admin-nav-icon {
  background: rgba(37,99,235,.08);
}
.admin-nav-item.active .admin-nav-icon svg { stroke: var(--blue); }
.admin-nav-badge {
  margin-left: auto;
  font-size: 10px;
  font-weight: 800;
  min-width: 18px; height: 18px;
  border-radius: 99px;
  display: flex; align-items: center; justify-content: center;
  padding: 0 5px;
}
.admin-nav-badge--red   { background: var(--danger-lt); color: var(--danger); }
.admin-nav-badge--amber { background: var(--warning-lt); color: var(--warning); }

/* Sidebar footer */
.admin-sidebar-footer {
  padding: 14px 10px;
  border-top: 1px solid var(--border);
}
.admin-user-card {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 10px;
  border-radius: var(--r-md);
  cursor: pointer;
  transition: background var(--t);
}
.admin-user-card:hover { background: var(--surface2); }
.admin-user-avatar {
  width: 34px; height: 34px; border-radius: 50%;
  background: var(--grad-primary);
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 800; color: #fff; flex-shrink: 0;
}
.admin-user-info strong {
  display: block; font-size: 13px; font-weight: 700; color: var(--text);
}
.admin-user-info span {
  font-size: 11px; color: var(--text-3);
}

/* ── Confirm dialog ──────────────────────────────────────── */
#admin-confirm-container {
  position: fixed;
  bottom: 24px;
  right: 24px;
  z-index: 10000;
  display: flex;
  flex-direction: column;
  gap: 10px;
  pointer-events: none;
  max-width: 420px;
  width: calc(100vw - 48px);
}

.admin-confirm-backdrop {
  pointer-events: all;
  opacity: 0;
  transform: translateY(16px) scale(.97);
  transition: opacity .25s cubic-bezier(.4,0,.2,1),
              transform .25s cubic-bezier(.4,0,.2,1);
}
.admin-confirm-backdrop.visible {
  opacity: 1;
  transform: translateY(0) scale(1);
}
.admin-confirm-backdrop.hiding {
  opacity: 0;
  transform: translateY(8px) scale(.96);
  transition-duration: .2s;
}

.admin-confirm-box {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-xl);
  box-shadow: var(--shadow-lg);
  padding: 16px 18px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  position: relative;
  overflow: hidden;
}

/* Borda lateral por tipo */
.admin-confirm-box::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3px;
  border-radius: 3px 0 0 3px;
}
.admin-confirm-icon--danger  ~ * + * + *::before,
.admin-confirm-box:has(.admin-confirm-icon--danger)::before  { background: var(--danger); }
.admin-confirm-box:has(.admin-confirm-icon--warning)::before { background: var(--warning); }
.admin-confirm-box:has(.admin-confirm-icon--info)::before    { background: var(--blue); }

.admin-confirm-icon {
  width: 40px; height: 40px;
  border-radius: var(--r-md);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.admin-confirm-icon--danger  { background: var(--danger-lt);  color: var(--danger); }
.admin-confirm-icon--warning { background: var(--warning-lt); color: var(--warning); }
.admin-confirm-icon--info    { background: var(--blue-lt);    color: var(--blue); }

.admin-confirm-content { flex: 1; }
.admin-confirm-titulo  {
  font-size: 14px; font-weight: 800;
  color: var(--text); margin-bottom: 4px;
}
.admin-confirm-msg {
  font-size: 13px; color: var(--text-2); line-height: 1.5;
}

.admin-confirm-actions {
  display: flex; gap: 8px; justify-content: flex-end;
}

/* Botões de confirmar por tipo */
.admin-confirm-btn--danger {
  background: var(--danger); color: #fff; border-color: transparent;
}
.admin-confirm-btn--danger:hover  { filter: brightness(1.1); }
.admin-confirm-btn--warning {
  background: var(--warning); color: #fff; border-color: transparent;
}
.admin-confirm-btn--info {
  background: var(--blue); color: #fff; border-color: transparent;
}

/* Mobile */
@media (max-width: 480px) {
  #admin-confirm-container {
    bottom: 16px; right: 16px; left: 16px;
    width: auto; max-width: none;
  }
}

/* ── Topbar ───────────────────────────────────────────────── */
.admin-topbar {
  height: var(--topbar-h);
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 32px;
  gap: 16px;
  position: sticky;
  top: 0;
  z-index: 100;
}
.admin-topbar-search {
  display: flex; align-items: center; gap: 8px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  padding: 7px 14px;
  flex: 1; max-width: 360px;
  transition: border-color var(--t), box-shadow var(--t);
}
.admin-topbar-search:focus-within {
  border-color: var(--blue);
  box-shadow: 0 0 0 3px rgba(37,99,235,.1);
}
.admin-topbar-search input {
  border: none; outline: none; background: transparent;
  font-size: 13px; color: var(--text); flex: 1;
}
.admin-topbar-search svg { stroke: var(--text-3); flex-shrink: 0; }

.admin-topbar-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.admin-topbar-btn {
  width: 36px; height: 36px; border-radius: var(--r-md);
  border: none; background: var(--bg); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-2); position: relative;
  transition: all var(--t);
}
.admin-topbar-btn:hover { background: var(--surface2); color: var(--text); }
.admin-topbar-btn-dot {
  position: absolute; top: 6px; right: 6px;
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--danger);
  border: 2px solid var(--surface);
}

.admin-topbar-btn.power {
  width: auto;
  padding: 0 10px;;
  font-size: 0.8em;
}

/* Alternador de tema — mostra o icone do tema para o qual vai MUDAR, nao o do
   tema atual: no escuro aparece o sol (clique para clarear) e vice-versa.
   Os dois icones ficam no HTML e o CSS escolhe qual exibir, de modo que a troca
   e instantanea e nao depende do JS ter carregado. */
.admin-tema-btn { color: var(--text-2); }

.admin-tema-ico { display: none; line-height: 0; }
.admin-tema-ico svg { width: 18px; height: 18px; display: block; }

.admin-tema-ico--escuro { display: inline-flex; }
.admin-tema-ico--claro  { display: none; }

html[data-theme="dark"] .admin-tema-ico--escuro { display: none; }
html[data-theme="dark"] .admin-tema-ico--claro  { display: inline-flex; }

.admin-topbar-btn.power svg {
  margin-right: 6px;
}

/* ── Page header ──────────────────────────────────────────── */
.admin-page-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 28px;
  gap: 16px;
  flex-wrap: wrap;
}
.admin-page-header h1 {
  font-size: 22px;
  font-weight: 800;
  color: var(--text);
  letter-spacing: -.4px;
  line-height: 1.2;
}
.admin-page-header p {
  font-size: 13px;
  color: var(--text-3);
  margin-top: 3px;
}

/* Badge de alerta no header */
.admin-alert-badge {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 14px;
  border-radius: var(--r-lg);
  font-size: 12px; font-weight: 700;
  text-decoration: none;
  background: var(--danger-lt); color: var(--danger);
  border: 1px solid rgba(220,38,38,.15);
  transition: all var(--t);
  white-space: nowrap;
}
.admin-alert-badge:hover { box-shadow: var(--shadow-sm); }
.admin-alert-badge--warning { background: var(--warning-lt); color: var(--warning); border-color: rgba(217,119,6,.15); }
.admin-alert-badge--info    { background: var(--info-lt); color: var(--info); border-color: rgba(2,132,199,.15); }

/* ── Stats grid ───────────────────────────────────────────── */
.admin-stats-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
  margin-bottom: 24px;
}
@media (max-width: 1100px) { .admin-stats-grid { grid-template-columns: repeat(2,1fr); } }
@media (max-width: 560px)  { .admin-stats-grid { grid-template-columns: 1fr; } }

.admin-stat-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-xl);
  padding: 20px 22px;
  display: flex; align-items: flex-start; gap: 14px;
  transition: box-shadow var(--t), transform var(--t);
  animation: fadeSlideUp .4s ease both;
}
.admin-stat-card:hover {
  box-shadow: var(--shadow-md);
  transform: translateY(-2px);
}
.admin-stat-card:nth-child(1) { animation-delay: .05s; }
.admin-stat-card:nth-child(2) { animation-delay: .10s; }
.admin-stat-card:nth-child(3) { animation-delay: .15s; }
.admin-stat-card:nth-child(4) { animation-delay: .20s; }

.admin-stat-icon {
  width: 46px; height: 46px;
  border-radius: var(--r-lg);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.admin-stat-icon--blue   { background: var(--blue-lt); color: var(--blue); }
.admin-stat-icon--green  { background: var(--green-lt); color: var(--green); }
.admin-stat-icon--purple { background: #ede9fe; color: #6d28d9; }
.admin-stat-icon--orange { background: var(--warning-lt); color: var(--warning); }
.admin-stat-icon svg { stroke-width: 1.8; }

.admin-stat-info { min-width: 0; }
.admin-stat-label {
  font-size: 11px; font-weight: 700;
  text-transform: uppercase; letter-spacing: .6px;
  color: var(--text-3); display: block; margin-bottom: 4px;
}
.admin-stat-value {
  display: block;
  font-size: 24px; font-weight: 800;
  color: var(--text); line-height: 1;
  letter-spacing: -.5px;
}
.admin-stat-sub {
  display: block;
  font-size: 11.5px; color: var(--text-3);
  margin-top: 5px;
}
.admin-stat-sub--warning { color: var(--warning); }

/* ── Cards ────────────────────────────────────────────────── */
.admin-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-xl);
  /*overflow: hidden;
  */animation: fadeSlideUp .4s ease .1s both;
  -webkit-animation: fadeSlideUp .4s ease .1s both;
}
.admin-card.vinculados {
  z-index: 99;
}
.admin-card-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 22px;
  border-bottom: 1px solid var(--border);
}
.admin-card-header h3 {
  font-size: 14px; font-weight: 700; color: var(--text);
}
.admin-card-hint { font-size: 11.5px; color: var(--text-3); }
.admin-card-body { padding: 18px 22px; }

/* ── Grid 2 cols ──────────────────────────────────────────── */
.admin-grid-2 {
  display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
}
@media (max-width: 900px) { .admin-grid-2 { grid-template-columns: 1fr; } }

/* ── Tabela ───────────────────────────────────────────────── */
.admin-table-wrap { overflow-x: auto; }
.admin-table {
  width: 100%; border-collapse: collapse;
  font-size: 13px;
}
.admin-table th {
  text-align: left;
  padding: 10px 18px;
  font-size: 11px; font-weight: 700;
  text-transform: uppercase; letter-spacing: .5px;
  color: var(--text-3);
  border-bottom: 1px solid var(--border);
  white-space: nowrap; background: var(--bg);
}
.admin-table td {
  padding: 13px 18px;
  border-bottom: 1px solid var(--border);
  color: var(--text);
  vertical-align: middle;
}
.admin-table tr:last-child td { border-bottom: none; }
.admin-table tbody tr {
  transition: background var(--t);
}
.admin-table tbody tr:hover td { background: var(--bg); }
.admin-table-empty {
  text-align: center; color: var(--text-3);
  padding: 40px !important; font-style: italic;
}
.admin-codigo {
  font-family: var(--font-mono);
  font-size: 12px;
  background: var(--surface2);
  padding: 2px 7px; border-radius: var(--r-sm);
}
.admin-date { color: var(--text-3); white-space: nowrap; font-size: 12.5px; }
.admin-empty { padding: 28px 22px; color: var(--text-3); font-size: 13px; }

/* ── Badges ───────────────────────────────────────────────── */
.admin-badge {
  display: inline-flex; align-items: center;
  padding: 3px 10px; border-radius: 99px;
  font-size: 11.5px; font-weight: 700;
  white-space: nowrap; letter-spacing: .2px;
}
.admin-badge--success { background: var(--success-lt); color: var(--success); }
.admin-badge--warning { background: var(--warning-lt); color: var(--warning); }
.admin-badge--danger  { background: var(--danger-lt);  color: var(--danger);  }
.admin-badge--info    { background: var(--info-lt);    color: var(--info);    }
.admin-badge--muted   { background: var(--muted-lt);   color: var(--text-2);  }

/* ── Botões ───────────────────────────────────────────────── */
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  gap: 7px; padding: 9px 18px;
  border-radius: var(--r-lg); border: 1.5px solid transparent;
  font-family: var(--font); font-size: 13.5px; font-weight: 700;
  cursor: pointer; transition: all var(--t);
  white-space: nowrap; text-decoration: none;
}
.btn:disabled { opacity: .5; cursor: not-allowed; }

.btn-primary {
  background: var(--grad-primary);
  color: #fff; border-color: transparent;
  box-shadow: 0 2px 10px rgba(37,99,235,.25);
}
.btn-primary:hover {
  box-shadow: 0 4px 18px rgba(37,99,235,.35);
  transform: translateY(-1px);
}
.btn-primary:active { transform: translateY(0); }

.btn-outline {
  background: var(--surface);
  color: var(--text);
  border-color: var(--border);
}
.btn-outline:hover {
  border-color: var(--blue); color: var(--blue);
  background: var(--blue-lt);
}

.btn-ghost {
  background: transparent;
  color: var(--text-2);
  border-color: transparent;
}
.btn-ghost:hover { background: var(--surface2); color: var(--text); }

.btn-danger {
  background: var(--danger-lt);
  color: var(--danger);
  border-color: transparent;
}
.btn-danger:hover { background: var(--danger); color: #fff; }

.btn-sm  { padding: 6px 12px; font-size: 12.5px; border-radius: var(--r-md); gap: 5px; }
.btn-xs  { padding: 4px 9px;  font-size: 11.5px; border-radius: var(--r-sm); gap: 4px; }
.btn-full { width: 100%; }

.btn-outline  { background: transparent; color: var(--c-primary); border-color: var(--c-primary); }
.btn-outline:hover:not(:disabled) { background: var(--c-primary-l); }
.btn-dark     { background: var(--dartk); color: #fff; }
.btn-cart     { background: var(--dartk); color: #fff; font-size: 13px; height: 40px; padding: 0 14px; }
.btn-cart:hover:not(:disabled) { background: var(--c-primary); }
.btn-soldout  { background: var(--c-border); color: var(--c-text-muted); font-size: 13px; height: 40px;
                padding: 0 14px; cursor: not-allowed; border-radius: var(--radius-md); font-weight: 600; border: none; }


/* ── Form controls ────────────────────────────────────────── */
.form-control {
  width: 100%; padding: 9px 13px;
  border: 1.5px solid var(--border);
  border-radius: var(--r-md);
  font-family: var(--font); font-size: 13.5px; color: var(--text);
  background: var(--surface);
  transition: border-color var(--t), box-shadow var(--t);
  outline: none;
}
.form-control:focus {
  border-color: var(--blue);
  box-shadow: 0 0 0 3px rgba(37,99,235,.1);
}
.form-control::placeholder { color: var(--text-3); }
/* .form-control--sm { padding: 7px 11px; font-size: 13px; width: 60px !important; } */
textarea.form-control { resize: vertical; min-height: 80px; }
select.form-control { cursor: pointer; }

.form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
.form-group:last-child { margin-bottom: 0; }
.form-group label {
  font-size: 12.5px; font-weight: 700; color: var(--text-2);
}
.required { color: var(--danger); }
.field-hint { font-size: 11.5px; color: var(--text-3); }
.field-error { font-size: 12px; color: var(--danger); }

/* ── Toggle switch ────────────────────────────────────────── */
.admin-toggle { background: none; border: none; cursor: pointer; padding: 0; }
.admin-toggle-track {
  display: block; width: 38px; height: 22px;
  border-radius: 11px; background: var(--border2);
  position: relative; transition: background var(--t);
}
.admin-toggle--on .admin-toggle-track {
  background: var(--blue);
}
.admin-toggle-thumb {
  position: absolute; top: 3px; left: 3px;
  width: 16px; height: 16px; border-radius: 50%;
  background: #fff;
  transition: left var(--t);
  box-shadow: 0 1px 4px rgba(0,0,0,.2);
}
.admin-toggle--on .admin-toggle-thumb { left: 19px; }

/* ── Checkbox ─────────────────────────────────────────────── */
.admin-check-label {
  display: flex; align-items: center; gap: 10px;
  cursor: pointer; font-size: 13.5px; font-weight: 500; color: var(--text);
  user-select: none;
}
.admin-check-label input { display: none; }
.admin-check-custom {
  width: 18px; height: 18px; border-radius: 5px; flex-shrink: 0;
  border: 1.5px solid var(--border2); background: var(--surface);
  display: flex; align-items: center; justify-content: center;
  transition: all var(--t);
}
.admin-check-label input:checked + .admin-check-custom {
  background: var(--blue); border-color: var(--blue);
}
.admin-check-label input:checked + .admin-check-custom::after {
  content: '';
  width: 5px; height: 9px;
  border: 2px solid #fff; border-top: none; border-left: none;
  transform: rotate(45deg) translateY(-1px);
  display: block;
}

/* ── Top produtos ─────────────────────────────────────────── */
.admin-top-list  { padding: 6px 0; }
.admin-top-item  {
  display: flex; align-items: center; gap: 12px;
  padding: 11px 22px; transition: background var(--t);
}
.admin-top-item:hover { background: var(--bg); }
.admin-top-rank  {
  width: 24px; height: 24px; border-radius: 50%;
  background: var(--surface2); border: 1px solid var(--border);
  font-size: 11px; font-weight: 800; color: var(--text-3);
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.admin-top-item:first-child .admin-top-rank {
  background: var(--warning-lt); color: var(--warning); border-color: transparent;
}
.admin-top-info  { flex: 1; min-width: 0; }
.admin-top-nome  {
  display: block; font-size: 13px; font-weight: 600; color: var(--text);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.admin-top-meta  { font-size: 11.5px; color: var(--text-3); }
.admin-top-receita {
  font-size: 13px; font-weight: 800; color: var(--text); flex-shrink: 0;
  font-variant-numeric: tabular-nums;
}

/* ── Categorias ───────────────────────────────────────────── */
.cat-row--child { background: rgba(248,250,252,.6); }
.cat-row--child:hover td { background: var(--bg) !important; }
.cat-depth-1 td:first-child { border-left: 3px solid var(--blue-lt); }
.cat-depth-2 td:first-child { border-left: 3px solid var(--green-lt); }

.cat-nome-wrap {
  display: flex; align-items: center; gap: 10px;
}
.cat-indent-icon { color: var(--text-3); font-size: 13px; flex-shrink: 0; }

.cat-thumb {
  width: 32px; height: 32px; object-fit: cover;
  border-radius: var(--r-md); flex-shrink: 0;
  border: 1px solid var(--border);
}
.cat-thumb-placeholder {
  width: 32px; height: 32px; border-radius: var(--r-md); flex-shrink: 0;
  background: var(--surface2); border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  color: var(--text-3);
}
.cat-nome  { display: block; font-size: 13.5px; font-weight: 700; color: var(--text); }
.cat-slug  {
  display: block; font-size: 11.5px; color: var(--text-3);
  font-family: var(--font-mono);
}
.cat-td-drag { width: 36px; text-align: center; }
.admin-drag-handle {
  cursor: grab; color: var(--text-3); display: inline-flex;
  padding: 5px; border-radius: var(--r-sm);
  transition: all var(--t);
}
.admin-drag-handle:hover { color: var(--text-2); background: var(--surface2); }
.admin-drag-handle:active { cursor: grabbing; }

.admin-ordem-val { font-size: 12px; color: var(--text-3); }
.text-center     { text-align: center; }
.admin-muted     { color: var(--text-3); font-size: 12.5px; }
.admin-row-actions { display: flex; gap: 4px; align-items: center; }

/* Search na tabela */
.admin-search-wrap {
  display: flex; align-items: center; gap: 8px; flex: 1;
  max-width: 320px;
}
.admin-search-wrap svg { stroke: var(--text-3); flex-shrink: 0; }
.admin-search-input {
  border: none; outline: none; font-size: 13px; font-family: var(--font);
  color: var(--text); background: transparent; flex: 1;
}
.admin-search-input::placeholder { color: var(--text-3); }

/* ── Formulário admin ─────────────────────────────────────── */
.admin-form-grid {
  display: grid;
  grid-template-columns: 1fr 300px;
  gap: 20px;
  align-items: flex-start;
}
@media (max-width: 960px) { .admin-form-grid { grid-template-columns: 1fr; } }

.admin-form-actions {
  display: flex; flex-direction: column; gap: 8px; margin-top: 16px;
}

/* Input com prefixo */
.input-with-prefix {
  display: flex; align-items: stretch;
  border: 1.5px solid var(--border); border-radius: var(--r-md);
  overflow: hidden; transition: border-color var(--t), box-shadow var(--t);
}
.input-with-prefix:focus-within {
  border-color: var(--blue);
  box-shadow: 0 0 0 3px rgba(37,99,235,.1);
}
.input-prefix {
  padding: 0 11px; background: var(--bg);
  font-size: 14px; color: var(--text-3);
  border-right: 1px solid var(--border);
  display: flex; align-items: center; flex-shrink: 0;
}
.input-with-prefix .form-control {
  border: none !important; border-radius: 0 !important;
  box-shadow: none !important; flex: 1;
}

/* Upload */
.admin-upload-area {
  border: 2px dashed var(--border2);
  border-radius: var(--r-lg);
  padding: 28px 16px;
  text-align: center; cursor: pointer;
  transition: all var(--t);
  color: var(--text-3);
  background: var(--bg);
}
.admin-upload-area:hover,
.admin-upload-area.upload-area--over {
  border-color: var(--blue);
  background: var(--blue-lt);
  color: var(--blue);
}
.admin-upload-area p   { font-size: 13px; font-weight: 600; margin: 8px 0 3px; }
.admin-upload-area small { font-size: 11.5px; }
.upload-input-hidden   { display: none; }

.admin-img-preview  { margin-bottom: 12px; }
.admin-img-remove {
  display: block; width: 100%; margin-top: 8px; padding: 7px;
  background: none; border: 1px solid var(--border);
  border-radius: var(--r-md); font-family: var(--font);
  font-size: 12.5px; color: var(--danger); cursor: pointer;
  transition: all var(--t);
}
.admin-img-remove:hover { background: var(--danger); color: #fff; }

/* Breadcrumb */
.admin-breadcrumb {
  display: flex; align-items: center; gap: 6px;
  font-size: 12.5px; color: var(--text-3); margin-top: 5px;
}
.admin-breadcrumb a { color: var(--blue); }
.admin-breadcrumb a:hover { text-decoration: underline; }

/* Empty state */
.admin-empty-state {
  text-align: center; padding: 64px 32px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r-2xl);
  color: var(--text-3);
}
.admin-empty-state svg  { margin-bottom: 16px; color: var(--border2); }
.admin-empty-state p    { margin-bottom: 20px; font-size: 15px; font-weight: 500; }

/* ── Benefícios admin ─────────────────────────────────────── */
.benefit-admin-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }

.benefit-admin-item {
  display: flex; align-items: center; gap: 14px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-xl);
  padding: 14px 18px;
  transition: box-shadow var(--t), border-color var(--t), opacity var(--t);
}
.benefit-admin-item.dragging {
  opacity: .5; border-color: var(--blue); border-style: dashed;
  box-shadow: var(--shadow-lg);
}
.benefit-admin-item:hover { border-color: var(--border2); box-shadow: var(--shadow-xs); }

.benefit-admin-drag {
  cursor: grab; color: var(--text-3); flex-shrink: 0;
  padding: 5px; border-radius: var(--r-sm); transition: all var(--t);
}
.benefit-admin-drag:hover { color: var(--text-2); background: var(--surface2); }
.benefit-admin-drag:active { cursor: grabbing; }

.benefit-admin-icon-pick {
  display: flex; flex-direction: column; align-items: center;
  gap: 6px; flex-shrink: 0; width: 60px;
}
.benefit-icon-preview {
  width: 42px; height: 42px; border-radius: var(--r-lg);
  background: var(--blue-lt); color: var(--blue);
  display: flex; align-items: center; justify-content: center;
}
.benefit-icon-select {
  width: 60px; font-size: 11px; padding: 3px 5px;
  border-radius: var(--r-sm); border: 1px solid var(--border);
}

.benefit-admin-fields { flex: 1; min-width: 0; }
.benefit-admin-row {
  display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
  margin-bottom: 10px;
}
.benefit-admin-row:last-child { margin-bottom: 0; }
.benefit-admin-row .form-group { margin-bottom: 0; }
.benefit-admin-row label { font-size: 11.5px; font-weight: 700; color: var(--text-3); }

.benefit-admin-actions {
  display: flex; flex-direction: column;
  align-items: center; gap: 8px; flex-shrink: 0;
}
.benefit-admin-del {
  background: none; border: none; cursor: pointer;
  padding: 6px; color: var(--text-3); border-radius: var(--r-sm);
  display: flex; transition: all var(--t);
}
.benefit-admin-del:hover { color: var(--danger); background: var(--danger-lt); }

.benefit-admin-add {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%; padding: 12px;
  border-radius: var(--r-xl); border: 2px dashed var(--border);
  background: none; cursor: pointer; font-family: var(--font);
  font-size: 13.5px; font-weight: 600; color: var(--text-3);
  transition: all var(--t); margin-bottom: 20px;
}
.benefit-admin-add:hover {
  border-color: var(--blue); color: var(--blue); background: var(--blue-lt);
}

.benefit-admin-footer {
  display: flex; align-items: center; gap: 14px;
  padding-top: 16px; border-top: 1px solid var(--border);
}
.benefit-admin-feedback { font-size: 13px; }
.benefit-admin-feedback.fb-ok   { color: var(--success); }
.benefit-admin-feedback.fb-erro { color: var(--danger); }

/* ── Animações de entrada ─────────────────────────────────── */
.admin-page > * {
  animation: fadeSlideUp .35s ease both;
}
.admin-page > *:nth-child(1) { animation-delay: .0s; }
.admin-page > *:nth-child(2) { animation-delay: .05s; }
.admin-page > *:nth-child(3) { animation-delay: .10s; }
.admin-page > *:nth-child(4) { animation-delay: .15s; }
.admin-page > *:nth-child(5) { animation-delay: .20s; }

/* Scroll observer para cards */
.observe-animate {
  opacity: 0; transform: translateY(16px);
  transition: opacity .5s ease, transform .5s ease;
}
.observe-animate.visible {
  opacity: 1; transform: translateY(0);
}

/* ── Responsividade mobile ────────────────────────────────── */
@media (max-width: 768px) {
  .admin-sidebar { transform: translateX(-100%); transition: transform var(--t); }
  .admin-sidebar.open { transform: translateX(0); }
  .admin-main { margin-left: 0; }
  .admin-content { padding: 20px 16px; }
  .admin-topbar { padding: 0 16px; }
  .admin-page-header { flex-direction: column; align-items: flex-start; }
  .benefit-admin-row { grid-template-columns: 1fr; }
  .admin-form-grid   { grid-template-columns: 1fr; }
}

/* ── Utilitários ──────────────────────────────────────────── */
.text-gradient {
  background: var(--grad-primary);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.admin-divider { height: 1px; background: var(--border); margin: 16px 0; }
.admin-page    { max-width: 1200px; }


/* ── Toast container ──────────────────────────────────────── */
#admin-toast-container {
  position: fixed;
  bottom: 24px;
  right: 24px;
  z-index: 9999;
  display: flex;
  flex-direction: column;
  gap: 10px;
  pointer-events: none;
  max-width: 360px;
  width: calc(100vw - 48px);
}

/* ── Toast ────────────────────────────────────────────────── */
.admin-toast {
  pointer-events: all;
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 14px 16px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-xl);
  box-shadow: var(--shadow-lg);
  position: relative;
  overflow: hidden;

  /* Entrada: começa fora da tela */
  opacity: 0;
  transform: translateY(16px) scale(.97);
  transition:
    opacity    .3s cubic-bezier(.4,0,.2,1),
    transform  .3s cubic-bezier(.4,0,.2,1);
}

.admin-toast.visible {
  opacity: 1;
  transform: translateY(0) scale(1);
}

.admin-toast.hiding {
  opacity: 0;
  transform: translateY(8px) scale(.96);
  transition-duration: .25s;
}

/* Borda lateral colorida por tipo */
.admin-toast::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3px;
  border-radius: 3px 0 0 3px;
}
.admin-toast--success::before { background: var(--green); }
.admin-toast--error::before   { background: var(--danger); }
.admin-toast--warning::before { background: var(--warning); }
.admin-toast--info::before    { background: var(--blue); }

/* Ícone */
.admin-toast-icon {
  width: 32px; height: 32px;
  border-radius: var(--r-md);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.admin-toast--success .admin-toast-icon { background: var(--success-lt); color: var(--success); }
.admin-toast--error   .admin-toast-icon { background: var(--danger-lt);  color: var(--danger);  }
.admin-toast--warning .admin-toast-icon { background: var(--warning-lt); color: var(--warning); }
.admin-toast--info    .admin-toast-icon { background: var(--info-lt);    color: var(--info);    }

/* Corpo */
.admin-toast-body {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.admin-toast-label {
  font-size: 11px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: .6px;
  color: var(--text-3);
}
.admin-toast-msg {
  font-size: 13.5px;
  font-weight: 600;
  color: var(--text);
  line-height: 1.4;
}
.admin-toast-action {
  display: inline-flex;
  align-items: center;
  margin-top: 6px;
  font-size: 12.5px;
  font-weight: 700;
  color: var(--blue);
  text-decoration: none;
}
.admin-toast-action:hover { text-decoration: underline; }

/* Botão fechar */
.admin-toast-close {
  background: none;
  border: none;
  cursor: pointer;
  padding: 4px;
  border-radius: var(--r-sm);
  color: var(--text-3);
  display: flex;
  flex-shrink: 0;
  transition: all var(--t);
  margin-top: -2px;
}
.admin-toast-close:hover {
  background: var(--surface2);
  color: var(--text);
}

/* Barra de progresso */
.admin-toast-progress {
  position: absolute;
  bottom: 0; left: 0;
  height: 3px;
  width: 100%;
  border-radius: 0 0 var(--r-xl) var(--r-xl);
  transition: width linear;
}
.admin-toast--success .admin-toast-progress { background: var(--green); }
.admin-toast--error   .admin-toast-progress { background: var(--danger); }
.admin-toast--warning .admin-toast-progress { background: var(--warning); }
.admin-toast--info    .admin-toast-progress { background: var(--blue); }

/* Mobile */
@media (max-width: 480px) {
  #admin-toast-container {
    bottom: 16px;
    right: 16px;
    left: 16px;
    width: auto;
    max-width: none;
  }
}


/* Logo thumb na listagem */
.marca-logo-thumb {
  width: 44px; height: 44px; object-fit: contain;
  border-radius: var(--r-md);
  border: 1px solid var(--border);
  background: var(--surface2); padding: 4px;
}
.marca-logo-placeholder {
  width: 44px; height: 44px; border-radius: var(--r-md);
  background: var(--grad-primary-soft);
  border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 800;
  color: var(--blue); text-transform: uppercase;
}

/* ── Color picker ────────────────────────────────────────── */
.color-picker-wrap {
  display: flex; align-items: center; gap: 8px;
}
.color-picker-input {
  width: 40px; height: 38px;
  border: 1.5px solid var(--border);
  border-radius: var(--r-md);
  padding: 3px; cursor: pointer;
  background: var(--surface);
  flex-shrink: 0;
}
.color-picker-input::-webkit-color-swatch-wrapper { padding: 0; }
.color-picker-input::-webkit-color-swatch { border: none; border-radius: 6px; }

.color-picker-hex {
  flex: 1;
  font-family: var(--font-mono);
  font-size: 13px;
  text-transform: uppercase;
}
.color-picker-clear {
  background: none; border: 1.5px solid var(--border);
  border-radius: var(--r-md); width: 36px; height: 36px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; color: var(--text-3); flex-shrink: 0;
  transition: all var(--t);
}
.color-picker-clear:hover { border-color: var(--danger); color: var(--danger); }

.color-picker-preview {
  margin-top: 10px;
  width: 100%; height: 72px;
  border-radius: var(--r-lg);
  border: 1.5px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  transition: background-color .2s;
  overflow: hidden;
}

/* ═══════════════════════════════════════════════════════
   PRODUCT EDITOR — PE (Product Editor)
   ═══════════════════════════════════════════════════════ */

/* ── Layout ───────────────────────────────────────────── */
.pe-layout {
  display: grid;
  grid-template-columns: 1fr 280px;
  min-height: 100vh;
  background: var(--bg);
  margin: -28px -32px;
}

/* ── Nav lateral ──────────────────────────────────────── */
.pe-nav {
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  padding: 0;
  margin: 14px;
  border-radius: 9px;
  -webkit-border-radius: 9px;
  -moz-border-radius: 9px;
  -ms-border-radius: 9px;
  -o-border-radius: 9px;
}
.pe-nav .btn-salvar-produto { width: calc(100% - 20px); margin-left: 10px; margin-bottom: 10px;}
.pe-nav::-webkit-scrollbar { width: 3px; }
.pe-nav::-webkit-scrollbar-thumb { background: var(--border2); }

.pe-nav-logo {
  padding: 16px;
  border-bottom: 1px solid var(--border);
}
.pe-nav-back {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 12.5px; font-weight: 700; color: var(--text-2);
  text-decoration: none; transition: color var(--t);
}
.pe-nav-back:hover { color: var(--blue); }

.pe-nav-list {
  list-style: none; padding: 10px 8px; flex: 1;
}
.pe-nav-item {
  display: flex; align-items: center; gap: 9px;
  padding: 9px 10px; border-radius: var(--r-md);
  font-size: 13px; font-weight: 500; color: var(--text-2);
  text-decoration: none; cursor: pointer; transition: all var(--t);
  margin-bottom: 2px;
}
.pe-nav-item:hover { background: var(--surface2); color: var(--text); }
.pe-nav-item.active {
  background: var(--grad-primary-soft);
  color: var(--blue); font-weight: 700;
}
.pe-nav-item.active::before {
  content: '';
  position: absolute; left: 0; top: 50%;
  transform: translateY(-50%);
  width: 3px; height: 16px;
  background: var(--grad-primary);
  border-radius: 0 3px 3px 0;
}
.pe-nav-item { position: relative; }
.pe-nav-icon {
  width: 28px; height: 28px; border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; color: var(--text-3); transition: all var(--t);
}
.pe-nav-item.active .pe-nav-icon { color: var(--blue); }

.pe-nav-status {
  padding: 14px 16px;
  border-top: 1px solid var(--border);
}
.pe-nav-status-label {
  font-size: 10px; font-weight: 700; text-transform: uppercase;
  letter-spacing: .6px; color: var(--text-3); display: block; margin-bottom: 8px;
}
.pe-status-toggle {
  display: flex; align-items: center; gap: 10px;
  font-size: 13px; font-weight: 600; color: var(--text-2);
}

/* ── Main ─────────────────────────────────────────────── */
.pe-main {
  display: flex; flex-direction: column;
  min-height: 100vh; align-items: center;
}

/* ── Topbar ───────────────────────────────────────────── */
.pe-topbar {
  position: sticky; top: 0; z-index: 100;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 28px; gap: 16px;
  border-bottom-left-radius: 9px;
  border-bottom-right-radius: 9px;
}
.pe-topbar.scrolled {
  box-shadow: 0 2px 12px rgba(0,0,0,.06);
}
.pe-breadcrumb {
  display: flex; align-items: center; gap: 7px;
  font-size: 13px; color: var(--text-3);
}
.pe-breadcrumb a { color: var(--blue); text-decoration: none; }
.pe-breadcrumb a:hover { text-decoration: underline; }
.pe-topbar-actions { display: flex; align-items: center; gap: 8px; }

/* ── Sections ─────────────────────────────────────────── */
.pe-sections { padding: 28px 28px 80px; max-width: 900px; }

.pe-section { margin-bottom: 48px; scroll-margin-top: 80px; }

.pe-section-head {
  margin-bottom: 16px;
}
.pe-section-head h2 {
  font-size: 17px; font-weight: 800; color: var(--text);
  letter-spacing: -.3px; margin-bottom: 3px;
}
.pe-section-head p { font-size: 13px; color: var(--text-3); }

/* Campo com erro de validação */
.input-error {
  border-color: var(--danger) !important;
  box-shadow: 0 0 0 3px rgba(220,38,38,.12) !important;
  animation: errorShake .3s ease;
}
@keyframes errorShake {
  0%,100% { transform: translateX(0); }
  25%      { transform: translateX(-4px); }
  75%      { transform: translateX(4px); }
}

/* ── Card ─────────────────────────────────────────────── */
.pe-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-xl);
  padding: 20px 22px;
}

.pe-card-title {
  font-size: 13px; font-weight: 800;
  text-transform: uppercase; letter-spacing: .5px;
  color: var(--text-3); margin-bottom: 16px;
}
.pe-card-title--danger { color: var(--danger); }
.pe-card-title-row {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 16px;
}
.pe-card-hint { font-size: 12px; color: var(--text-3); }

/* ── Labels & inputs ──────────────────────────────────── */
.pe-label {
  font-size: 12.5px; font-weight: 700; color: var(--text-2);
}
.pe-required { color: var(--danger); }
.pe-field-hint {
  font-size: 11.5px; color: var(--text-3); margin-top: 2px; margin-bottom: 8px;
}
.pe-char-count { font-size: 11.5px; color: var(--text-3); }

.pe-input-lg { font-size: 17px; font-weight: 700; padding: 12px 14px; }
.pe-textarea-rich { font-family: var(--font-mono); font-size: 13px; }

/* Prefix input (slug) */
.pe-input-prefix-wrap {
  display: flex; align-items: stretch;
  border: 1.5px solid var(--border); border-radius: var(--r-md);
  overflow: hidden; transition: border-color var(--t), box-shadow var(--t);
}
.pe-input-prefix-wrap:focus-within {
  border-color: var(--blue);
  box-shadow: 0 0 0 3px rgba(37,99,235,.1);
}
.pe-input-prefix {
  padding: 0 11px; background: var(--bg);
  font-size: 13px; font-family: var(--font-mono);
  color: var(--text-3); border-right: 1px solid var(--border);
  display: flex; align-items: center; flex-shrink: 0;
}
.pe-input-prefix-wrap .form-control {
  border: none !important; box-shadow: none !important;
  border-radius: 0 !important; flex: 1;
  font-family: var(--font-mono); font-size: 13px;
}
.pe-slug-regen {
  background: var(--bg); border: none; border-left: 1px solid var(--border);
  padding: 0 12px; cursor: pointer; color: var(--text-3);
  display: flex; align-items: center; transition: all var(--t);
}
.pe-slug-regen:hover { color: var(--blue); background: var(--blue-lt); }

/* ── Grids ────────────────────────────────────────────── */
.pe-grid-2 {
  display: grid; grid-template-columns: 1fr 1fr; gap: 14px;
}
.pe-grid-3 {
  display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px;
}
@media (max-width: 700px) {
  .pe-grid-2, .pe-grid-3 { grid-template-columns: 1fr; }
}

/* ── Preço ────────────────────────────────────────────── */
.pe-price-input-wrap {
  display: flex; align-items: stretch;
  border: 1.5px solid var(--border); border-radius: var(--r-md);
  overflow: hidden; transition: border-color var(--t);
}
.pe-price-input-wrap:focus-within {
  border-color: var(--blue);
  box-shadow: 0 0 0 3px rgba(37,99,235,.1);
}
.pe-price-prefix {
  padding: 0 10px; background: var(--bg); font-weight: 700;
  font-size: 13px; color: var(--text-3);
  border-right: 1px solid var(--border);
  display: flex; align-items: center;
}
.pe-price-input {
  border: none !important; box-shadow: none !important;
  border-radius: 0 !important; flex: 1;
  font-size: 15px; font-weight: 700; color: var(--text);
}

.pe-discount-badge {
  display: flex; align-items: center; justify-content: center;
  height: 44px; border-radius: var(--r-md);
  background: var(--success-lt); color: var(--success);
  font-size: 18px; font-weight: 900; border: 1px solid var(--success-lt);
  min-width: 80px;
}

.pe-promo-periodo {
  background: var(--bg); border-radius: var(--r-md);
  padding: 14px; margin-top: 8px;
  border: 1px dashed var(--border2);
}

/* ── Estoque ──────────────────────────────────────────── */
.pe-estoque-wrap {
  display: flex; align-items: center;
  border: 1.5px solid var(--border); border-radius: var(--r-md);
  overflow: hidden;
}
.pe-estoque-btn {
  width: 40px; height: 44px; background: var(--bg);
  border: none; font-size: 18px; font-weight: 700;
  cursor: pointer; color: var(--text-2);
  transition: all var(--t); flex-shrink: 0;
}
.pe-estoque-btn:hover { background: var(--blue-lt); color: var(--blue); }
.pe-estoque-input {
  border: none !important; text-align: center;
  font-size: 16px; font-weight: 800; flex: 1;
  border-left: 1px solid var(--border) !important;
  border-right: 1px solid var(--border) !important;
  border-radius: 0 !important; box-shadow: none !important;
}
.pe-estoque-status {
  display: flex; align-items: center; gap: 8px;
  height: 44px; font-size: 13.5px; font-weight: 700; color: var(--text-2);
}
.pe-estoque-indicator {
  width: 10px; height: 10px; border-radius: 50%;
  background: var(--text-3); flex-shrink: 0;
  transition: background .3s;
}
.pe-estoque-indicator.ok      { background: var(--success); }
.pe-estoque-indicator.baixo   { background: var(--warning); }
.pe-estoque-indicator.zerado  { background: var(--danger); }

/* ── Upload de imagem ─────────────────────────────────── */
.pe-midia-alert {
  display: flex; align-items: center; gap: 8px;
  padding: 14px; background: var(--blue-lt);
  border-radius: var(--r-md); font-size: 13.5px;
  color: var(--blue); font-weight: 600;
}

.pe-upload-area {
  border: 2px dashed var(--border2); border-radius: var(--r-xl);
  padding: 32px 24px; text-align: center; cursor: pointer;
  transition: all var(--t); background: var(--bg);
  margin-bottom: 16px;
}
.pe-upload-area:hover, .pe-upload-area.drag-over {
  border-color: var(--blue); background: var(--blue-lt);
}
.pe-upload-hidden { display: none; }
.pe-upload-icon {
  width: 56px; height: 56px; border-radius: var(--r-xl);
  background: var(--surface2); border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 12px; color: var(--text-3);
}
.pe-upload-title { font-size: 14px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
.pe-upload-hint  { font-size: 12px; color: var(--text-3); margin-bottom: 12px; }

/* Galeria */
.pe-gallery {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
  gap: 10px; margin-top: 8px;
}
.pe-gallery-item {
  position: relative; aspect-ratio: 1;
  border-radius: var(--r-lg); overflow: hidden;
  border: 2px solid var(--border);
  cursor: grab; transition: border-color var(--t);
}
.pe-gallery-item.is-principal { border-color: var(--blue); }
.pe-gallery-item img {
  width: 100%; height: 100%; object-fit: cover;
}
.pe-gallery-overlay {
  position: absolute; inset: 0;
  background: rgba(0,0,0,.5);
  opacity: 0; transition: opacity .2s;
  display: flex; align-items: center; justify-content: center; gap: 6px;
}
.pe-gallery-item:hover .pe-gallery-overlay { opacity: 1; }
.pe-gallery-btn {
  width: 32px; height: 32px; border-radius: 50%;
  border: none; cursor: pointer;
  background: rgba(255,255,255,.9); color: var(--text);
  display: flex; align-items: center; justify-content: center;
  transition: all .15s;
}
.pe-gallery-btn:hover { background: #fff; transform: scale(1.1); }
.pe-gallery-btn--del:hover { color: var(--danger); }
.pe-gallery-badge {
  position: absolute; bottom: 6px; left: 50%; transform: translateX(-50%);
  background: var(--blue); color: #fff;
  font-size: 10px; font-weight: 800; padding: 2px 8px;
  border-radius: 99px; white-space: nowrap;
}
.pe-gallery-item.uploading { opacity: .6; }
.pe-gallery-skeleton {
  aspect-ratio: 1; border-radius: var(--r-lg);
  background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%);
  background-size: 200% 100%;
  animation: shimmer 1.2s infinite;
}

/* ── Variações ────────────────────────────────────────── */
.pe-toggle-label {
  display: flex; align-items: flex-start; gap: 14px; cursor: pointer;
}
.pe-toggle-switch { flex-shrink: 0; padding-top: 2px; }
.pe-toggle-track {
  display: block; width: 42px; height: 24px; border-radius: 12px;
  background: var(--border2); position: relative; transition: background var(--t);
  cursor: pointer;
}
input:checked + .pe-toggle-track { background: var(--blue); }
.pe-toggle-thumb-inner {
  position: absolute; top: 3px; left: 3px;
  width: 18px; height: 18px; border-radius: 50%;
  background: #fff; transition: left var(--t);
  box-shadow: 0 1px 4px rgba(0,0,0,.2);
}
input:checked + .pe-toggle-track .pe-toggle-thumb-inner { left: 21px; }
.pe-toggle-switch input { display: none; }
.pe-toggle-title { display: block; font-size: 14px; font-weight: 700; color: var(--text); }
.pe-toggle-desc  { display: block; font-size: 12.5px; color: var(--text-3); margin-top: 3px; }

.pe-attr-row {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 0; border-bottom: 1px solid var(--border);
}
.pe-attr-row:last-child { border-bottom: none; }
.pe-attr-tipo { width: 140px; flex-shrink: 0; }
.pe-attr-tipo span { font-size: 13px; font-weight: 700; color: var(--text); display: block; }
.pe-attr-display-type {
  font-size: 10.5px; color: var(--text-3); font-family: var(--font-mono);
}
.pe-attr-valor { flex: 1; display: flex; gap: 8px; align-items: center; }
.pe-attr-del {
  background: none; border: none; cursor: pointer; font-size: 18px;
  color: var(--text-3); padding: 0 4px; line-height: 1;
  transition: color var(--t);
}
.pe-attr-del:hover { color: var(--danger); }

.pe-color-swatch-input {
  width: 32px; height: 32px; border-radius: 6px; border: 1.5px solid var(--border);
  padding: 2px; cursor: pointer; flex-shrink: 0;
}
.pe-color-swatch-input-lg {
  width: 44px; height: 44px; border-radius: var(--r-md);
  border: 1.5px solid var(--border); padding: 3px; cursor: pointer;
}

.pe-add-btn {
  display: flex; align-items: center; gap: 6px;
  background: none; border: none; cursor: pointer;
  font-family: var(--font); font-size: 13px;
  font-weight: 700; color: var(--blue); padding: 10px 0 0;
  transition: opacity .2s;
}
.pe-add-btn:hover { opacity: .75; }

/* SKUs table */
.pe-skus-table-wrap { overflow-x: auto; margin: 0 -2px; }
.pe-skus-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.pe-skus-table th {
  text-align: left; padding: 9px 12px;
  font-size: 11px; font-weight: 700; text-transform: uppercase;
  letter-spacing: .4px; color: var(--text-3);
  border-bottom: 1px solid var(--border); background: var(--bg);
}
.pe-skus-table td {
  padding: 10px 12px; border-bottom: 1px solid var(--border);
  vertical-align: middle;
}
.pe-skus-table tr:last-child td { border-bottom: none; }
.pe-skus-table tbody tr:hover td { background: var(--bg); }
.pe-sku-attrs { font-family: var(--font-mono); font-size: 11.5px; color: var(--text-3); }
.pe-skus-empty {
  padding: 24px; text-align: center;
  color: var(--text-3); font-size: 13px; font-style: italic;
}

/* Mini toggle (para tabela de SKUs) */
.pe-toggle-mini { cursor: pointer; }
.pe-toggle-mini input { display: none; }
.pe-toggle-mini-track {
  display: block; width: 32px; height: 18px; border-radius: 9px;
  background: var(--border2); position: relative; transition: background var(--t);
}
.pe-toggle-mini input:checked + .pe-toggle-mini-track { background: var(--blue); }
.pe-toggle-mini-track::after {
  content: ''; position: absolute; top: 2px; left: 2px;
  width: 14px; height: 14px; border-radius: 50%;
  background: #fff; transition: left var(--t);
  box-shadow: 0 1px 3px rgba(0,0,0,.2);
}
.pe-toggle-mini input:checked + .pe-toggle-mini-track::after { left: 16px; }

/* Quick toggle sidebar */
.pe-toggle-pill { cursor: pointer; }
.pe-toggle-pill input { display: none; }
.pe-toggle-thumb {
  display: block; width: 36px; height: 20px; border-radius: 10px;
  background: var(--border2); position: relative; transition: background var(--t);
}
.pe-toggle-pill input:checked + .pe-toggle-thumb { background: var(--blue); }
.pe-toggle-thumb::after {
  content: ''; position: absolute; top: 2px; left: 2px;
  width: 16px; height: 16px; border-radius: 50%;
  background: #fff; transition: left var(--t);
  box-shadow: 0 1px 3px rgba(0,0,0,.2);
}
.pe-toggle-pill input:checked + .pe-toggle-thumb::after { left: 18px; }

/* ── Frete ────────────────────────────────────────────── */
.pe-dimensoes-grid {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px;
}
@media (max-width: 700px) { .pe-dimensoes-grid { grid-template-columns: 1fr 1fr; } }
.pe-unit-input { display: flex; align-items: stretch; }
.pe-unit-input .form-control { border-radius: var(--r-md) 0 0 var(--r-md) !important; }
.pe-unit {
  padding: 0 12px; background: var(--bg); font-weight: 700;
  font-size: 12px; color: var(--text-3);
  border: 1.5px solid var(--border); border-left: none;
  border-radius: 0 var(--r-md) var(--r-md) 0;
  display: flex; align-items: center;
}
.pe-frete-preview {
  display: flex; align-items: center; gap: 8px;
  padding: 12px; background: var(--bg); border-radius: var(--r-md);
  margin-top: 14px; font-size: 13px; color: var(--text-3);
}

/* ── SEO ──────────────────────────────────────────────── */
.pe-seo-preview-card { background: var(--bg); border-color: var(--border); }
.pe-google-preview {
  background: var(--surface); border-radius: var(--r-md);
  padding: 16px 18px; border: 1px solid var(--border);
}
.pe-google-url {
  font-size: 12px; color: #1a6c37; margin-bottom: 3px;
  font-family: var(--font-mono);
}
.pe-google-title {
  font-size: 18px; color: #1a0dab; font-weight: 500;
  margin-bottom: 4px; cursor: pointer;
}
.pe-google-title:hover { text-decoration: underline; }
.pe-google-desc { font-size: 13.5px; color: #4d5156; line-height: 1.6; }

.pe-seo-bar-wrap {
  display: flex; align-items: center; gap: 10px; margin-top: 6px;
}
.pe-seo-bar {
  flex: 1; height: 4px; border-radius: 2px;
  background: var(--border); overflow: hidden; position: relative;
}
.pe-seo-bar::after {
  content: ''; position: absolute; left: 0; top: 0; bottom: 0;
  width: var(--pct, 0%); border-radius: 2px;
  background: var(--success); transition: width .3s, background .3s;
}
.pe-seo-bar.warn::after  { background: var(--warning); }
.pe-seo-bar.over::after  { background: var(--danger); }
.pe-seo-count { font-size: 11.5px; color: var(--text-3); white-space: nowrap; }

/* ── Config ───────────────────────────────────────────── */
.pe-divider { height: 1px; background: var(--border); margin: 14px 0; }

.pe-audit-card { background: var(--bg); }
.pe-audit-grid {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px;
}
@media (max-width: 700px) { .pe-audit-grid { grid-template-columns: 1fr 1fr; } }
.pe-audit-label { display: block; font-size: 11px; font-weight: 700; color: var(--text-3); text-transform: uppercase; letter-spacing: .4px; margin-bottom: 4px; }
.pe-audit-val   { font-size: 14px; font-weight: 700; color: var(--text); }

.pe-danger-zone { border-color: rgba(220,38,38,.2); }
.pe-danger-text { font-size: 13px; color: var(--text-3); margin-bottom: 14px; }

/* ── Modal ────────────────────────────────────────────── */
.pe-modal-backdrop {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.45); z-index: 1000;
  display: flex; align-items: center; justify-content: center;
}
.pe-modal {
  background: var(--surface); border-radius: var(--r-2xl);
  width: 100%; max-width: 440px; margin: 16px;
  box-shadow: var(--shadow-lg); overflow: hidden;
}
.pe-modal-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 20px; border-bottom: 1px solid var(--border);
}
.pe-modal-header h3 { font-size: 15px; font-weight: 800; color: var(--text); }
.pe-modal-close {
  background: none; border: none; cursor: pointer; font-size: 22px;
  color: var(--text-3); line-height: 1; width: 28px; height: 28px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 50%; transition: all var(--t);
}
.pe-modal-close:hover { background: var(--surface2); color: var(--text); }
.pe-modal-body   { padding: 20px; }
.pe-modal-footer {
  display: flex; gap: 8px; justify-content: flex-end;
  padding: 14px 20px; border-top: 1px solid var(--border);
}

/* ── Animação de entrada ──────────────────────────────── */
.pe-section {
  animation: fadeSlideUp .35s ease both;
}
.pe-section:nth-child(1) { animation-delay: .05s; }
.pe-section:nth-child(2) { animation-delay: .10s; }
.pe-section:nth-child(3) { animation-delay: .15s; }
.pe-section:nth-child(4) { animation-delay: .20s; }

/* ── Responsivo ───────────────────────────────────────── */
@media (max-width: 900px) {
  .pe-layout { grid-template-columns: 1fr; }
  .pe-nav { display: none; }
  .pe-sections { padding: 20px 16px 80px; }
  .pe-topbar { padding: 10px 16px; }
}

/* ── Atributos ───────────────────────────────────────────── */
.attr-papel-cards {
  display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px;
}
.attr-papel-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r-lg); padding: 14px 16px;
  display: flex; flex-direction: column; gap: 8px;
}
.attr-papel-card p { font-size: 12.5px; color: var(--text-3); }

.attr-display-pill {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 10px; border-radius: var(--r-sm);
  font-size: 12px; font-weight: 600;
  background: var(--surface2); color: var(--text-2);
}
.attr-swatch-demo {
  width: 10px; height: 10px; border-radius: 50%;
  background: linear-gradient(135deg, #ef4444, #3b82f6);
  flex-shrink: 0;
}

.attr-display-preview {
  margin-top: 12px; padding: 12px;
  background: var(--bg); border-radius: var(--r-md);
  border: 1px dashed var(--border2);
}
.attr-display-preview #attr-display-demo {
  display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 6px;
}
.attr-preview-btn {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 36px; height: 32px; padding: 0 10px;
  border: 1.5px solid var(--border2); border-radius: var(--r-md);
  font-size: 12.5px; font-weight: 700; color: var(--text-2);
  background: var(--surface);
}
.attr-preview-swatch {
  width: 28px; height: 28px; border-radius: 50%;
  border: 2px solid var(--border);
}

/* ── SKU cards (editor de produto) ──────────────────────── */
.pe-sku-card {
  background: var(--bg);
  border: 1.5px solid var(--border);
  border-radius: var(--r-xl);
  margin-bottom: 10px;
  overflow: hidden;
  transition: border-color var(--t);
}
.pe-sku-card:hover { border-color: var(--blue); }

.pe-sku-card-header {
  display: flex; align-items: flex-end; gap: 12px;
  padding: 16px 16px 12px; flex-wrap: wrap;
}
.pe-sku-card-code   { flex: 2; min-width: 140px; }
.pe-sku-card-preco  { flex: 1.5; min-width: 120px; }
.pe-sku-card-estoque{ flex: 1; min-width: 80px; }
.pe-sku-card-ativo  { min-width: 48px; }
.pe-sku-card-del {
  background: none; border: none; cursor: pointer;
  color: var(--text-3); padding: 8px; border-radius: var(--r-md);
  display: flex; align-items: center; margin-top: auto;
  transition: all var(--t); flex-shrink: 0;
}
.pe-sku-card-del:hover { color: var(--danger); background: var(--danger-lt); }

.pe-sku-attrs-section {
  padding: 12px 16px 14px;
  border-top: 1px solid var(--border);
  background: var(--surface);
}
.pe-sku-attrs-title {
  font-size: 10.5px; font-weight: 800; text-transform: uppercase;
  letter-spacing: .5px; color: var(--text-3); display: block; margin-bottom: 10px;
}
.pe-sku-attrs-list {
  display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-end;
}
.pe-sku-attr-item { display: flex; flex-direction: column; gap: 5px; }
.pe-sku-attr-nome {
  font-size: 11.5px; font-weight: 700; color: var(--text-2);
}

/* Estoque → SKU info */
.pe-estoque-variacao-aviso {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 11.5px; font-weight: 700;
  color: var(--blue); background: var(--blue-lt);
  padding: 3px 10px; border-radius: 99px;
}
.pe-estoque-sku-info {
  display: flex; align-items: flex-start; gap: 14px;
  padding: 16px; background: var(--blue-lt);
  border-radius: var(--r-lg); color: var(--blue); margin-top: 12px;
}
.pe-estoque-sku-info svg { flex-shrink: 0; margin-top: 2px; }
.pe-estoque-sku-info strong { display: block; font-size: 14px; font-weight: 800; margin-bottom: 4px; }
.pe-estoque-sku-info p { font-size: 13px; opacity: .85; }


/* admin/assets/css/admin.css */

/* ── Opções de atributo nos SKUs ─────────────────────────── */
.pe-sku-attr-opcoes {
  display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
}

/* Botão de texto */
.pe-sku-opt-btn {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 36px; height: 32px; padding: 0 10px;
  border: 1.5px solid var(--border2);
  border-radius: var(--r-md); background: var(--surface);
  font-family: var(--font); font-size: 12.5px; font-weight: 700;
  color: var(--text-2); cursor: pointer; transition: all var(--t);
}
.pe-sku-opt-btn:hover {
  border-color: var(--blue); color: var(--blue); background: var(--blue-lt);
}
.pe-sku-opt-btn.selected {
  border-color: var(--blue); background: var(--blue);
  color: #fff;
}

/* Swatch de cor */
.pe-sku-swatch-btn {
  width: 28px; height: 28px; border-radius: 50%;
  border: 2.5px solid var(--border);
  cursor: pointer; transition: all var(--t);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.pe-sku-swatch-btn:hover   { transform: scale(1.15); border-color: var(--text-2); }
.pe-sku-swatch-btn.selected {
  border-color: var(--text);
  box-shadow: 0 0 0 3px rgba(37,99,235,.25);
  transform: scale(1.1);
}

/* ── Valores de atributo (página de atributos) ───────────── */
.attr-valores-panel {
  background: var(--bg);
  border-top: 1px solid var(--border);
  padding: 16px 22px 20px;
}
.attr-valores-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 14px;
}
.attr-valores-title {
  font-size: 13px; font-weight: 700; color: var(--text-2);
}
.attr-valores-list {
  display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
}
.attr-valor-item {
  display: flex; align-items: center; gap: 8px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r-lg); padding: 6px 10px;
  transition: border-color var(--t);
}
.attr-valor-item:hover { border-color: var(--blue); }

.attr-valor-swatch {
  width: 18px; height: 18px; border-radius: 50%;
  border: 1.5px solid rgba(0,0,0,.12); flex-shrink: 0;
}
.attr-valor-preview-btn {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 28px; height: 24px; padding: 0 8px;
  border: 1px solid var(--border2); border-radius: 5px;
  font-size: 11.5px; font-weight: 700; color: var(--text-2);
  background: var(--bg); flex-shrink: 0;
}
.attr-valor-nome { font-size: 13px; font-weight: 600; color: var(--text); }
.attr-valor-hex  { font-family: var(--font-mono); font-size: 11px; color: var(--text-3); }
.attr-valor-actions { display: flex; gap: 4px; margin-left: 4px; }
.attr-valores-empty {
  font-size: 13px; color: var(--text-3); font-style: italic; padding: 8px 0;
}

/* ── SKU table inline ────────────────────────────────────── */
.pe-skus-table-wrap { overflow-x: auto; }

.pe-skus-table {
  width: 100%; border-collapse: collapse; font-size: 13px;
}
.pe-skus-table th {
  text-align: left; padding: 9px 10px;
  font-size: 10.5px; font-weight: 700; text-transform: uppercase;
  letter-spacing: .4px; color: var(--text-3);
  border-bottom: 1px solid var(--border); background: var(--bg);
  white-space: nowrap;
}
.pe-skus-table td {
  padding: 8px 10px; border-bottom: 1px solid var(--border);
  vertical-align: middle;
}
.pe-skus-table .pe-sku-row:last-child td { border-bottom: none; }
.pe-skus-table .pe-sku-row:hover td { background: var(--bg); }

.pe-sku-bling{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;flex-shrink:0;cursor:help}
.pe-sku-bling.is-sync{color:#16a34a;background:#f0fdf4}
.pe-sku-bling.is-nosync{color:#d97706;background:#fffbeb}

/* Botão remover SKU */
.pe-sku-del {
  background: none; border: none; cursor: pointer; padding: 5px;
  color: var(--text-3); border-radius: 6px; display: flex;
  transition: all var(--t);
}
.pe-sku-del:hover { color: var(--danger); background: var(--danger-lt); }

/* ── Badges de atributos na linha ───────────────────────── */
.pe-sku-attrs-badges {
  display: flex; flex-wrap: wrap; align-items: center; gap: 5px; min-height: 28px;
}

.pe-sku-badge {
  display: inline-flex; align-items: center; gap: 4px;
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 6px; padding: 3px 8px;
  font-size: 11.5px; white-space: nowrap;
}
.pe-sku-badge-swatch {
  width: 10px; height: 10px; border-radius: 50%;
  border: 1px solid rgba(0,0,0,.15); flex-shrink: 0;
}
.pe-sku-badge-label { color: var(--text-3); font-weight: 500; }
.pe-sku-badge-valor { color: var(--text);   font-weight: 700; }

/* Botão editar atributos */
.pe-sku-attrs-btn, .pe-ag-edit-btn {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 4px 9px; border-radius: 6px;
  border: 1.5px dashed var(--border2);
  background: none; cursor: pointer;
  font-family: var(--font); font-size: 11.5px;
  font-weight: 700; color: var(--text-3);
  transition: all var(--t); white-space: nowrap;
}
.pe-sku-attrs-btn:hover, .pe-ag-edit-btn:hover {
  border-color: var(--blue); color: var(--blue);
  background: var(--blue-lt);
}

/* ── Modal de atributos ──────────────────────────────────── */
.pe-modal--attrs { max-width: 520px; }

.modal-attr-grupo {
  margin-bottom: 18px; padding-bottom: 18px;
  border-bottom: 1px solid var(--border);
}
.modal-attr-grupo:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }

.modal-attr-label {
  font-size: 12px; font-weight: 800; text-transform: uppercase;
  letter-spacing: .5px; color: var(--text-3); margin-bottom: 10px;
}
.modal-attr-opcoes {
  display: flex; flex-wrap: wrap; gap: 7px; align-items: center;
}

/* Botão de opção no modal */
.pe-sku-opt-btn {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 38px; height: 34px; padding: 0 12px;
  border: 1.5px solid var(--border2); border-radius: var(--r-md);
  background: var(--surface); font-family: var(--font);
  font-size: 13px; font-weight: 700; color: var(--text-2);
  cursor: pointer; transition: all var(--t);
}
.pe-sku-opt-btn:hover {
  border-color: var(--blue); color: var(--blue); background: var(--blue-lt);
}
.pe-sku-opt-btn.selected {
  border-color: var(--blue); background: var(--blue); color: #fff;
}

/* Swatch no modal */
.pe-sku-swatch-btn {
  width: 32px; height: 32px; border-radius: 50%;
  border: 2.5px solid var(--border);
  cursor: pointer; transition: all var(--t);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.pe-sku-swatch-btn:hover   { transform: scale(1.12); border-color: var(--text-2); }
.pe-sku-swatch-btn.selected {
  border-color: var(--text);
  box-shadow: 0 0 0 3px rgba(37,99,235,.3);
  transform: scale(1.08);
}

/* ── Agrupador: wrap de valor com opções + input ─────────── */
.pe-attr-valor-wrap {
  display: flex; flex-wrap: wrap; align-items: center;
  gap: 6px; flex: 1;
}

.pe-ag-opcoes {
  display: flex; flex-wrap: wrap; gap: 5px; align-items: center;
}
.pe-ag-opcoes-modal {
  display: flex; flex-wrap: wrap; gap: 7px;
  align-items: center; margin-bottom: 12px;
}

/* Modal agrupador: grid de botões/swatches */
.modal-ag-opcoes-grid {
  display: flex; flex-wrap: wrap; gap: 7px;
  align-items: center; margin-bottom: 14px;
  padding: 12px; background: var(--bg);
  border-radius: var(--r-md);
  border: 1px solid var(--border);
  min-height: 48px;
}


/* ── Card de família ─────────────────────────────────────── */

/* Estado: sem família */
.pe-familia-vazia {
  display: flex; flex-direction: column;
  align-items: center; text-align: center; padding: 24px 16px; gap: 10px;
}
.pe-familia-vazia-icon {
  width: 56px; height: 56px; border-radius: var(--r-xl);
  background: var(--surface2); border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  color: var(--text-3);
}
.pe-familia-vazia-msg  {
  font-size: 14px; font-weight: 700; color: var(--text); margin: 0;
}
.pe-familia-vazia-hint {
  font-size: 12.5px; color: var(--text-3); max-width: 380px; line-height: 1.5; margin: 0;
}
.pe-familia-vazia-actions {
  display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 4px;
}

/* Estado: com família */
.pe-familia-info {
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
}
.pe-familia-icon {
  width: 44px; height: 44px; border-radius: var(--r-lg);
  background: var(--purple-lt, #ede9fe); color: #6d28d9;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.pe-familia-details { flex: 1; min-width: 0; }
.pe-familia-nome {
  display: block; font-size: 15px; font-weight: 800; color: var(--text);
  margin-bottom: 3px;
}
.pe-familia-meta {
  font-size: 12.5px; color: var(--text-3);
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
}
.pe-familia-ver-link {
  color: var(--blue); text-decoration: none; font-weight: 600; font-size: 12px;
}
.pe-familia-ver-link:hover { text-decoration: underline; }
.pe-familia-actions { display: flex; gap: 6px; flex-shrink: 0; }

/* Search no modal */
.pe-familia-search-wrap {
  display: flex; align-items: center; gap: 8px;
  border: 1.5px solid var(--border); border-radius: var(--r-md);
  padding: 8px 12px; margin-bottom: 14px;
  transition: border-color var(--t);
}
.pe-familia-search-wrap:focus-within { border-color: var(--blue); }
.pe-familia-search-input {
  border: none; outline: none; flex: 1;
  font-family: var(--font); font-size: 14px; color: var(--text);
  background: transparent;
}
.pe-familia-search-input::placeholder { color: var(--text-3); }

.pe-familia-results {
  max-height: 280px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px;
}
.pe-familia-results-hint {
  font-size: 13px; color: var(--text-3); text-align: center;
  padding: 20px 0; font-style: italic;
}

.pe-familia-result-item {
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px; padding: 10px 12px;
  background: var(--bg); border: 1px solid var(--border);
  border-radius: var(--r-md); transition: border-color var(--t);
}
.pe-familia-result-item:hover { border-color: var(--blue); }
.pe-familia-result-info { flex: 1; min-width: 0; }
.pe-familia-result-nome {
  display: block; font-size: 13.5px; font-weight: 700; color: var(--text);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.pe-familia-result-meta { font-size: 12px; color: var(--text-3); }

.modal-ag-sem-valores-aviso {
  display: flex; align-items: center; gap: 7px;
  padding: 10px 12px; border-radius: var(--r-md);
  background: var(--blue-lt); color: var(--blue);
  font-size: 12.5px; font-weight: 600;
  margin-bottom: 10px;
}
.modal-ag-sem-valores-aviso a {
  color: var(--blue); font-weight: 700; text-decoration: underline;
  margin-left: auto;
}


/* ── Estoque: saldo display ──────────────────────────────── */
.pe-estoque-saldo-row {
  display: flex; gap: 0;
  background: var(--bg); border-radius: var(--r-lg);
  border: 1px solid var(--border); margin-bottom: 16px;
  overflow: hidden;
}
.pe-estoque-saldo-item {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; padding: 14px 12px;
  border-right: 1px solid var(--border);
}
.pe-estoque-saldo-item:last-child { border-right: none; }
.pe-estoque-saldo-label {
  font-size: 10.5px; font-weight: 700; text-transform: uppercase;
  letter-spacing: .5px; color: var(--text-3); margin-bottom: 5px;
}
.pe-estoque-saldo-valor {
  font-size: 22px; font-weight: 900; color: var(--text);
  font-variant-numeric: tabular-nums;
}
.pe-estoque-saldo-valor--disp { color: var(--success); }
.pe-estoque-saldo-valor--res  { color: var(--warning); }

/* Ações de estoque */
.pe-estoque-actions {
  display: flex; gap: 8px; flex-wrap: wrap;
  margin-top: 14px; padding-top: 14px;
  border-top: 1px solid var(--border);
}

/* Tabs de operação no modal */
.estoque-operacao-tabs {
